"why": "`split(\"-\")` cuts the string wherever a \"-\" appears and removes the separator. That gives the pieces \"a\", \"b\" and \"c\", returned as a list. Printing a list shows square brackets and quotes around each string. Rule: `split` always returns a list of strings. Exam tip: if the output of split is printed directly, expect brackets and quotes.", "code": "print(\"a-b-c\".split(\"-\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"a-b-c\".split(\"-\"))", "fn": null, "t": "prints ['a', 'b', 'c']"}], "more": 0}}, {"n": 46, "section": "Strings and string methods", "options": ["x-y-z", "['x', 'y', 'z']", "-x-y-z-", "x y z"], "reasons": [null, "You thought the list is printed unchanged. join combines the elements into one string. A string prints without brackets or quotes.", "You put the separator at the ends as well. join only places it between elements. Three elements get two dashes.", "You used a space as separator. The separator is the string before `.join`, which is \"-\". `\" \".join(...)` would give x y z."], "correct": 1, "why": "`join` is called on the separator \"-\" and takes a list of strings. It puts the separator between neighbouring elements: \"x\" + \"-\" + \"y\" + \"-\" + \"z\". The result is the single string \"x-y-z\". Rule: `sep.join(list)` returns one string, with sep only between elements. Exam tip: n elements need n - 1 separators.", "code": "print(\"-\".join([\"x\", \"y\", \"z\"]))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"-\".join([\"x\", \"y\", \"z\"]))", "fn": null, "t": "prints x-y-z"}], "more": 0}}, {"n": 47, "section": "Strings and string methods", "options": ["2", "7", "8", "9"], "reasons": ["You counted words. `len` on a string counts characters. Only `len(\"hi there!\".split())` would give 2.", "You counted only the letters. The space and the \"!\" are both characters. Add them: 7 letters + 2 = 9.", "You did not count the space. A space is a character like any other. 2 + 1 + 5 + 1 = 9.", null], "correct": 4, "why": "`len` counts every character in the string. \"hi\" has 2, the space is 1, \"there\" has 5, and \"!\" is 1: 2 + 1 + 5 + 1 = 9. Rule: spaces and punctuation are characters and count like letters. Exam tip: count letters word by word, then add every space and symbol.", "code": "print(len(\"hi there!\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(len(\"hi there!\"))", "fn": null, "t": "prints 9"}], "more": 0}}, {"n": 48, "section": "Strings and string methods", "options": ["1 2", "2 2", "2 1", "3 2"], "reasons": ["You stopped after the first match. `count` counts all non-overlapping matches. \"an\" appears twice in banana.", null, "You started counting positions at 1 or counted the wrong letter. Indices start at 0: b = 0, a = 1, n = 2. So the first n is at index 2.", "You counted three \"an\" pieces. \"banana\" splits as b, an, an, a, so there are two. Mark each match in the word to be sure."], "correct": 2, "why": "`count(\"an\")` counts how often \"an\" appears: b-an-an-a, so 2 times. `find(\"n\")` returns the index of the first n. Counting from 0, b is 0, a is 1 and n is 2. Rule: `count` gives how many matches there are, `find` gives the position of the first match. Exam tip: write the indices under the letters for any find or index question.", "code": "print(\"banana\".count(\"an\"), \"banana\".find(\"n\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"banana\".count(\"an\"), \"banana\".find(\"n\"))", "fn": null, "t": "prints 2 2"}], "more": 0}}, {"n": 49, "section": "Strings and string methods", "options": ["PYTHON", "python", "Python", "P"], "reasons": ["You took the whole uppercase string. `[0]` selects only its first character. The rest comes from `word[1:].lower()`.", "You applied lower to the first letter too. The first part comes from `word.upper()[0]`, which is \"P\". Only the slice `word[1:]` is lowercased.", null, "You forgot the second part of the `+`. `word[1:]` adds \"ython\" after the P. Read the full expression inside print."], "correct": 3, "why": "`word.upper()` is \"PYTHON\", and `[0]` takes its first character \"P\". `word[1:]` is everything from index 1: \"ython\", and `.lower()` keeps it \"ython\". Joining gives \"P\" + \"ython\" = \"Python\". Rule: indexing and methods can be chained; each step works on the previous result. Exam tip: solve each side of the `+` separately.", "code": "word = \"Python\"\nprint(word.upper()[0] + word[1:].lower())", "trace": {"steps": [{"k": "line", "n": 1, "src": "word = \"Python\"", "fn": null, "t": "word = 'Python'"}, {"k": "line", "n": 2, "src": "print(word.upper()[0] + word[1:].lower())", "fn": null, "t": "prints Python"}], "more": 0}}, {"n": 50, "section": "Strings and string methods", "options": ["Ana will be 24", "{name} will be {age + 1}", "Ana will be 231", "Ana will be 23 + 1"], "reasons": [null, "You ignored the f before the string. With the f prefix, the braces are filled in. Only a normal string would print them as they are.", "You treated age as text and joined \"1\". age is the int 23, so `age + 1` adds. The result 24 is then inserted.", "You thought the expression is pasted in as text. The code inside the braces is evaluated, so 23 + 1 becomes 24. Only the result appears."], "correct": 1, "why": "The f before the quotes makes this an f-string. Python evaluates every expression inside curly braces and inserts the result. `{name}` becomes Ana and `{age + 1}` is computed as 24. Rule: inside the braces of an f-string you can write any expression, and it is calculated. Exam tip: check for the f prefix; without it the braces are printed literally.", "code": "name = \"Ana\"\nage = 23\nprint(f\"{name} will be {age + 1}\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "name = \"Ana\"", "fn": null, "t": "name = 'Ana'"}, {"k": "line", "n": 2, "src": "age = 23", "fn": null, "t": "age = 23"}, {"k": "line", "n": 3, "src": "print(f\"{name} will be {age + 1}\")", "fn": null, "t": "prints Ana will be 24"}], "more": 0}}, {"n": 51, "section": "Strings and string methods", "options": ["True True", "False False", "True False", "False True"], "reasons": ["You ignored the case in the first check. Z and z are different characters. Only after `.lower()` does the text start with z.", "You forgot that `.lower()` runs before `.startswith`. \"zurich\" starts with z, so the second check is True. Follow the chain left to right.", "You swapped the two results. The original starts with Z, which fails the check for z. The lowercased version passes it.", null], "correct": 4, "why": "\"Zurich\" begins with a capital Z, and `startswith(\"z\")` checks for a lowercase z, so it is False. In the second part, `.lower()` first gives \"zurich\", which does start with z, so it is True. Rule: string comparisons and checks are case-sensitive. Exam tip: when the case differs, apply `.lower()` or `.upper()` before checking.", "code": "print(\"Zurich\".startswith(\"z\"), \"Zurich\".lower().startswith(\"z\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"Zurich\".startswith(\"z\"), \"Zurich\".lower().startswith(\"z\"))", "fn": null, "t": "prints False True"}], "more": 0}}, {"n": 52, "section": "Strings and string methods", "options": ["5", "4", "6", "3"], "reasons": ["You may have counted one piece per comma plus two ends. There are 3 commas, so the string is cut into 3 + 1 = 4 pieces. Write out the list to check.", null, "You took the length of the original text. len is applied to the list returned by split. Count the pieces of the list.", "You dropped the empty piece. Between the two commas there is an empty string, which is still an element. 3 commas give 4 pieces."], "correct": 2, "why": "`split(\",\")` cuts at each of the 3 commas, giving 4 pieces. Between the two commas in a row there is nothing, so that piece is the empty string \"\". The list is ['a', 'b', '', 'c'] and its length is 4. Rule: with an explicit separator, split keeps empty pieces between neighbouring separators. Exam tip: k separators always give k + 1 pieces.", "code": "s = \"a,b,,c\"\nprint(len(s.split(\",\")))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"a,b,,c\"", "fn": null, "t": "s = 'a,b,,c'"}, {"k": "line", "n": 2, "src": "print(len(s.split(\",\")))", "fn": null, "t": "prints 4"}], "more": 0}}, {"n": 53, "section": "Strings and string methods", "options": ["doto", "dota", "Doto", "data"], "reasons": [null, "You replaced only the first a. replace changes every match unless a count is given. \"Data\" has two a's, so both become o.", "You stopped after the first replace. The second line turns D into d and is also stored in course. Apply every line in order.", "You applied only the D replacement to the original. The first line already changed both a's to o. Each result is stored and used by the next line."], "correct": 1, "why": "The first replace turns both a's into o: \"Data\" becomes \"Doto\", and that is stored in course. The second replace turns the capital D into d: \"doto\". Rule: replace returns a new string; assigning it back to the name keeps the change. Exam tip: track the string after every line with an `=`.", "code": "course = \"Data\"\ncourse = course.replace(\"a\", \"o\")\ncourse = course.replace(\"D\", \"d\")\nprint(course)", "trace": {"steps": [{"k": "line", "n": 1, "src": "course = \"Data\"", "fn": null, "t": "course = 'Data'"}, {"k": "line", "n": 2, "src": "course = course.replace(\"a\", \"o\")", "fn": null, "t": "course = 'Doto'"}, {"k": "line", "n": 3, "src": "course = course.replace(\"D\", \"d\")", "fn": null, "t": "course = 'doto'"}, {"k": "line", "n": 4, "src": "print(course)", "fn": null, "t": "prints doto"}], "more": 0}}, {"n": 54, "section": "Strings and string methods", "options": ["ha!ha!ha!", "TypeError", "haha!", "haha!!!"], "reasons": ["You treated it as (\"ha\" + \"!\") * 3. Each `*` applies only to the string right before it. So \"ha\" is repeated twice and \"!\" three times.", "Both operations here are allowed. `str * int` repeats a string and `str + str` joins two strings. No str + int occurs.", "You did not repeat the exclamation mark. `\"!\" * 3` gives three of them. Apply each `*` separately.", null], "correct": 4, "why": "`*` runs before `+`. \"ha\" * 2 is \"haha\" and \"!\" * 3 is \"!!!\". Then `+` joins them: \"haha!!!\". Rule: string repetition and joining follow the same precedence as multiplication and addition. Exam tip: compute each repeated part on its own, then join.", "code": "print(\"ha\" * 2 + \"!\" * 3)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"ha\" * 2 + \"!\" * 3)", "fn": null, "t": "prints haha!!!"}], "more": 0}}, {"n": 55, "section": "Strings and string methods", "options": ["hello", "heLLo", "TypeError", "heLlo"], "reasons": ["You thought the result is not used. Here the result of replace is passed straight to print. So the changed string is shown.", "You ignored the count argument. The 1 limits the replacement to the first match. Without it, both l's would change.", "You thought replace only takes two arguments. The third argument is an optional count. Python accepts it.", null], "correct": 4, "why": "replace takes an optional third argument, the maximum number of replacements. With 1, only the first l is changed, starting from the left. \"hello\" becomes \"heLlo\". Rule: `replace(old, new, count)` changes at most count matches from the left. Exam tip: always check whether replace has a third argument.", "code": "s = \"hello\"\nprint(s.replace(\"l\", \"L\", 1))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"hello\"", "fn": null, "t": "s = 'hello'"}, {"k": "line", "n": 2, "src": "print(s.replace(\"l\", \"L\", 1))", "fn": null, "t": "prints heLlo"}], "more": 0}}, {"n": 56, "section": "Strings and string methods", "options": ["3 fox", "13 FOX", "3 THE", "3 FOX"], "reasons": ["You forgot the `.upper()` call. It turns \"fox\" into \"FOX\" before print. Apply every method in the chain.", "You took the length of the original string. words is the list from split. Its length is the number of words.", "You took the first word. Index -1 is the last element of the list. `words[0]` would be \"the\".", null], "correct": 4, "why": "`split()` without arguments splits at whitespace and gives ['the', 'quick', 'fox']. The list has 3 elements, so `len(words)` is 3. `words[-1]` is the last element \"fox\", and `.upper()` gives \"FOX\". Rule: after split, len counts words and negative indices count from the end. Exam tip: write the list out before indexing.", "code": "words = \"the quick fox\".split()\nprint(len(words), words[-1].upper())", "trace": {"steps": [{"k": "line", "n": 1, "src": "words = \"the quick fox\".split()", "fn": null, "t": "words = ['the', 'quick', 'fox']"}, {"k": "line", "n": 2, "src": "print(len(words), words[-1].upper())", "fn": null, "t": "prints 3 FOX"}], "more": 0}}, {"n": 57, "section": "Strings and string methods", "options": ["4", "5", "TypeError", "2"], "reasons": [null, "You expected the second count to add 1. \"x\" does not contain y, so it gives 0. 4 + 0 = 4.", "You thought `+` here joins strings. Both count calls return ints. int + int is normal addition.", "You counted the \"ss\" pairs. count(\"s\") counts single characters, and there are four s. Mark each s in the word."], "correct": 1, "why": "`.lower()` gives \"mississippi\". Counting \"s\" gives 4 (two in \"ss\" and two in the second \"ss\"). `\"x\".count(\"y\")` is 0 because \"x\" contains no y. Both counts are ints, so 4 + 0 = 4. Rule: count returns an int, and 0 when there is no match. Exam tip: count returns a number, so `+` between two counts is addition.", "code": "print(\"Mississippi\".lower().count(\"s\") + \"x\".count(\"y\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"Mississippi\".lower().count(\"s\") + \"x\".count(\"y\"))", "fn": null, "t": "prints 4"}], "more": 0}}, {"n": 58, "section": "Strings and string methods", "options": ["Hello WORLD Hello World", "Hello world Hello World", "HELLO WORLD Hello World", "Hello world Hello WORLD"], "reasons": ["You thought capitalize only touches the first letter. It also lowercases all other letters, so WORLD becomes world. Only the very first character stays uppercase.", null, "You treated capitalize like upper. capitalize only puts the first character in uppercase. All the rest becomes lowercase.", "You thought title leaves uppercase words alone. title sets every word to a capital first letter followed by lowercase. WORLD becomes World."], "correct": 2, "why": "`capitalize()` makes the first character of the whole string uppercase and every other character lowercase: \"Hello world\". `title()` makes the first letter of every word uppercase and the rest lowercase: \"Hello World\". Both start from the original s, because the first call does not change it. Rule: capitalize works on the whole string once, title works on each word. Exam tip: both methods also lowercase all other letters.", "code": "s = \"hello WORLD\"\nprint(s.capitalize(), s.title())", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"hello WORLD\"", "fn": null, "t": "s = 'hello WORLD'"}, {"k": "line", "n": 2, "src": "print(s.capitalize(), s.title())", "fn": null, "t": "prints Hello world Hello World"}], "more": 0}}, {"n": 59, "section": "Strings and string methods", "options": ["data! 4", "--data--! 8", "data--! 8", "data! 8"], "reasons": ["You thought the second strip also removes the dashes, or that s changed after the first strip. `strip()` without argument only removes spaces, tabs and newlines. s is still \"--data--\", which has 8 characters.", "You thought `strip(\"-\")` does nothing because there are no spaces. With an argument, strip removes those characters at the ends. All leading and trailing dashes are removed.", "You removed the dashes on the left only. strip works on both ends, like lstrip and rstrip together. Both pairs of dashes are removed.", null], "correct": 4, "why": "`s.strip(\"-\")` removes dashes at both ends and gives \"data\", then + \"!\" gives \"data!\". `s.strip()` without an argument removes only whitespace. s has no spaces at its ends, so it stays \"--data--\" with 8 characters. Also, the first strip did not change s, since strings are immutable. Rule: strip removes whitespace by default and the given characters when you pass them. Exam tip: check the brackets of strip for an argument.", "code": "s = \"--data--\"\nprint(s.strip(\"-\") + \"!\", len(s.strip()))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"--data--\"", "fn": null, "t": "s = '--data--'"}, {"k": "line", "n": 2, "src": "print(s.strip(\"-\") + \"!\", len(s.strip()))", "fn": null, "t": "prints data! 8"}], "more": 0}}, {"n": 60, "section": "Strings and string methods", "options": ["None; ValueError", "ValueError", "-1; ValueError", "-1; -1"], "reasons": ["You thought find returns None for no match. find returns the number -1. That way the result is always an int.", "You forgot that the first line already ran. find never raises an error, so -1 is printed before the second line fails. Earlier output stays on the screen.", null, "You treated index like find. index does not return -1, it raises a ValueError when the substring is missing. Only find uses -1."], "correct": 3, "why": "\"python\" contains no z. `find` signals a missing match by returning -1, so the first line prints -1. `index` does the same search but raises a ValueError when nothing is found. The program stops there, after the first print. Rule: find returns -1 for no match, index raises ValueError. Exam tip: output printed before an error still appears.", "code": "s = \"python\"\nprint(s.find(\"z\"))\nprint(s.index(\"z\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"python\"", "fn": null, "t": "s = 'python'"}, {"k": "line", "n": 2, "src": "print(s.find(\"z\"))", "fn": null, "t": "prints -1"}, {"k": "line", "n": 3, "src": "print(s.index(\"z\"))", "fn": null, "t": "raises ValueError"}], "more": 0}}, {"n": 61, "section": "Strings and string methods", "options": ["True True False", "False True True", "True True True", "False True False"], "reasons": ["You ignored case in the first check and stopped at the space in the third. \"ana\" never appears in lowercase, and \"a A\" does appear across the two words. Check each substring against the exact text.", null, "You ignored the case in the first check. In s the letters are \"Ana\" with a capital A, which is not \"ana\". `in` compares characters exactly.", "You thought `in` cannot match across words. A substring can include spaces, and \"Data Analysis\" contains a, space, A in a row. So \"a A\" is found."], "correct": 2, "why": "`in` checks whether the left string appears somewhere in s, with exactly the same characters. \"ana\" is not there: \"Analysis\" starts with a capital A, and no lowercase \"ana\" appears anywhere, so it is False. \"Ana\" is at the start of \"Analysis\", so it is True. \"a A\" is the end of \"Data\", the space and the start of \"Analysis\", so it is True. Rule: `in` on strings is case-sensitive and spaces count as characters. Exam tip: search for the exact sequence, character by character.", "code": "s = \"Data Analysis\"\nprint(\"ana\" in s, \"Ana\" in s, \"a A\" in s)", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"Data Analysis\"", "fn": null, "t": "s = 'Data Analysis'"}, {"k": "line", "n": 2, "src": "print(\"ana\" in s, \"Ana\" in s, \"a A\" in s)", "fn": null, "t": "prints False True True"}], "more": 0}}, {"n": 62, "section": "Strings and string methods", "options": ["1014 2026/10/14", "24 14/10/2026", "1014 41/01/6202", "1014 14/10/2026"], "reasons": ["You forgot the `[::-1]`. It reverses the list before join. So the year comes last.", "You added 10 and 14 as numbers. The pieces from split are strings, so `+` joins them. You would need `int(parts[1]) + int(parts[2])` to get 24.", "You reversed the characters inside each piece. `[::-1]` on the list reverses the order of the elements only. Each string like \"2026\" stays as it is.", null], "correct": 4, "why": "`split(\"-\")` gives the list ['2026', '10', '14'], three strings. `parts[1] + parts[2]` joins \"10\" and \"14\" as text, giving \"1014\". `parts[::-1]` reverses the list order to ['14', '10', '2026'], and `\"/\".join(...)` gives \"14/10/2026\". Rule: split returns strings, so `+` joins them, and `[::-1]` on a list reverses the order of elements. Exam tip: pieces from split are still text, even if they look like numbers.", "code": "s = \"2026-10-14\"\nparts = s.split(\"-\")\nprint(parts[1] + parts[2], \"/\".join(parts[::-1]))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"2026-10-14\"", "fn": null, "t": "s = '2026-10-14'"}, {"k": "line", "n": 2, "src": "parts = s.split(\"-\")", "fn": null, "t": "parts = ['2026', '10', '14']"}, {"k": "line", "n": 3, "src": "print(parts[1] + parts[2], \"/\".join(parts[::-1]))", "fn": null, "t": "prints 1014 14/10/2026"}], "more": 0}}, {"n": 63, "section": "Strings and string methods", "options": ["zurich: 63", "Zurich: 6 3", "Zurich: 63", "Zurich: 18"], "reasons": ["You ignored the method call inside the braces. Methods inside braces run, so `name.title()` gives Zurich. Any expression in braces is evaluated.", "You added a space between the two values. There is no space between `}` and `{` in the code. So the values are written directly next to each other.", null, "You multiplied the two brace results together. Each pair of braces is filled in separately and turned into text. 6 and 3 next to each other read as 63."], "correct": 3, "why": "In an f-string, each pair of braces is evaluated separately. `{name.title()}` becomes \"Zurich\". `{n * 2}` becomes 6 and the next `{n}` becomes 3. The two braces stand directly next to each other, so the text is \"6\" followed by \"3\": \"63\". Rule: f-strings insert each result as text, exactly where its braces are. Exam tip: everything outside the braces, including spaces and the colon, is copied as it is.", "code": "name = \"zurich\"\nn = 3\nprint(f\"{name.title()}: {n * 2}{n}\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "name = \"zurich\"", "fn": null, "t": "name = 'zurich'"}, {"k": "line", "n": 2, "src": "n = 3", "fn": null, "t": "n = 3"}, {"k": "line", "n": 3, "src": "print(f\"{name.title()}: {n * 2}{n}\")", "fn": null, "t": "prints Zurich: 63"}], "more": 0}}, {"n": 64, "section": "Strings and string methods", "options": ["False False True", "False True True", "False True False", "True True False"], "reasons": ["You forgot that `.lower()` runs before the comparison. `a.lower()` gives \"hi\", which is exactly b. So the second comparison is True.", null, "You thought \"Hi\" equals \"HI\". `b.upper()` makes both letters capital, but a has a lowercase i. The strings differ, so `!=` is True.", "You compared the strings without looking at case. \"Hi\" and \"hi\" differ in the first letter, so `==` is False. In the third part \"Hi\" and \"HI\" also differ, so `!=` is True."], "correct": 2, "why": "`a == b` compares \"Hi\" with \"hi\"; H and h are different characters, so it is False. `a.lower()` is \"hi\", which equals b, so the second part is True. `b.upper()` is \"HI\", and \"Hi\" is different from \"HI\", so `!=` gives True. Rule: `==` and `!=` on strings compare every character, including its case. Exam tip: compute the method result first, then compare letter by letter.", "code": "a = \"Hi\"\nb = \"hi\"\nprint(a == b, a.lower() == b, a != b.upper())", "trace": {"steps": [{"k": "line", "n": 1, "src": "a = \"Hi\"", "fn": null, "t": "a = 'Hi'"}, {"k": "line", "n": 2, "src": "b = \"hi\"", "fn": null, "t": "b = 'hi'"}, {"k": "line", "n": 3, "src": "print(a == b, a.lower() == b, a != b.upper())", "fn": null, "t": "prints False True True"}], "more": 0}}, {"n": 65, "section": "Strings and string methods", "options": ["3 bab", "2 ba", "3 bb", "2 bb"], "reasons": ["You let matches overlap in both methods. Each a can belong to one match only. Two pairs give 2 and \"bb\".", "You replaced only the first pair. replace changes all non-overlapping matches when no count is given. Both pairs become b.", "You counted overlapping matches at positions 0, 1 and 2. count skips past each match, so the pairs are 0-1 and 2-3. That gives 2.", null], "correct": 4, "why": "Both count and replace scan from left to right and do not reuse characters that already matched. In \"aaaa\" the first match uses characters 0 and 1, the next starts at 2 and uses 2 and 3. So `count(\"aa\")` is 2, and replace turns both pairs into b, giving \"bb\". Rule: count and replace work with non-overlapping matches. Exam tip: after a match, continue the search right after it.", "code": "s = \"aaaa\"\nprint(s.count(\"aa\"), s.replace(\"aa\", \"b\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"aaaa\"", "fn": null, "t": "s = 'aaaa'"}, {"k": "line", "n": 2, "src": "print(s.count(\"aa\"), s.replace(\"aa\", \"b\"))", "fn": null, "t": "prints 2 bb"}], "more": 0}}, {"n": 66, "section": "Strings and string methods", "options": ["4 HI", "2 HI", "4 Hi", "2 Hi"], "reasons": [null, "You thought line 2 removed the spaces from s. The stripped string is not assigned, so s keeps its spaces. \" Hi \" has 4 characters.", "You forgot the `.upper()` in the print line. That chain is used directly, so its result is printed. \"Hi\" becomes \"HI\".", "You thought both earlier lines changed s and missed the upper in print. Unassigned method calls have no effect, so len(s) is 4. The chain inside print does apply strip and upper."], "correct": 1, "why": "Lines 2 and 3 compute new strings but never store them, so s is still \" Hi \" with 4 characters. In the print, `len(s)` is therefore 4. `s.strip().upper()` is computed right in the print: \"Hi\" and then \"HI\". Rule: a string method only has an effect when its result is used or assigned. Exam tip: look for `s = ...` before assuming s changed.", "code": "s = \" Hi \"\ns.strip()\ns.upper()\nprint(len(s), s.strip().upper())", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \" Hi \"", "fn": null, "t": "s = ' Hi '"}, {"k": "line", "n": 2, "src": "s.strip()", "fn": null, "t": ""}, {"k": "line", "n": 3, "src": "s.upper()", "fn": null, "t": ""}, {"k": "line", "n": 4, "src": "print(len(s), s.strip().upper())", "fn": null, "t": "prints 4 HI"}], "more": 0}}, {"n": 67, "section": "Strings and string methods", "options": ["False False REPORT", "False True Report", "True True REPORT", "False True REPORT"], "reasons": ["You thought the second check also fails. `.lower()` runs first and gives \"report.pdf\". That ends with \"pdf\", so it is True.", "You forgot the final `.upper()`. It is applied to \"Report\" after the split and index. The result is \"REPORT\".", "You ignored the case in the first check. \".PDF\" and \".pdf\" are different strings. Only after `.lower()` does the ending match.", null], "correct": 4, "why": "The file name ends with \".PDF\" in capitals, so `endswith(\".pdf\")` is False. `file.lower()` is \"report.pdf\", which ends with \"pdf\", so the second check is True. `file.split(\".\")` gives ['Report', 'PDF']; `[0]` is \"Report\" and `.upper()` gives \"REPORT\". Rule: endswith is case-sensitive, and methods after an index work on that element. Exam tip: lowercase both sides before checking a file extension.", "code": "file = \"Report.PDF\"\nprint(file.endswith(\".pdf\"), file.lower().endswith(\"pdf\"), file.split(\".\")[0].upper())", "trace": {"steps": [{"k": "line", "n": 1, "src": "file = \"Report.PDF\"", "fn": null, "t": "file = 'Report.PDF'"}, {"k": "line", "n": 2, "src": "print(file.endswith(\".pdf\"), file.lower().endswith(\"pdf\"), file.split(\".\")[0].upper())", "fn": null, "t": "prints False True REPORT"}], "more": 0}}, {"n": 68, "section": "Indexing and slicing", "options": ["uni", "ity", "rsity", "it"], "reasons": ["You probably read `-3` as `3` and took the slice from the front, like `x[:3]`. The minus sign means the counting starts at the end of the string.", null, "This is the last five characters, `x[-5:]`. You probably started counting at the wrong place. Count backwards from `y` = -1 to find where the slice starts.", "You probably treated the end of the slice as a stop that excludes the last character. There is no stop after the colon, so the slice runs to the very end and `y` is included. `x[-3:-1]` would give `it`."], "correct": 2, "why": "\"university\" has 10 characters. Counting from the end, `y` is -1, `t` is -2 and `i` is -3. `x[-3:]` starts at -3 and, because no stop is given, runs to the end of the string, so you get `ity`. Rule: a negative index means len + index, so -3 here is the same position as 10 - 3 = 7. Exam tip: `s[-n:]` always gives the last n characters.", "code": "x = \"university\"\nprint(x[-3:])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"university\"", "fn": null, "t": "x = 'university'"}, {"k": "line", "n": 2, "src": "print(x[-3:])", "fn": null, "t": "prints ity"}], "more": 0}}, {"n": 69, "section": "Indexing and slicing", "options": ["nvriy", "uiest", "ytisrevinu", "univ"], "reasons": ["You started at index 1, which would be `x[1::2]`. When the start is left empty, the slice begins at index 0, so `u` is the first character taken.", null, "This is the reversed string, which needs a negative step: `x[::-1]`. Here the step is +2, so the slice moves forward from the start and skips one character each time.", "You read `::2` as 'take the first few characters', like `x[:4]`. The number after the second colon is a step, so it skips every other character across the whole string."], "correct": 2, "why": "Number the characters of \"university\": u=0, n=1, i=2, v=3, e=4, r=5, s=6, i=7, t=8, y=9. `x[::2]` has no start and no stop, so it covers the whole string, and the step 2 takes every second index: 0, 2, 4, 6, 8. Those characters are u, i, e, s, t, so the result is `uiest`. Rule: in `s[start:stop:step]` an empty start means 0 and an empty stop means the end. Exam tip: write the index numbers under the word before you pick characters.", "code": "x = \"university\"\nprint(x[::2])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"university\"", "fn": null, "t": "x = 'university'"}, {"k": "line", "n": 2, "src": "print(x[::2])", "fn": null, "t": "prints uiest"}], "more": 0}}, {"n": 70, "section": "Indexing and slicing", "options": ["['b', 'c', 'd']", "['b', 'c']", "b c", "['a', 'b', 'c']"], "reasons": ["You included the stop index 3. A slice stops just before the stop index, so 'd' at index 3 is left out. The length check helps: 3 - 1 = 2 elements, and this option has three.", null, "You picked the right elements but printed them as separate values. A slice of a list is itself a list, and `print` shows a list with brackets and quotes. Only `print(L[1], L[2])` would print `b c`.", "You counted positions from 1, so you took 'a' as position 1. Python counts from 0, which makes 'b' index 1. `L[0:3]` would give this option."], "correct": 2, "why": "Positions: 'a' is 0, 'b' is 1, 'c' is 2, 'd' is 3. `L[1:3]` starts at index 1 and stops before index 3, so it takes indices 1 and 2: 'b' and 'c'. Slicing a list always gives a new list, so Python prints `['b', 'c']` with brackets and quotes. Rule: the stop index is never included, and the number of elements is stop minus start (3 - 1 = 2). Exam tip: quickly check that your answer has stop - start elements.", "code": "L = [\"a\", \"b\", \"c\", \"d\"]\nprint(L[1:3])", "trace": {"steps": [{"k": "line", "n": 1, "src": "L = [\"a\", \"b\", \"c\", \"d\"]", "fn": null, "t": "L = ['a', 'b', 'c', 'd']"}, {"k": "line", "n": 2, "src": "print(L[1:3])", "fn": null, "t": "prints ['b', 'c']"}], "more": 0}}, {"n": 71, "section": "Indexing and slicing", "options": ["IndexError", "['c'] ['c']", "c c", "c ['c']"], "reasons": ["You may have thought index 2 is out of range because the list has 3 elements. Valid indices for a list of length 3 are 0, 1 and 2, so 2 is the last valid one. An IndexError would need `L[3]`.", "You assumed indexing a list also returns a list. `L[2]` has no colon, so it returns the element itself, the string 'c', which `print` shows as `c`.", "You treated the slice like an index because it contains only one element. Any expression with a colon is a slice and returns a list, so `L[2:]` prints as `['c']`.", null], "correct": 4, "why": "`L[2]` uses a single index, so it returns the element at position 2, the string 'c'. `print` shows a string without quotes, so you see `c`. `L[2:]` is a slice from index 2 to the end; it contains only 'c', yet it is still a list, printed as `['c']`. Rule: a single index gives one element, a slice (anything with a colon) gives a list, even if that list has one element or none. Exam tip: look for the colon to know the type of the result.", "code": "L = [\"a\", \"b\", \"c\"]\nprint(L[2], L[2:])", "trace": {"steps": [{"k": "line", "n": 1, "src": "L = [\"a\", \"b\", \"c\"]", "fn": null, "t": "L = ['a', 'b', 'c']"}, {"k": "line", "n": 2, "src": "print(L[2], L[2:])", "fn": null, "t": "prints c ['c']"}], "more": 0}}, {"n": 72, "section": "Indexing and slicing", "options": ["Zzurich", "Zurich", "ZURICH", "zurich"], "reasons": ["You assumed `x[1:]` still contains the first character. The slice starts at index 1, so 'z' at index 0 is left out and the two pieces join without repeating it.", null, "You applied `.upper()` to the whole string. In the code it is attached to `x[0]` only, so just the first character changes and `x[1:]` stays lowercase.", "You may have thought nothing changes because strings are immutable. `x` itself is indeed unchanged, but `x[0].upper()` builds a new string 'Z', and the joined new string is what gets printed."], "correct": 2, "why": "`x[0]` is the first character 'z', and `.upper()` turns it into 'Z'. `x[1:]` is the slice from index 1 to the end, which is 'urich'. The `+` joins the two strings: 'Z' + 'urich' gives `Zurich`. Rule: `s[0]` and `s[1:]` split a string into its first character and the rest, with no overlap. Exam tip: this pattern is how you capitalize only the first letter by hand.", "code": "x = \"zurich\"\nprint(x[0].upper() + x[1:])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"zurich\"", "fn": null, "t": "x = 'zurich'"}, {"k": "line", "n": 2, "src": "print(x[0].upper() + x[1:])", "fn": null, "t": "prints Zurich"}], "more": 0}}, {"n": 73, "section": "Indexing and slicing", "options": ["30", "IndexError", "[]", "None"], "reasons": ["You counted positions starting at 1, so you took 30 as position 3. Python counts from 0, so 30 is at index 2, and index 3 would be a fourth element.", null, "You mixed up indexing and slicing. A slice like `x[3:]` would quietly return `[]`. `x[3]` has no colon and must return one real element, and since there is none, you get an IndexError.", "You assumed Python returns an empty value when an element is missing. A single index on a list raises IndexError for a missing position. Returning None for something missing is what dict `.get()` does."], "correct": 2, "why": "The list `[10, 20, 30]` has length 3, so its valid indices are 0, 1 and 2 (or -1, -2, -3 from the end). `x[3]` asks for a fourth element that does not exist, so Python raises an IndexError and nothing is printed. Rule: for a sequence of length n, a single index must be between 0 and n - 1, otherwise you get an IndexError. Exam tip: if the index equals `len(x)`, it is always one too far.", "code": "x = [10, 20, 30]\nprint(x[3])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = [10, 20, 30]", "fn": null, "t": "x = [10, 20, 30]"}, {"k": "line", "n": 2, "src": "print(x[3])", "fn": null, "t": "raises IndexError"}], "more": 0}}, {"n": 74, "section": "Indexing and slicing", "options": ["[20]", "[20, 30]", "IndexError", "[10, 20, 30]"], "reasons": ["You may have thought the slice stops early because 99 is invalid. Python treats the large stop as 'up to the end', so both 20 and 30 are included.", null, "You applied the rule for single indices to a slice. Slices clip a stop that is too large to the end of the list. Only `x[99]` without a colon would raise IndexError.", "You probably ignored the start value 1. The slice starts at index 1, so 10 at index 0 is not included. `x[0:99]` or `x[:]` would give the whole list."], "correct": 2, "why": "`x[1:99]` starts at index 1, the value 20. The stop 99 is far past the end, so Python simply cuts the slice at the real end of the list. The result holds the elements at indices 1 and 2: `[20, 30]`. Rule: slices are forgiving, so start and stop values outside the list are clipped to its limits and never raise an error. Exam tip: an out-of-range single index raises IndexError, an out-of-range slice never does.", "code": "x = [10, 20, 30]\nprint(x[1:99])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = [10, 20, 30]", "fn": null, "t": "x = [10, 20, 30]"}, {"k": "line", "n": 2, "src": "print(x[1:99])", "fn": null, "t": "prints [20, 30]"}], "more": 0}}, {"n": 75, "section": "Indexing and slicing", "options": ["e a", "o e", "e o", "apple orange"], "reasons": ["You took `fruits[-1]` as \"apple\". In a list of two elements, -1 is the last element, \"orange\", the same as index 1. Its first character is `o`.", "You swapped the two parts. The first expression `fruits[1][-1]` is the last letter `e`, then `fruits[-1][0]` is the first letter `o`, and print keeps that order.", null, "You stopped after the first index. Each expression has a second bracket that picks one character from the string, so the output consists of single letters."], "correct": 3, "why": "`fruits[1]` is \"orange\" (index 1 of the list), and `[-1]` then takes its last character, `e`. `fruits[-1]` is the last element of the list, which is also \"orange\" because the list has only two elements. Its `[0]` is the first character, `o`. Rule: with two indices in a row, the first picks an element of the list and the second picks a character of that string. Exam tip: work from left to right and write down the intermediate value after each bracket.", "code": "fruits = [\"apple\", \"orange\"]\nprint(fruits[1][-1], fruits[-1][0])", "trace": {"steps": [{"k": "line", "n": 1, "src": "fruits = [\"apple\", \"orange\"]", "fn": null, "t": "fruits = ['apple', 'orange']"}, {"k": "line", "n": 2, "src": "print(fruits[1][-1], fruits[-1][0])", "fn": null, "t": "prints e o"}], "more": 0}}, {"n": 76, "section": "Indexing and slicing", "options": ["2", "[4, 5]", "5", "6"], "reasons": ["You took `m[1]` as the first inner list `[1, 2, 3]`. Index 1 is the second element of `m`, which is `[4, 5, 6]`. In `[1, 2, 3]` the -2 would indeed be 2, so only the row is wrong.", "You read `[-2]` as a slice like `[:-1]`. There is no colon, so it picks one element and the result is a single number.", null, "You treated -2 like -1. Negative indices start at -1 for the last element, so -2 is the one before it, 5."], "correct": 3, "why": "`m` is a list of two lists. `m[1]` is the second inner list, `[4, 5, 6]`. In that list 6 is -1, 5 is -2 and 4 is -3, so `m[1][-2]` is 5. Rule: in nested lists the first index chooses the inner list (the row) and the second index chooses the element inside it. Exam tip: replace `m[1]` by its value on paper first, then apply the second index.", "code": "m = [[1, 2, 3], [4, 5, 6]]\nprint(m[1][-2])", "trace": {"steps": [{"k": "line", "n": 1, "src": "m = [[1, 2, 3], [4, 5, 6]]", "fn": null, "t": "m = [[1, 2, 3], [4, 5, 6]]"}, {"k": "line", "n": 2, "src": "print(m[1][-2])", "fn": null, "t": "prints 5"}], "more": 0}}, {"n": 77, "section": "Indexing and slicing", "options": ["y 1", "x 2", "KeyError", "y 2"], "reasons": ["You took -1 as the first element. Negative indices count from the end, so -1 is the last element of `[1, 2]`, which is 2.", "You counted from 1 in the string \"xyz\". Index 0 is x and index 1 is y, because Python starts counting at 0 for strings too.", "You may have thought every bracket after `d` is a dict lookup. Only the first bracket looks up a key, and \"a\" and \"b\" both exist. The next bracket indexes the value that was returned.", null], "correct": 4, "why": "`d[\"b\"]` looks up the key \"b\" and returns the string \"xyz\". Its index 1 is the second character, `y`. `d[\"a\"]` returns the list `[1, 2]`, and `[-1]` is its last element, 2. Rule: `d[key]` gives the value, and you can index that value directly if it is a string or a list. Exam tip: replace each `d[...]` by its value first, then apply the next index.", "code": "d = {\"a\": [1, 2], \"b\": \"xyz\"}\nprint(d[\"b\"][1], d[\"a\"][-1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "d = {\"a\": [1, 2], \"b\": \"xyz\"}", "fn": null, "t": "d = {'a': [1, 2], 'b': 'xyz'}"}, {"k": "line", "n": 2, "src": "print(d[\"b\"][1], d[\"a\"][-1])", "fn": null, "t": "prints y 2"}], "more": 0}}, {"n": 78, "section": "Indexing and slicing", "options": ["None Ana", "KeyError", "unknown None", "unknown Ana"], "reasons": ["You remembered that `.get` returns None for a missing key, but here a default is given. The second argument \"unknown\" is returned. None only appears when `.get` is called with one argument.", "You applied the behaviour of `d[\"age\"]` to `.get`. A missing key only raises KeyError with square brackets. `.get` handles a missing key by returning the default.", "You may have thought `.get` with one argument always returns None. The key \"name\" exists, so its value \"Ana\" is returned.", null], "correct": 4, "why": "`d.get(\"age\", \"unknown\")` looks for the key \"age\". It does not exist, so get returns the default given as the second argument, \"unknown\". `d.get(\"name\")` finds the key and returns \"Ana\". Rule: `d.get(key, default)` returns the value if the key exists, otherwise the default, and None if no default is given; it never raises KeyError. Exam tip: `d[key]` raises KeyError for a missing key, `d.get(key)` does not.", "code": "d = {\"name\": \"Ana\"}\nprint(d.get(\"age\", \"unknown\"), d.get(\"name\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "d = {\"name\": \"Ana\"}", "fn": null, "t": "d = {'name': 'Ana'}"}, {"k": "line", "n": 2, "src": "print(d.get(\"age\", \"unknown\"), d.get(\"name\"))", "fn": null, "t": "prints unknown Ana"}], "more": 0}}, {"n": 79, "section": "Indexing and slicing", "options": ["bdf", "ace", "bd", "bcde"], "reasons": ["You included index 5. The stop is excluded even when the step lands exactly on it, so f is missing.", "You started at index 0. The start here is 1, which is b. `x[0:5:2]` would start with a.", null, "You ignored the step and read only `x[1:5]`. The third number 2 means every second character, so c and e are skipped."], "correct": 3, "why": "Positions in \"abcdef\": a=0, b=1, c=2, d=3, e=4, f=5. `x[1:5:2]` starts at 1, moves in steps of 2 and stops before 5, so it takes indices 1 and 3. Those are b and d, giving `bd`. The next index would be 5, which is the stop and therefore excluded. Rule: list the indices start, start+step, start+2*step, ... and stop as soon as you reach or pass the stop. Exam tip: write the index list (1, 3) before translating it to characters.", "code": "x = \"abcdef\"\nprint(x[1:5:2])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"abcdef\"", "fn": null, "t": "x = 'abcdef'"}, {"k": "line", "n": 2, "src": "print(x[1:5:2])", "fn": null, "t": "prints bd"}], "more": 0}}, {"n": 80, "section": "Indexing and slicing", "options": ["fe", "ab", "ba", "ef"], "reasons": [null, "You applied `[:2]` to the original string. The reverse happens first, so the second slice sees \"fedcba\", whose first two characters are f and e.", "You took the first two characters of the original and then reversed them, which would be `x[:2][::-1]`. The order in the code is reverse first, then slice.", "You found the right characters but kept them in the original order. In \"fedcba\" f comes before e, so the slice prints `fe`."], "correct": 1, "why": "Python evaluates from left to right. `x[::-1]` reverses \"abcdef\" into \"fedcba\". Then `[:2]` takes the first two characters of that new string: `fe`. Rule: when slices are chained, each one works on the result of the previous one. Exam tip: write down the intermediate string after each slice.", "code": "x = \"abcdef\"\nprint(x[::-1][:2])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"abcdef\"", "fn": null, "t": "x = 'abcdef'"}, {"k": "line", "n": 2, "src": "print(x[::-1][:2])", "fn": null, "t": "prints fe"}], "more": 0}}, {"n": 81, "section": "Indexing and slicing", "options": ["(2, 3, 4) <class 'tuple'>", "(2, 3) <class 'tuple'>", "[2, 3] <class 'list'>", "(1, 2, 3) <class 'tuple'>"], "reasons": ["You included the stop index 3, which holds the value 4. The stop is excluded, so the slice ends after index 2.", null, "You assumed slicing always produces a list. Slicing keeps the type of the original, and `t = (1, 2, 3, 4)` with round brackets is a tuple.", "You started at index 0 or counted from 1. Index 1 holds the value 2, so the slice begins there. This option would be `t[0:3]`."], "correct": 2, "why": "`t` is a tuple: 1 at index 0, 2 at 1, 3 at 2, 4 at 3. `t[1:3]` takes indices 1 and 2, which hold 2 and 3. Slicing a tuple gives a tuple, so it prints as `(2, 3)` with round brackets, and its type is `<class 'tuple'>`. Rule: a slice has the same type as the object you slice: string gives string, list gives list, tuple gives tuple. Exam tip: the brackets in the output tell you the type, so check them.", "code": "t = (1, 2, 3, 4)\nprint(t[1:3], type(t[1:3]))", "trace": {"steps": [{"k": "line", "n": 1, "src": "t = (1, 2, 3, 4)", "fn": null, "t": "t = (1, 2, 3, 4)"}, {"k": "line", "n": 2, "src": "print(t[1:3], type(t[1:3]))", "fn": null, "t": "prints (2, 3) <class 'tuple'>"}], "more": 0}}, {"n": 82, "section": "Indexing and slicing", "options": ["elhi", "elh", "helh", "ell"], "reasons": ["You added the whole word \"hi\". The second index `[0]` picks just its first character, h. Only `words[0]` without the second bracket would give \"hi\".", null, "You started the slice at index 0 of \"hello\". `[1:3]` starts at index 1, which is e, and stops before index 3, so t"}], "more": 0}}, {"n": 84, "section": "Indexing and slicing", "options": ["noht", "ohty", "yth", "oht"], "reasons": ["You started at the end of the string (index 5). The start value 4 says where to begin, which is o. Only `x[:1:-1]` with an empty start would begin at n.", "You included the stop index 1 (y). The stop is excluded with a negative step too, so the slice ends at index 2.", "You read the slice as `x[1:4]` and ignored the step. Step -1 means you start at index 4 and go backwards, so the characters come out in reverse order.", null], "correct": 4, "why": "Positions in \"python\": p=0, y=1, t=2, h=3, o=4, n=5. With step -1 the slice moves backwards: it starts at index 4 (o), then 3 (h), then 2 (t), and it stops before index 1. So the result is `oht`. Rule: with a negative step, the start must be larger than the stop, and the stop is still excluded. Exam tip: list the indices 4, 3, 2 explicitly and stop when you reach the stop value.", "code": "x = \"python\"\nprint(x[4:1:-1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"python\"", "fn": null, "t": "x = 'python'"}, {"k": "line", "n": 2, "src": "print(x[4:1:-1])", "fn": null, "t": "prints oht"}], "more": 0}}, {"n": 85, "section": "Indexing and slicing", "options": ["IndexError", "[]; IndexError", "[]; None", "[]; []"], "reasons": ["You thought the slice already fails. Slices never raise IndexError, so `L[5:]` gives `[]` and that line prints. The error only comes on the second line.", null, "You assumed a missing element gives None. Lists raise IndexError for a missing index. None for a missing item only happens with `d.get(key)`.", "You applied the forgiving slice rule to the single index too. `L[5]` has no colon, so Python must return one element, and there is none. That raises IndexError."], "correct": 2, "why": "`L` has indices 0, 1 and 2. `L[5:]` is a slice that starts after the end of the list; slices clip their limits, so it returns an empty list and the first print shows `[]`. `L[5]` is a single index that does not exist, so the second line raises IndexError. The first line ran before the error, so the console shows both. Rule: out-of-range slices give an empty result, out-of-range indices raise IndexError. Exam tip: lines that run before an error still print their output.", "code": "L = [1, 2, 3]\nprint(L[5:])\nprint(L[5])", "trace": {"steps": [{"k": "line", "n": 1, "src": "L = [1, 2, 3]", "fn": null, "t": "L = [1, 2, 3]"}, {"k": "line", "n": 2, "src": "print(L[5:])", "fn": null, "t": "prints []"}, {"k": "line", "n": 3, "src": "print(L[5])", "fn": null, "t": "raises IndexError"}], "more": 0}}, {"n": 86, "section": "Indexing and slicing", "options": ["True False", "False False", "True True", "False True"], "reasons": [null, "You assumed indexing and slicing always give different types. Python has no separate character type, so `s[0]` is the string \"a\", exactly like `s[:1]`.", "You assumed the list case behaves like the string case. `L[0]` is the int 1 and `L[:1]` is the list `[1]`. An int and a list are never equal, so the result is False.", "You swapped the two cases. For strings the index and the slice of length 1 are equal strings. For lists the element 1 differs from the list `[1]`."], "correct": 1, "why": "`s[0]` is the character \"a\" and `s[:1]` is the slice of length 1, also \"a\". Both are strings with the same content, so `s[0] == s[:1]` is True. For the list, `L[0]` is the number 1, while `L[:1]` is the list `[1]`. A number is never equal to a list, so the second comparison is False. Rule: indexing a string gives a string of length 1, so it matches a slice of length 1; indexing a list gives the stored element, and slicing a list always gives a list. Exam tip: on lists, `L[i]` and `L[i:i+1]` have different types.", "code": "s = \"abc\"\nL = [1, 2, 3]\nprint(s[0] == s[:1], L[0] == L[:1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"abc\"", "fn": null, "t": "s = 'abc'"}, {"k": "line", "n": 2, "src": "L = [1, 2, 3]", "fn": null, "t": "L = [1, 2, 3]"}, {"k": "line", "n": 3, "src": "print(s[0] == s[:1], L[0] == L[:1])", "fn": null, "t": "prints True False"}], "more": 0}}, {"n": 87, "section": "Indexing and slicing", "options": ["3 3 9", "3 2 11", "3 3 11", "6 3 11"], "reasons": ["You used `m[1][0]` (3) for the last part. -1 is the last element of `[3, 4, 5]`, which is 5, and 6 + 5 = 11.", "You took `m[1]` as the first inner list `[1, 2]`. Index 1 is the second inner list, `[3, 4, 5]`, which has 3 elements.", null, "You counted all the numbers in all inner lists. `len(m)` counts only the elements of `m` itself, which are three lists."], "correct": 3, "why": "`m` contains three inner lists, so `len(m)` is 3; len only counts the top-level elements. `m[1]` is `[3, 4, 5]`, so `len(m[1])` is 3. `m[-1]` is the last inner list `[6]`, and its `[0]` is 6. `m[1][-1]` is the last element of `[3, 4, 5]`, which is 5. 6 + 5 = 11. Rule: a list inside a list counts as one element for len. Exam tip: resolve each index chain to a single number before adding.", "code": "m = [[1, 2], [3, 4, 5], [6]]\nprint(len(m), len(m[1]), m[-1][0] + m[1][-1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "m = [[1, 2], [3, 4, 5], [6]]", "fn": null, "t": "m = [[1, 2], [3, 4, 5], [6]]"}, {"k": "line", "n": 2, "src": "print(len(m), len(m[1]), m[-1][0] + m[1][-1])", "fn": null, "t": "prints 3 3 11"}], "more": 0}}, {"n": 88, "section": "Indexing and slicing", "options": ["None; KeyError", "None; None", "KeyError", "0; 0"], "reasons": [null, "You treated `d[\"c\"]` like `.get`. Square brackets require the key to exist. Since \"c\" is missing, Python raises KeyError.", "You assumed `.get` also fails for a missing key. `.get` is the safe lookup and returns None here, so `None` is printed before the error on the second line.", "You assumed a missing key gives 0, like a counter. Python has no automatic default: `.get` gives None and brackets raise KeyError. Only `d.get(\"c\", 0)` would give 0."], "correct": 1, "why": "The first line uses `.get` with one argument. The key \"c\" is missing and no default is given, so get returns None and `print` shows `None`. The second line uses square brackets, and a missing key with `d[key]` raises a KeyError, so the program stops there. The first output was already printed, so the console shows `None` and then the error. Rule: `d[key]` raises KeyError for a missing key, `d.get(key)` returns None (or the default you pass). Exam tip: always check whether the code uses brackets or `.get`.", "code": "d = {\"a\": 1, \"b\": 2}\nprint(d.get(\"c\"))\nprint(d[\"c\"])", "trace": {"steps": [{"k": "line", "n": 1, "src": "d = {\"a\": 1, \"b\": 2}", "fn": null, "t": "d = {'a': 1, 'b': 2}"}, {"k": "line", "n": 2, "src": "print(d.get(\"c\"))", "fn": null, "t": "prints None"}, {"k": "line", "n": 3, "src": "print(d[\"c\"])", "fn": null, "t": "raises KeyError"}], "more": 0}}, {"n": 89, "section": "Indexing and slicing", "options": ["pn; th; oy", "py; th; on", "pp; to; ot", "pn; th"], "reasons": [null, "You paired each character with its neighbour, `word[i + 1]`. The second index is `-i - 1`, which counts from the end. For i = 0 that is the last letter, n.", "You used `word[-i]` and forgot the `- 1`. With i = 0 that would be `word[-0]`, which is `word[0]`. The code subtracts 1, so the first round uses `word[-1]`, which is n.", "You stopped the range too early. `range(0, 6, 2)` gives 0, 2 and 4, because 4 is still below the stop 6. So there are three rounds."], "correct": 1, "why": "`len(word)` is 6, so `range(0, 6, 2)` gives i = 0, 2, 4. For i = 0: `word[0]` is p and `word[-1]` is n, so `pn`. For i = 2: `word[2]` is t and `word[-3]` is h, so `th`. For i = 4: `word[4]` is o and `word[-5]` is y, so `oy`. Rule: `word[-i - 1]` is the mirror position of `word[i]`, counted from the end. Exam tip: compute the negative index as a number for each round (-1, -3, -5) before looking up the letter.", "code": "word = \"python\"\nfor i in range(0, len(word), 2):\n    print(word[i] + word[-i - 1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "word = \"python\"", "fn": null, "t": "word = 'python'"}, {"k": "line", "n": 2, "src": "for i in range(0, len(word), 2):", "fn": null, "t": "i = 0"}, {"k": "line", "n": 3, "src": "print(word[i] + word[-i - 1])", "fn": null, "t": "prints pn"}, {"k": "line", "n": 2, "src": "for i in range(0, len(word), 2):", "fn": null, "t": "i = 2"}, {"k": "line", "n": 3, "src": "print(word[i] + word[-i - 1])", "fn": null, "t": "prints th"}, {"k": "line", "n": 2, "src": "for i in range(0, len(word), 2):", "fn": null, "t": "i = 4"}, {"k": "line", "n": 3, "src": "print(word[i] + word[-i - 1])", "fn": null, "t": "prints oy"}, {"k": "line", "n": 2, "src": "for i in range(0, len(word), 2):", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 90, "section": "Indexing and slicing", "options": ["40 [50, 30, 10]", "30 (50, 30, 10)", "40 (50, 30, 10)", "40 (10, 30, 50)"], "reasons": ["You assumed a slice always returns a list. Slicing a tuple gives a tuple, so the output uses round brackets.", "You counted -2 as two steps away from the last element. -1 is already the last element (50), so -2 is the one just before it, 40.", null, "You took every second element and kept the forward order. The negative step means the slice runs from the end towards the start, so 50 comes first."], "correct": 3, "why": "`t[-2]` counts from the end: 50 is -1 and 40 is -2, so the first value is 40. `t[::-2]` has no start, no stop and a negative step, so it starts at the last element and goes backwards, taking every second one: 50, 30, 10. A slice of a tuple is a tuple, printed with round brackets: `(50, 30, 10)`. Rule: with a negative step and an empty start, the slice begins at the end. Exam tip: for `[::-2]`, reverse first, then take every second element.", "code": "t = (10, 20, 30, 40, 50)\nprint(t[-2], t[::-2])", "trace": {"steps": [{"k": "line", "n": 1, "src": "t = (10, 20, 30, 40, 50)", "fn": null, "t": "t = (10, 20, 30, 40, 50)"}, {"k": "line", "n": 2, "src": "print(t[-2], t[::-2])", "fn": null, "t": "prints 40 (50, 30, 10)"}], "more": 0}}, {"n": 91, "section": "Indexing and slicing", "options": ["True leve", "True evel", "True eve", "False eve"], "reasons": ["You started the slice at index 0. The start 1 skips the first l. `w[:-1]` would give leve.", "You included the stop index -1. The stop is excluded, and -1 is the last character l, so the slice ends before it.", null, "You may have thought reversing always gives a different string. \"level\" read backwards is still \"level\", so `==` gives True."], "correct": 3, "why": "`w[::-1]` reverses \"level\", which gives \"level\" again because the word is a palindrome, so the comparison is True. \"level\" has the indices l=0, e=1, v=2, e=3, l=4, and -1 is index 4. `w[1:-1]` starts at index 1 and stops before index 4, so it takes 1, 2, 3: `eve`. Rule: `s[1:-1]` removes the first and the last character. Exam tip: convert -1 to len - 1 (here 4) to see where the slice stops.", "code": "w = \"level\"\nprint(w == w[::-1], w[1:-1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "w = \"level\"", "fn": null, "t": "w = 'level'"}, {"k": "line", "n": 2, "src": "print(w == w[::-1], w[1:-1])", "fn": null, "t": "prints True eve"}], "more": 0}}, {"n": 92, "section": "Indexing and slicing", "options": ["Cleo", "C", "B", "IndexError"], "reasons": ["You stopped one step early. The last `[0]` picks the first character of \"Cleo\", so only C is printed.", null, "You applied `[1]` to the original positions, where index 1 is \"Ben\". After slicing, the new list starts with \"Ben\" at index 0, so `[1]` is \"Cleo\".", "You may have thought the slice keeps only one element or keeps the old index numbers. `names[1:3]` has two elements, at the new indices 0 and 1, so index 1 exists."], "correct": 2, "why": "First `names[1:3]` takes indices 1 and 2: `[\"Ben\", \"Cleo\"]`. This is a new list with its own positions: \"Ben\" is now 0 and \"Cleo\" is 1. So `[1]` gives \"Cleo\", and `[0]` gives its first letter, `C`. Rule: a slice creates a new list whose indices start again at 0. Exam tip: write the intermediate list after the slice and number it from 0.", "code": "names = [\"Ana\", \"Ben\", \"Cleo\", \"Dan\"]\nprint(names[1:3][1][0])", "trace": {"steps": [{"k": "line", "n": 1, "src": "names = [\"Ana\", \"Ben\", \"Cleo\", \"Dan\"]", "fn": null, "t": "names = ['Ana', 'Ben', 'Cleo', 'Dan']"}, {"k": "line", "n": 2, "src": "print(names[1:3][1][0])", "fn": null, "t": "prints C"}], "more": 0}}, {"n": 93, "section": "Indexing and slicing", "options": ["A 5; B 3", "A 4; B 6", "A [4, 5]; B [6, 3]", "ANA 5; BEN 3"], "reasons": [null, "You took index -1 as the first element. -1 is the last element of each list, so you get 5 and 3.", "You forgot the `[-1]` after the lookup. `scores[name]` gives the whole list, and `[-1]` then picks one element from it.", "You applied `.upper()` to the whole key. `name[0]` picks only the first letter before upper is called, so each line starts with a single capital letter."], "correct": 1, "why": "Looping over a dict gives its keys in insertion order: first \"ana\", then \"ben\". For \"ana\": `name[0]` is a, upper makes it A, and `scores[\"ana\"][-1]` is the last element of `[4, 5]`, which is 5. For \"ben\": B and the last element of `[6, 3]`, which is 3. Each round prints one line. Rule: `for k in d` iterates over the keys, and `d[k]` gives the value for that key. Exam tip: write the value next to each key before applying the index.", "code": "scores = {\"ana\": [4, 5], \"ben\": [6, 3]}\nfor name in scores:\n    print(name[0].upper(), scores[name][-1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "scores = {\"ana\": [4, 5], \"ben\": [6, 3]}", "fn": null, "t": "scores = {'ana': [4, 5], 'ben': [6, 3]}"}, {"k": "line", "n": 2, "src": "for name in scores:", "fn": null, "t": "name = 'ana'"}, {"k": "line", "n": 3, "src": "print(name[0].upper(), scores[name][-1])", "fn": null, "t": "prints A 5"}, {"k": "line", "n": 2, "
