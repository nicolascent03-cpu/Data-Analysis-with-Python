/* ---------------- progress model ----------------
   first[n]  : true/false, your very first answer to question n
   att[n]    : {r, w, last, t}  right / wrong attempts (first tap per view), last result (1/0), time
   stars[n]  : {on, t}
   exams     : [{id, t, size, right, ms}]
   days      : {"2026-10-14": answers that day}
   opts      : {includeDone}
*/
function blank() { return { v: 3, first: {}, att: {}, stars: {}, exams: [], days: {}, opts: { includeDone: false }, updated: 0 }; }
let P = blank();
try {
  const raw = localStorage.getItem(LKEY);
  if (raw) P = Object.assign(blank(), JSON.parse(raw));
  else {
    const old = JSON.parse(localStorage.getItem("pyquiz-progress-v2") || "null");
    if (old && typeof old === "object") Object.keys(old).forEach(n => {
      P.first[n] = !!old[n];
      P.att[n] = { r: old[n] ? 1 : 0, w: old[n] ? 0 : 1, last: old[n] ? 1 : 0, t: Date.now() };
    });
  }
} catch (e) {}

function merge(a, b) {
  const m = blank();
  m.first = Object.assign({}, b.first || {}, a.first || {});
  const atts = Object.assign({}, a.att || {});
  Object.entries(b.att || {}).forEach(([n, x]) => {
    const y = atts[n];
    if (!y || (x.r + x.w) > (y.r + y.w) || ((x.r + x.w) === (y.r + y.w) && x.t > y.t)) atts[n] = x;
  });
  m.att = atts;
  const st = Object.assign({}, a.stars || {});
  Object.entries(b.stars || {}).forEach(([n, x]) => { if (!st[n] || x.t > st[n].t) st[n] = x; });
  m.stars = st;
  const ex = {}; [...(a.exams || []), ...(b.exams || [])].forEach(e => ex[e.id] = e);
  m.exams = Object.values(ex).sort((x, y) => x.t - y.t).slice(-100);
  const d = Object.assign({}, a.days || {});
  Object.entries(b.days || {}).forEach(([k, v]) => d[k] = Math.max(d[k] || 0, v));
  m.days = d;
  m.opts = (a.updated >= b.updated ? a.opts : b.opts) || { includeDone: false };
  m.updated = Math.max(a.updated || 0, b.updated || 0);
  return m;
}

/* ---------------- saving: this device + your claude.ai account ---------------- */
let cloud = null;          // DocumentReference when account saving works
let syncState = "local";   // local | cloud | busy | error
let saveTimer = null, writing = false, dirty = false;

function persist() {
  P.updated = Date.now();
  try { localStorage.setItem(LKEY, JSON.stringify(P)); } catch (e) {}
  if (!cloud) return;
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 1200);
}
async function flush() {
  if (!cloud || writing || !dirty) return;
  writing = true; dirty = false; setSync("busy");
  try { await cloud.set(JSON.parse(JSON.stringify(P))); setSync("cloud"); }
  catch (e) {
    if (e && (e.code === "unavailable")) { dirty = true; setTimeout(flush, 1500 + Math.random() * 1500); setSync("busy"); }
    else setSync("error");
  }
  writing = false;
  if (dirty) { clearTimeout(saveTimer); saveTimer = setTimeout(flush, 800); }
}
function setSync(s) {
  syncState = s;
  const el = document.getElementById("sync");
  if (el) { el.className = "sync " + syncClass(); el.innerHTML = syncHtml(); }
}
function syncClass() { return syncState === "cloud" ? "cloud" : syncState === "busy" ? "busy" : "local"; }
function syncHtml() {
  return "<i></i>" + ({ cloud: "Saved to your account", busy: "Saving…", local: "Saved on this device only", error: "Account save failed, saved on this device" })[syncState];
}
async function pullCloud() {
  if (!cloud) return;
  try {
    const snap = await cloud.get();
    if (snap.exists) {
      const before = JSON.stringify(P);
      P = merge(P, snap.data());
      try { localStorage.setItem(LKEY, JSON.stringify(P)); } catch (e) {}
      if (JSON.stringify(P) !== before && view === "home") home();
      if (JSON.stringify(P) !== JSON.stringify(snap.data())) { dirty = true; flush(); } else setSync("cloud");
    } else if (Object.keys(P.att).length || P.exams.length) { dirty = true; flush(); }
    else setSync("cloud");
  } catch (e) { setSync("error"); }
}
async function connectCloud() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    cloud = db.doc("data/users/" + uid + "/progress");
    setSync("busy");
    await pullCloud();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullCloud(); else flush(); });
  } catch (e) { cloud = null; setSync("local"); }
}

const navin = document.getElementById("navin");
let S = null, timerId = null, confirmReset = false, backupMsg = null, view = "home";

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function rich(s) { return esc(s).replace(/`([^`]+)`/g, "<code>$1</code>"); }
function highlight(code) {
  const kws = /\b(def|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|break|continue|pass|print|range|len|import|from)\b/g;
  return code.split("\n").map(line => {
    const parts = line.split(/("(?:[^"\\]|\\.)*")/g);
    return parts.map((p, i) => i % 2 ? '<span class="str">' + esc(p) + '</span>'
      : esc(p).replace(kws, '<span class="kw">$1</span>').replace(/\b(\d+(?:\.\d+)?)\b/g, '<span class="num">$1</span>')).join("");
  }).join("\n");
}
function traceHtml(q, open) {
  const t = q.trace; if (!t || !t.steps.length) return "";
  const items = t.steps.map(st => {
    if (st.k !== "line") return `<li class="${st.k}"><span class="ln"></span><span class="body">${esc(st.t)}</span></li>`;
    const eff = st.t ? esc(st.t).replace(/raises (\w+)/, '<span class="err">raises $1</span>').replace(/condition is (True|False)/, "condition is <b>$1</b>") : "runs";
    return `<li><span class="ln">L${st.n}</span><span class="body"><code>${esc(st.src)}</code>${st.fn ? ` <span class="muted small">in ${esc(st.fn)}()</span>` : ""}<span class="eff">→ ${eff}</span></span></li>`;
  }).join("");
  return `<details class="steps"${open ? " open" : ""}><summary>Step by step: what Python does line by line</summary><ol>${items}</ol>${t.more ? `<p class="small muted">… ${t.more} more steps</p>` : ""}</details>`;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function ids(section) { return DATA.questions.filter(q => !section || q.section === section).map(q => q.n); }
function done(n) { return n in P.att; }
function needsReview(n) { return P.att[n] && P.att[n].last === 0; }
function starred(n) { return P.stars[n] && P.stars[n].on; }
function today() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function dayKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function streak() {
  let s = 0; const d = new Date();
  if (!P.days[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (P.days[dayKey(d)]) { s++; d.setDate(d.getDate() - 1); }
  return s;
}
function fmt(ms) { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function pct(a, b) { return b ? Math.round(100 * a / b) : 0; }
function record(n, correct) {
  if (!(n in P.first)) P.first[n] = correct;
  const a = P.att[n] || { r: 0, w: 0, last: 0, t: 0 };
  if (correct) a.r++; else a.w++;
  a.last = correct ? 1 : 0; a.t = Date.now();
  P.att[n] = a;
  const k = today(); P.days[k] = (P.days[k] || 0) + 1;
  persist();
}
function pool(list) {
  // respects the "include answered" toggle, falls back to everything if nothing is left
  if (P.opts.includeDone) return list;
  const open = list.filter(n => !done(n));
  return open.length ? open : null;
}

/* ---------------- home ---------------- */
function home() {
  view = "home"; stopTimer(); S = null; nav.hidden = true;
  const answered = Object.keys(P.att).length;
  const firstRight = Object.values(P.first).filter(Boolean).length;
  const firstN = Object.keys(P.first).length;
  const review = ids().filter(needsReview).length;
  const stars = ids().filter(starred).length;
  const inc = P.opts.includeDone;
  const rows = SECTIONS.map((s, i) => {
    const ns = ids(s); const d = ns.filter(done); const r = d.filter(n => P.att[n].last === 1);
    const g = 100 * r.length / ns.length, b = 100 * (d.length - r.length) / ns.length;
    return `<button class="topic" data-sec="${i}">
      <span class="name">${i + 1}. ${esc(s)}</span><span class="count">${d.length}/${ns.length}</span>
      <span class="bar" title="${r.length} right, ${d.length - r.length} to review, ${ns.length - d.length} not done"><i class="g" style="width:${g}%"></i><i class="r" style="width:${b}%"></i></span></button>`;
  }).join("");
  app.innerHTML = `
    <div class="hero">
      <div class="qhead"><span class="label">Data Analysis with Python · Fundamentals quiz</span><span id="sync" class="sync ${syncClass()}">${syncHtml()}</span></div>
      <h1>What will be printed in the console?</h1>
      <p class="muted">${TOTAL} multiple-choice questions in the format of the real quiz. Tap an answer to get feedback, a detailed explanation and a line-by-line trace.</p>
    </div>
    <div class="stats4">
      <div class="stat"><b>${answered}<span class="small muted">/${TOTAL}</span></b><span class="small muted">answered</span></div>
      <div class="stat"><b>${pct(firstRight, firstN)}%</b><span class="small muted">right first try</span></div>
      <div class="stat"><b>${review}</b><span class="small muted">to review</span></div>
      <div class="stat"><b>${streak()}</b><span class="small muted">day streak</span></div>
    </div>
    <div class="actions">
      <button class="btn primary" id="exam15">Exam simulation<span class="sub">15 questions · 15 min</span></button>
      <button class="btn" id="exam30">Long exam<span class="sub">30 questions · 30 min</span></button>
      <button class="btn" id="redo" ${review ? "" : "disabled"}>Review mistakes<span class="sub">${review} where your last answer was wrong</span></button>
      <button class="btn" id="stars" ${stars ? "" : "disabled"}>Starred<span class="sub">${stars} saved for later</span></button>
      <button class="btn" id="mix">Shuffle<span class="sub">${inc ? "all " + TOTAL + " questions" : (TOTAL - answered) + " not done yet"}</span></button>
      <button class="btn" id="next">In order<span class="sub">${inc ? "from question 1" : "next not done"}</span></button>
    </div>
    <div class="toggle"><input type="checkbox" id="inc" ${inc ? "checked" : ""}><label for="inc"><b>Include questions I already answered</b><br><span class="small muted">Off: Shuffle, In order and topics only show questions you have not done yet.</span></label></div>
    <div class="label">Practice by topic</div>
    <div class="topics">${rows}</div>
    <div class="footer-links"><button class="linkish small" id="statsbtn">Statistics</button><button class="linkish small" id="backup">Backup and restore</button><button class="linkish small" id="reset">Reset progress</button></div>
    <div class="confirm" id="resetbox" ${confirmReset ? "" : "hidden"}><span class="small">Delete all saved answers, stars and exam results?</span><button class="btn" id="resetyes">Yes, reset</button><button class="btn" id="resetno">Cancel</button></div>`;
  const allDoneMsg = () => { P.opts.includeDone = true; persist(); };
  app.querySelectorAll(".topic").forEach(b => b.onclick = () => {
    const s = SECTIONS[+b.dataset.sec]; let list = pool(ids(s));
    if (!list) { list = ids(s); }
    startPractice(list, s);
  });
  document.getElementById("exam15").onclick = () => startExam(15);
  document.getElementById("exam30").onclick = () => startExam(30);
  document.getElementById("redo").onclick = () => startPractice(shuffle(ids().filter(needsReview)), "Review mistakes");
  document.getElementById("stars").onclick = () => startPractice(ids().filter(starred), "Starred questions");
  document.getElementById("mix").onclick = () => { const l = pool(ids()); startPractice(shuffle(l || ids()), l && !inc ? "Shuffle: not done yet" : "Shuffle: all questions"); };
  document.getElementById("next").onclick = () => { const l = pool(ids()); startPractice(l || ids(), l && !inc ? "In order: not done yet" : "In order: all questions"); };
  document.getElementById("inc").onchange = e => { P.opts.includeDone = e.target.checked; persist(); home(); };
  document.getElementById("statsbtn").onclick = statsView;
  document.getElementById("backup").onclick = () => { backupMsg = null; backupView(); };
  document.getElementById("reset").onclick = () => { confirmReset = true; home(); };
  document.getElementById("resetyes").onclick = () => { P = blank(); persist(); confirmReset = false; home(); };
  document.getElementById("resetno").onclick = () => { confirmReset = false; home(); };
  window.scrollTo(0, 0);
}

/* ---------------- practice and exam ---------------- */
function startPractice(list, title) {
  if (!list || !list.length) return;
  S = { mode: "practice", list, title, i: 0, state: {} };
  render();
}
function startExam(size) {
  let base = P.opts.includeDone ? ids() : ids().filter(n => !done(n));
  if (base.length < size) base = ids();
  S = { mode: "exam", list: shuffle(base).slice(0, size), title: "Exam simulation", i: 0, state: {}, size, start: Date.now(), end: Date.now() + size * 60 * 1000 };
  stopTimer(); timerId = setInterval(tick, 1000);
  render();
}
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
function tick() {
  const el = document.getElementById("timer"); if (!S || S.mode !== "exam") return stopTimer();
  const left = Math.max(0, S.end - Date.now());
  if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 120000); }
  if (left <= 0) finishExam();
}

function render() {
  view = "quiz";
  const n = S.list[S.i], q = Q[n], st = S.state[n] || (S.state[n] = { tried: [], solved: false, revealed: false, pick: null });
  const exam = S.mode === "exam";
  const answered = exam ? Object.values(S.state).filter(x => x.pick).length : 0;
  const opts = q.options.map((t, k) => {
    const o = k + 1; let cls = "opt";
    if (exam) { if (st.pick === o) cls += " picked"; }
    else {
      if (st.tried.includes(o)) cls += o === q.correct ? " ok" : " bad";
      else if (st.revealed && o === q.correct) cls += " ok";
    }
    return `<button class="${cls}" data-o="${o}"><span class="k">${o})</span><span class="t">${esc(t)}</span></button>`;
  }).join("");
  let fb = "";
  if (!exam) {
    const last = st.tried[st.tried.length - 1];
    if (st.solved || st.revealed) {
      const first = st.tried[0] === q.correct;
      fb = `<div class="fb ok"><span class="verdict">${st.revealed && !st.solved ? "Answer: option " + q.correct : first ? "Correct" : "Correct, on a later try"}</span><p>${rich(q.why)}</p>${traceHtml(q, true)}</div>`;
    } else if (last) {
      fb = `<div class="fb bad"><span class="verdict">Not option ${last}</span><p>${rich(q.reasons[last - 1])}</p>
        <p class="small muted">Try another option, or <button class="linkish small" id="reveal">show the answer</button>.</p></div>`;
    }
  }
  const hist = P.att[n];
  const histTxt = !exam && hist ? `<span class="small muted">Before: ${hist.r} right, ${hist.w} wrong</span>` : "";
  app.innerHTML = `
    <div class="qhead">
      <button class="linkish small" id="back">← ${exam ? "Quit exam" : "Home"}</button>
      <span class="right">
        ${exam ? `<span class="pill timer" id="timer">${fmt(S.end - Date.now())}</span>` : `<button class="star ${starred(n) ? "on" : ""}" id="star" aria-pressed="${starred(n)}">${starred(n) ? "★ Starred" : "☆ Star"}</button>`}
        <span class="pill">${S.i + 1} / ${S.list.length}</span>
      </span>
    </div>
    <div class="progress"><i style="width:${100 * (S.i + 1) / S.list.length}%"></i></div>
    <div class="qhead"><span class="label">${esc(exam ? "Exam simulation" : S.title)} · Q${n} · ${esc(q.section)}</span></div>
    <h2>What will be printed in the console?</h2>
    <div class="console"><div class="cap">quiz.py</div><pre>${highlight(q.code)}</pre></div>
    <div class="opts">${opts}</div>
    ${fb}
    ${histTxt}
    ${exam ? `<p class="small muted">${answered} of ${S.list.length} answered. You can change an answer until you finish.</p>` : ""}`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => pick(+b.dataset.o));
  document.getElementById("back").onclick = () => { if (exam && answered) finishExam(); else home(); };
  const sb = document.getElementById("star");
  if (sb) sb.onclick = () => { P.stars[n] = { on: !starred(n), t: Date.now() }; persist(); render(); };
  const rv = document.getElementById("reveal");
  if (rv) rv.onclick = () => { st.revealed = true; render(); };
  nav.hidden = false;
  const lastQ = S.i === S.list.length - 1;
  navin.innerHTML = `<button class="btn" id="prev" ${S.i === 0 ? "disabled" : ""} aria-label="Previous question">←</button>
    ${exam ? `<button class="btn" id="finish">Finish</button>` : `<button class="btn" id="home2">Home</button>`}
    <button class="btn primary" id="nextq">${lastQ ? (exam ? "Finish" : "Done") : "Next →"}</button>`;
  document.getElementById("prev").onclick = () => { if (S.i > 0) { S.i--; render(); window.scrollTo(0, 0); } };
  const h2 = document.getElementById("home2"); if (h2) h2.onclick = home;
  const fin = document.getElementById("finish"); if (fin) fin.onclick = finishExam;
  document.getElementById("nextq").onclick = () => {
    if (!lastQ) { S.i++; render(); window.scrollTo(0, 0); }
    else if (exam) finishExam(); else practiceDone();
  };
}
function pick(o) {
  const n = S.list[S.i], q = Q[n], st = S.state[n];
  if (S.mode === "exam") { st.pick = o; render(); return; }
  if (st.solved || st.tried.includes(o)) return;
  st.tried.push(o);
  if (st.tried.length === 1 && !st.revealed) record(n, o === q.correct);
  if (o === q.correct) st.solved = true;
  render();
  const fbEl = app.querySelector(".fb"); if (fbEl && fbEl.scrollIntoView) fbEl.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function practiceDone() {
  const list = S.list, title = S.title;
  const touched = list.filter(n => S.state[n] && S.state[n].tried.length);
  const firstRight = touched.filter(n => S.state[n].tried[0] === Q[n].correct).length;
  const wrong = touched.filter(n => S.state[n].tried[0] !== Q[n].correct);
  nav.hidden = true;
  app.innerHTML = `<span class="label">${esc(title)}</span>
    <div class="score"><b>${firstRight} / ${touched.length}</b><span class="muted">right on the first try</span></div>
    <div class="actions"><button class="btn primary" id="h">Home</button><button class="btn" id="again" ${wrong.length ? "" : "disabled"}>Redo the ${wrong.length} I got wrong</button></div>`;
  document.getElementById("h").onclick = home;
  document.getElementById("again").onclick = () => startPractice(wrong, "Redo: " + title);
}
function finishExam() {
  if (!S || S.mode !== "exam") return;
  stopTimer();
  const ms = Math.min(Date.now(), S.end) - S.start;
  const items = S.list.map(n => ({ n, q: Q[n], pick: S.state[n] ? S.state[n].pick : null }));
  const right = items.filter(x => x.pick === x.q.correct).length;
  items.forEach(x => { if (x.pick) record(x.n, x.pick === x.q.correct); });
  P.exams.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), t: Date.now(), size: items.length, right, ms });
  if (P.exams.length > 100) P.exams = P.exams.slice(-100);
  persist();
  const grade = Math.round((1 + 5 * right / items.length) * 4) / 4;
  nav.hidden = true;
  app.innerHTML = `<span class="label">Exam simulation · result</span>
    <div class="score"><b>${right} / ${items.length}</b><span class="muted">${pct(right, items.length)}% in ${fmt(ms)} min</span></div>
    <p class="small muted">On a simple linear scale (0 points = 1, all points = 6) that is about a ${grade.toFixed(2)}. Your tutor's scale may differ.</p>
    <div class="actions"><button class="btn primary" id="again">New exam</button><button class="btn" id="h">Home</button></div>
    <div class="label">Review</div>
    <div class="review">${items.map((x, i) => {
      const ok = x.pick === x.q.correct;
      return `<div class="ritem ${ok ? "ok" : "bad"}">
        <span class="label">${i + 1}. ${ok ? "Right" : x.pick ? "Wrong" : "Not answered"} · Q${x.n}</span>
        <div class="console"><pre>${highlight(x.q.code)}</pre></div>
        ${ok ? "" : `<p class="small">Your answer: <code>${x.pick ? esc(x.q.options[x.pick - 1]) : "none"}</code>${x.pick ? "<br>" + rich(x.q.reasons[x.pick - 1]) : ""}</p>`}
        <p class="small">Correct: <code>${esc(x.q.options[x.q.correct - 1])}</code></p>
        <p class="small muted">${rich(x.q.why)}</p>${traceHtml(x.q, false)}</div>`;
    }).join("")}</div>`;
  document.getElementById("again").onclick = () => startExam(S.size);
  document.getElementById("h").onclick = home;
  window.scrollTo(0, 0);
}

/* ---------------- statistics ---------------- */
function statsView() {
  view = "stats"; stopTimer(); S = null; nav.hidden = true;
  const all = ids();
  const answered = all.filter(done);
  const attempts = answered.reduce((s, n) => s + P.att[n].r + P.att[n].w, 0);
  const rightAtt = answered.reduce((s, n) => s + P.att[n].r, 0);
  const firstN = Object.keys(P.first).length, firstR = Object.values(P.first).filter(Boolean).length;
  const topics = SECTIONS.map((s, i) => {
    const ns = ids(s); const d = ns.filter(done);
    const fr = ns.filter(n => n in P.first);
    const acc = pct(fr.filter(n => P.first[n]).length, fr.length);
    return { s, i, total: ns.length, done: d.length, acc, firstCount: fr.length };
  });
  const ranked = topics.filter(t => t.firstCount >= 3).sort((a, b) => a.acc - b.acc);
  const weakest = ranked[0];
  const trows = topics.map(t => `<div class="trow${weakest && t.i === weakest.i ? " weak" : ""}">
      <span class="tname">${t.i + 1}. ${esc(t.s)}</span><span class="num">${t.done}/${t.total}</span><span class="num">${t.firstCount ? t.acc + "%" : "–"}</span>
      <span class="bar" style="grid-column:1/-1" title="${t.acc}% right on the first try"><i class="g" style="width:${t.firstCount ? t.acc : 0}%"></i></span></div>`).join("");
  // exam chart: last 12 exams, % right
  const ex = P.exams.slice(-12);
  const exChart = ex.length ? `<div class="chart" role="img" aria-label="Exam scores, last ${ex.length} exams">${ex.map(e => {
      const p = pct(e.right, e.size); const d = new Date(e.t);
      return `<span class="col" tabindex="0"><span class="tip">${p}% · ${e.right}/${e.size} · ${d.getDate()}.${d.getMonth() + 1}.</span><b style="height:${Math.max(2, p)}%"></b></span>`;
    }).join("")}</div><div class="chart-axis"><span>older</span><span>0 to 100% right</span><span>latest</span></div>
    <div class="hist">${ex.slice().reverse().map(e => { const d = new Date(e.t); return `<div><span>${d.getDate()}.${d.getMonth() + 1}. ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}</span><span>${e.right}/${e.size} (${pct(e.right, e.size)}%)</span><span class="muted">${fmt(e.ms)}</span></div>`; }).join("")}</div>`
    : `<p class="small muted">No exams yet. Your scores appear here after your first exam simulation.</p>`;
  // activity: last 14 days
  const days = []; const d0 = new Date(); d0.setDate(d0.getDate() - 13);
  for (let i = 0; i < 14; i++) { const d = new Date(d0); d.setDate(d0.getDate() + i); days.push({ k: dayKey(d), d }); }
  const maxDay = Math.max(1, ...days.map(x => P.days[x.k] || 0));
  const actChart = `<div class="chart" role="img" aria-label="Answers per day, last 14 days">${days.map(x => {
      const v = P.days[x.k] || 0;
      return `<span class="col" tabindex="0"><span class="tip">${v} answers · ${x.d.getDate()}.${x.d.getMonth() + 1}.</span><b style="height:${v ? Math.max(3, 100 * v / maxDay) : 0}%"></b></span>`;
    }).join("")}</div><div class="chart-axis"><span>${days[0].d.getDate()}.${days[0].d.getMonth() + 1}.</span><span>max ${maxDay} per day</span><span>today</span></div>`;
  const hardest = answered.filter(n => P.att[n].w > 0).sort((a, b) => (P.att[b].w - P.att[b].r) - (P.att[a].w - P.att[a].r)).slice(0, 8);
  app.innerHTML = `
    <div class="qhead"><button class="linkish small" id="back">← Home</button><span id="sync" class="sync ${syncClass()}">${syncHtml()}</span></div>
    <h1>Statistics</h1>
    <div class="stats4">
      <div class="stat"><b>${answered.length}</b><span class="small muted">of ${TOTAL} answered</span></div>
      <div class="stat"><b>${pct(firstR, firstN)}%</b><span class="small muted">right first try</span></div>
      <div class="stat"><b>${pct(rightAtt, attempts)}%</b><span class="small muted">right, all ${attempts} attempts</span></div>
      <div class="stat"><b>${streak()}</b><span class="small muted">day streak</span></div>
    </div>
    <div class="panel">
      <h2>By topic</h2>
      <div class="trow head"><span>Topic</span><span class="num">Done</span><span class="num">1st try</span></div>
      ${trows}
      ${weakest ? `<button class="btn primary" id="weak">Practice your weakest topic: ${esc(weakest.s)}</button>` : `<p class="small muted">Answer at least 3 questions in a topic to see your weakest topic.</p>`}
    </div>
    <div class="panel"><h2>Exam simulations</h2>${exChart}</div>
    <div class="panel"><h2>Answers per day</h2>${actChart}</div>
    <div class="panel"><h2>Your hardest questions</h2>${hardest.length
      ? `<div class="hist">${hardest.map(n => `<div><span>Q${n} · ${esc(Q[n].section)}</span><span>${P.att[n].w} wrong</span><span class="muted">${P.att[n].r} right</span></div>`).join("")}</div>
         <button class="btn" id="hardbtn">Practice these ${hardest.length}</button>`
      : `<p class="small muted">Questions you get wrong more than once show up here.</p>`}</div>`;
  document.getElementById("back").onclick = home;
  const w = document.getElementById("weak");
  if (w) w.onclick = () => { const l = ids(weakest.s).filter(n => !(n in P.first) || !P.first[n] || needsReview(n)); startPractice(shuffle(l.length ? l : ids(weakest.s)), "Weakest topic: " + weakest.s); };
  const hb = document.getElementById("hardbtn"); if (hb) hb.onclick = () => startPractice(hardest, "Your hardest questions");
  window.scrollTo(0, 0);
}

/* ---------------- backup ---------------- */
function encode() { return "PYQ1." + btoa(unescape(encodeURIComponent(JSON.stringify(P)))); }
function decode(s) { s = s.trim(); if (!s.startsWith("PYQ1.")) throw new Error("x"); return JSON.parse(decodeURIComponent(escape(atob(s.slice(5))))); }
function backupView() {
  view = "backup"; stopTimer(); S = null; nav.hidden = true;
  app.innerHTML = `
    <div class="qhead"><button class="linkish small" id="back">← Home</button><span id="sync" class="sync ${syncClass()}">${syncHtml()}</span></div>
    <h1>Backup and restore</h1>
    <div class="panel">
      <h2>Where your progress is saved</h2>
      <p class="small">${cloud ? "Your answers are saved to your claude.ai account and on this device. Open this page signed in on any phone or computer and your progress is there." : "Right now your answers are saved only in this browser. Open the page while signed in to claude.ai to save them to your account as well."}</p>
      <p class="small muted">The backup code below is a second copy you can keep in your notes, just in case.</p>
    </div>
    <div class="panel">
      <h2>Your backup code</h2>
      <textarea id="code" readonly>${esc(encode())}</textarea>
      <button class="btn" id="copy">Copy code</button>
    </div>
    <div class="panel">
      <h2>Restore from a code</h2>
      <p class="small muted">Paste a backup code. It is merged with your current progress, nothing gets deleted.</p>
      <textarea id="paste" placeholder="PYQ1...."></textarea>
      <button class="btn primary" id="restore">Restore</button>
    </div>
    ${backupMsg ? `<div class="note ${backupMsg.ok ? "ok" : "bad"}">${esc(backupMsg.text)}</div>` : ""}`;
  document.getElementById("back").onclick = home;
  document.getElementById("copy").onclick = async () => {
    const ta = document.getElementById("code");
    try { await navigator.clipboard.writeText(ta.value); backupMsg = { ok: true, text: "Copied. Paste it into your notes." }; }
    catch (e) { ta.focus(); ta.select(); backupMsg = { ok: true, text: "The code is selected. Copy it with your phone's copy option." }; }
    const v = document.querySelector(".note"); if (v) v.remove();
    app.insertAdjacentHTML("beforeend", `<div class="note ok">${esc(backupMsg.text)}</div>`);
  };
  document.getElementById("restore").onclick = () => {
    try { P = merge(P, decode(document.getElementById("paste").value)); persist(); backupMsg = { ok: true, text: "Restored. Your progress now includes the backup." }; }
    catch (e) { backupMsg = { ok: false, text: "That code could not be read. Copy the whole code, starting with PYQ1." }; }
    backupView();
  };
  window.scrollTo(0, 0);
}

home();
connectCloud();
</script>
</body>
</html>
