<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Python Quiz Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-column phone app. A home screen with topic rows, a question screen with a console-style code panel, answer buttons and a fixed bottom bar. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #17202c;
  --muted: #5d6879;
  --line: #d9dee6;
  --accent: #1f4fd1;
  --accent-ink: #ffffff;
  --console-bg: #1b2330;
  --console-ink: #e6ebf2;
  --console-kw: #8fb4ff;
  --ok: #17803d;
  --ok-bg: #e5f5ea;
  --bad: #c0352b;
  --bad-bg: #fbe9e7;
  --warn: #9a6200;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161e; --surface: #1a212c; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3644;
    --accent: #7ea2ff; --accent-ink: #0d1220; --console-bg: #0b0f15; --console-ink: #e6ebf2; --console-kw: #8fb4ff;
    --ok: #5fd08a; --ok-bg: #12301f; --bad: #ff8a7f; --bad-bg: #3a1714; --warn: #f0b75a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161e; --surface: #1a212c; --ink: #e8ecf2; --muted: #9aa5b5; --line: #2c3644;
  --accent: #7ea2ff; --accent-ink: #0d1220; --console-bg: #0b0f15; --console-ink: #e6ebf2; --console-kw: #8fb4ff;
  --ok: #5fd08a; --ok-bg: #12301f; --bad: #ff8a7f; --bad-bg: #3a1714; --warn: #f0b75a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; padding-block: 16px 104px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 1.6rem; margin: 0; line-height: 1.15; text-wrap: balance; }
h2 { font-size: 1.05rem; margin: 0; text-wrap: balance; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.label { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
code, .mono { font-family: var(--font-mono); font-size: 0.88em; }
p code, .fb code { background: color-mix(in srgb, var(--line) 55%, transparent); padding: 0 4px; border-radius: 4px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* home */
.hero { display: flex; flex-direction: column; gap: 6px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; text-align: left; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn .sub { display: block; font-size: 0.8rem; opacity: 0.8; font-weight: 400; }
.topics { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); }
.topic { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; width: 100%; }
.topic:last-child { border-bottom: 0; }
.topic .name { font-weight: 700; min-width: 0; }
.topic .count { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }
.bar { grid-column: 1 / -1; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--ok); } .bar .r { background: var(--bad); }
.linkish { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 4px 0; align-self: flex-start; }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* question */
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.pill { font-size: 0.8rem; border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.timer.low { color: var(--bad); border-color: var(--bad); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.console { background: var(--console-bg); color: var(--console-ink); border-radius: 10px; overflow-x: auto; }
.console .cap { font-family: var(--font-mono); font-size: 0.72rem; color: #8a96a8; padding: 8px 12px 0; }
.console pre { margin: 0; padding: 8px 12px 12px; font-family: var(--font-mono); font-size: 0.86rem; line-height: 1.5; white-space: pre; }
.console .kw { color: var(--console-kw); }
.console .str { color: #f2c27d; }
.console .num { color: #9fe0b8; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; text-align: left; width: 100%; background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; min-height: 48px; }
.opt .k { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.opt .t { font-family: var(--font-mono); font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.opt.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.ok { border-color: var(--ok); background: var(--ok-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.opt.ok .k, .opt.bad .k { color: inherit; }
.fb { border-radius: 10px; padding: 12px 14px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 6px; }
.fb.ok { border-color: var(--ok); }
.fb.bad { border-color: var(--bad); }
.fb .verdict { font-weight: 700; }
.fb.ok .verdict { color: var(--ok); } .fb.bad .verdict { color: var(--bad); }
.navbar {
  position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line);
  padding-top: 10px; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.navbar .in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
.navbar .btn { text-align: center; }

/* results */
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score b { font-size: 2.4rem; font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 10px; }
.ritem { background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
.ritem.ok { border-left-color: var(--ok); } .ritem.bad { border-left-color: var(--bad); }
.ritem .console pre { font-size: 0.8rem; }
.steps { border-top: 1px solid var(--line); padding-top: 8px; }
.steps summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; color: var(--accent); padding: 4px 0; }
.steps ol { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.steps li { display: grid; grid-template-columns: 3.2em 1fr; gap: 8px; font-size: 0.82rem; align-items: baseline; }
.steps li .ln { font-family: var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.steps li .body { min-width: 0; overflow-wrap: anywhere; }
.steps li code { font-size: 0.95em; }
.steps li .eff { display: block; color: var(--ink); }
.steps li .eff b { color: var(--accent); font-weight: 700; }
.steps li.call .body, .steps li.ret .body { color: var(--muted); font-style: italic; }
.steps li .err { color: var(--bad); font-weight: 700; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--muted); }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); display: inline-block; }
.sync.cloud i { background: var(--ok); }
.sync.local i { background: var(--warn); }
.sync.busy i { background: var(--accent); }
.stats4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 420px) { .stats4 { grid-template-columns: repeat(2, 1fr); } }
.toggle { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
.toggle label { min-width: 0; }
.footer-links { display: flex; gap: 16px; flex-wrap: wrap; }
.star { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; white-space: nowrap; }
.star.on { border-color: var(--warn); color: var(--warn); font-weight: 700; }
.qhead .right { display: flex; gap: 6px; align-items: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.trow { display: grid; grid-template-columns: minmax(0, 1fr) 4.2em 3.6em; gap: 4px 10px; align-items: center; font-size: 0.88rem; }
.trow .num { text-align: right; font-variant-numeric: tabular-nums; }
.trow .bar { height: 6px; }
.trow.head { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
.trow.weak .tname { font-weight: 700; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 96px; border-bottom: 1px solid var(--line); padding-top: 4px; }
.chart .col { flex: 1 1 0; min-width: 6px; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
.chart .col b { display: block; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
.chart .col:hover b, .chart .col:focus b { filter: brightness(1.15); }
.chart .col .tip { position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); font-size: 0.72rem; padding: 3px 6px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; }
.chart .col:hover .tip, .chart .col:focus .tip { opacity: 1; }
.chart-axis { display: flex; justify-content: space-between; font-size: 0.72rem; color: var(--muted); }
.hist { display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
.hist div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; font-variant-numeric: tabular-nums; }
textarea { width: 100%; min-height: 96px; font-family: var(--font-mono); font-size: 0.75rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); padding: 8px; resize: vertical; }
.note { font-size: 0.85rem; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.note.ok { border-color: var(--ok); } .note.bad { border-color: var(--bad); }
.actions3 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<script>
const DATA = {"sections": ["The 2025 quiz (original questions)", "Names, types and operators", "Strings and string methods", "Indexing and slicing", "Lists, dicts and mutability", "Conditionals and truthiness", "Loops", "Functions", "Errors", "Combined (harder)"], "questions": [{"n": 1, "section": "The 2025 quiz (original questions)", "options": ["None", "NameError", "HELLO WORLD", "hello world"], "reasons": ["You may be thinking that a missing value quietly becomes None. Python never does that for an unknown name: looking up a name that was never assigned is an error. Compare the name in line 2 with the one created in line 1.", null, "You probably read `MY_STRING` as the same variable and then guessed the capitals carry over to the output. Even if the name existed, `.lower()` makes letters smaller, never bigger. Look again at the capital letters in the variable name on line 2.", "This would be the output of `my_string.lower()`, so your logic about `.lower()` is right. The problem comes one step earlier: check whether the name used on line 2 is spelled exactly like the one defined on line 1, including upper and lower case."], "correct": 2, "why": "Line 1 creates a variable called `my_string` in lower case. Line 2 asks for `MY_STRING` in capitals, and Python looks that name up before it does anything else on the line. No variable with exactly that spelling exists, so Python stops with a NameError and `.lower()` is never called. The rule: names in Python are case-sensitive, so `my_string`, `My_String` and `MY_STRING` are three different names. Exam tip: before you think about what a method does, compare the spelling and capitalisation of every name with the place where it was defined.", "code": "my_string = \"hello world\"\nprint(MY_STRING.lower())", "trace": {"steps": [{"k": "line", "n": 1, "src": "my_string = \"hello world\"", "fn": null, "t": "my_string = 'hello world'"}, {"k": "line", "n": 2, "src": "print(MY_STRING.lower())", "fn": null, "t": "raises NameError"}], "more": 0}}, {"n": 2, "section": "The 2025 quiz (original questions)", "options": ["univ", "uni", "nive", "niv"], "reasons": ["You probably counted from 1 instead of 0, so you took the first letter as position 1. In Python `x[0]` is `u` and `x[1]` is `n`. Also note `univ` has 4 characters, but `x[1:4]` can only give 4 - 1 = 3.", "This would come from `x[0:3]`: you started at the very first letter. The slice in line 2 starts at index 1, and with counting from 0 that is the second letter. Number the letters u=0, n=1, i=2 and start from 1.", "Your start is right, but you included the character at index 4. The stop value in a slice is never included, so `x[1:4]` ends at index 3. Count the result: it must have 4 - 1 = 3 characters.", null], "correct": 4, "why": "Line 2 sets y to `x[1:4]`. Number the characters from 0: u=0, n=1, i=2, v=3, e=4. The slice starts at index 1 and stops BEFORE index 4, so it takes positions 1, 2 and 3, which are n, i, v. That gives `niv`. The rule: in `s[start:stop]` the start is included and the stop is excluded, so the slice has `stop - start` characters (here 4 - 1 = 3). Exam tip: write the index under each letter and check that your answer has exactly stop minus start characters.", "code": "x = \"university\"\ny = x[1:4]\nprint(y)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"university\"", "fn": null, "t": "x = 'university'"}, {"k": "line", "n": 2, "src": "y = x[1:4]", "fn": null, "t": "y = 'niv'"}, {"k": "line", "n": 3, "src": "print(y)", "fn": null, "t": "prints niv"}], "more": 0}}, {"n": 3, "section": "The 2025 quiz (original questions)", "options": ["<class 'str'>", "<class 'list'>", "<class 'int'>", "None"], "reasons": ["You looked at the element instead of the container. `str(8)` is indeed a string, but it sits inside square brackets, which wrap it into a list. `type(x)` reports the outer object, so ask yourself what x is, not what x contains.", null, "You may have focused on the 8 in the code. That number is converted by `str(8)` into the text \"8\" before anything else happens, and then placed inside square brackets. No int is left in x, and x itself is a container.", "You might be mixing this up with functions that have no return value. `type()` always returns a class object such as `<class 'int'>`, so it can never print None. Work out what kind of object the square brackets in line 1 create."], "correct": 2, "why": "Work from the inside out. `str(8)` turns the number 8 into the text \"8\". The square brackets around it then build a list with that one string inside, so x is `[\"8\"]`. `type(x)` asks for the type of x itself, which is the outer container, so Python prints `<class 'list'>`. The rule: `type()` describes the object you pass in, not the things stored inside it. Exam tip: look at the outermost symbols first. Square brackets mean list, curly braces mean dict or set, quotes mean str.", "code": "x = [str(8)]\nprint(type(x))", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = [str(8)]", "fn": null, "t": "x = ['8']"}, {"k": "line", "n": 2, "src": "print(type(x))", "fn": null, "t": "prints <class 'list'>"}], "more": 0}}, {"n": 4, "section": "The 2025 quiz (original questions)", "options": ["TypeError", "350 <class 'int'>", "350 <class 'str'>", "100250 <class 'str'>"], "reasons": [null, "You treated y as the number 250. Look at line 2: the quotes make y the text \"250\", and Python does not turn text into a number on its own. To get 350 the code would need `x + int(y)`.", "This mixes two ideas: numeric addition and a string result. Python cannot do either here, because one side of `+` is an int and the other is a str. Check the types of x and y in lines 1 and 2.", "You assumed Python converts 100 into text and then joins the two. Some languages do that, but Python does not. Joining would only work if the code wrote `str(x) + y`, so look at what line 3 actually writes."], "correct": 1, "why": "x is the int 100, while y is the string \"250\" because of the quotes. Line 3 tries `100 + \"250\"`. For an int, `+` means arithmetic addition, and for a str it means joining text, and Python refuses to guess which one you want. It raises a TypeError on line 3, so line 4 never runs and nothing is printed before the error. The rule: Python does not convert between str and int automatically; you must write `x + int(y)` or `str(x) + y` yourself. Exam tip: whenever you see quotes around a number, treat it as text.", "code": "x = 100\ny = \"250\"\nz = x + y\nprint(z, type(z))", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 100", "fn": null, "t": "x = 100"}, {"k": "line", "n": 2, "src": "y = \"250\"", "fn": null, "t": "y = '250'"}, {"k": "line", "n": 3, "src": "z = x + y", "fn": null, "t": "raises TypeError"}], "more": 0}}, {"n": 5, "section": "The 2025 quiz (original questions)", "options": ["['apple', 'orange', 'mango', 'mango']", "['apple', 'orange', 'mango']", "['apple', 'orange']", "None"], "reasons": [null, "You assumed the second \"mango\" is ignored because it is already there. That is how a set behaves, but a list keeps duplicates. Count the `append` calls in lines 2 and 3: each one adds an element.", "You probably thought `append` returns a new list and leaves the original unchanged. In fact `append` changes the list in place, so `fruits` itself grows. The print on line 4 shows the list after both changes.", "It is true that `fruits.append(...)` returns None, but that return value is never printed here. Line 4 prints the variable `fruits`, which is the list after the changes. Look at what is inside the parentheses of `print`."], "correct": 1, "why": "The list starts with 2 elements. Line 2 adds \"mango\" at the end, giving 3 elements. Line 3 adds another \"mango\", giving 4 elements. `append` changes the list in place, so the same list object grows each time and line 4 prints `['apple', 'orange', 'mango', 'mango']`. The rule: lists keep order and allow duplicates; `append` always adds exactly one element at the end. Exam tip: count the `append` calls and add one element per call.", "code": "fruits = [\"apple\", \"orange\"]\nfruits.append(\"mango\")\nfruits.append(\"mango\")\nprint(fruits)", "trace": {"steps": [{"k": "line", "n": 1, "src": "fruits = [\"apple\", \"orange\"]", "fn": null, "t": "fruits = ['apple', 'orange']"}, {"k": "line", "n": 2, "src": "fruits.append(\"mango\")", "fn": null, "t": "fruits = ['apple', 'orange', 'mango']"}, {"k": "line", "n": 3, "src": "fruits.append(\"mango\")", "fn": null, "t": "fruits = ['apple', 'orange', 'mango', 'mango']"}, {"k": "line", "n": 4, "src": "print(fruits)", "fn": null, "t": "prints ['apple', 'orange', 'mango', 'mango']"}], "more": 0}}, {"n": 6, "section": "The 2025 quiz (original questions)", "options": ["Data Analysis", "None", "DAtA anAlysis", "Dxtx anxlysis"], "reasons": ["You probably remembered that strings cannot be changed and concluded nothing happens. That is true for the original object, but each line assigns the new string back to `course`. So the changes do carry forward from line to line.", "You may be confusing `replace` with list methods like `append` or `sort`, which return None. `replace` returns a new string. Since the result is stored in `course`, the variable always holds text.", null, "Your first two steps are right, but you stopped before line 4. That line replaces every x with a capital A. Apply it to \"Dxtx anxlysis\" letter by letter."], "correct": 3, "why": "Follow each line and keep track of upper and lower case. Line 2 replaces every lowercase a: \"Data Analysis\" becomes \"Dxtx Anxlysis\" (the capital A stays). Line 3 replaces the capital A: \"Dxtx anxlysis\". Line 4 replaces every x with a capital A: \"DAtA anAlysis\". Each result is stored back in `course`, so every step works on the output of the previous one. The rule: strings are immutable, so `replace` returns a new string, and the change only sticks because of the `course = ...` assignment. Also, `replace` is case-sensitive.", "code": "course = \"Data Analysis\"\ncourse = course.replace(\"a\", \"x\")\ncourse = course.replace(\"A\", \"a\")\ncourse = course.replace(\"x\", \"A\")\nprint(course)", "trace": {"steps": [{"k": "line", "n": 1, "src": "course = \"Data Analysis\"", "fn": null, "t": "course = 'Data Analysis'"}, {"k": "line", "n": 2, "src": "course = course.replace(\"a\", \"x\")", "fn": null, "t": "course = 'Dxtx Anxlysis'"}, {"k": "line", "n": 3, "src": "course = course.replace(\"A\", \"a\")", "fn": null, "t": "course = 'Dxtx anxlysis'"}, {"k": "line", "n": 4, "src": "course = course.replace(\"x\", \"A\")", "fn": null, "t": "course = 'DAtA anAlysis'"}, {"k": "line", "n": 5, "src": "print(course)", "fn": null, "t": "prints DAtA anAlysis"}], "more": 0}}, {"n": 7, "section": "The 2025 quiz (original questions)", "options": ["TypeError", "hello", "goodbye", "hello; goodbye"], "reasons": ["You may think int and float cannot be mixed. Mixing them in comparisons and arithmetic is allowed; only combinations like int and str fail. So the comparison in line 3 runs normally.", "You probably thought 10.0 is somehow bigger than 10, maybe because it has a decimal part or is a float. Numerically they are the same value. Ask whether `>` is True when both sides are equal.", null, "An if/else runs exactly one of its two blocks, never both. Python checks the condition once and picks one branch. Decide whether `10.0 > 10` is True or False."], "correct": 3, "why": "x is the int 10 and y is the float 10.0. Python compares their numeric values, and 10.0 equals 10. So `y > x` means `10.0 > 10`, which is False, and the else branch prints `goodbye`. The rule: ints and floats can be compared freely, and only the value matters, not the type. `>` is strict, so equal values give False. Exam tip: when values are equal, `>` and `<` are False while `>=` and `<=` are True.", "code": "x = 10\ny = 10.0\nif y > x:\n    print(\"hello\")\nelse:\n    print(\"goodbye\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 2, "src": "y = 10.0", "fn": null, "t": "y = 10.0"}, {"k": "line", "n": 3, "src": "if y > x:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(\"goodbye\")", "fn": null, "t": "prints goodbye"}], "more": 0}}, {"n": 8, "section": "The 2025 quiz (original questions)", "options": ["goodbye", "see you", "hello", "None"], "reasons": [null, "You reached the else, which means you treated the elif as False. Plug the numbers in: `z > x` is `20 > 10`. The else only runs when every condition above it is False.", "For `or` you need at least one side to be True. Put the values into both parts: `15 >= 20` and `10 >= 15`. Check each one carefully before deciding.", "None is only printed if you print something that returns None. Here every branch prints a fixed text, and the chain ends with an else, so one of the three texts must appear. Work out which condition is True first."], "correct": 1, "why": "Check the `if` first. `y >= z` is `15 >= 20`, False. `x >= y` is `10 >= 15`, also False. False or False is False, so \"hello\" is skipped. Then the `elif` is checked: `z > x` is `20 > 10`, True, so `goodbye` is printed and the else is skipped. The rule: in an if/elif/else chain Python tests the conditions from top to bottom and runs only the first one that is True. `or` is True if at least one side is True. Exam tip: write the numbers into each condition before deciding.", "code": "x = 10\ny = 15\nz = 20\nif y >= z or x >= y:\n    print(\"hello\")\nelif z > x:\n    print(\"goodbye\")\nelse:\n    print(\"see you\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 2, "src": "y = 15", "fn": null, "t": "y = 15"}, {"k": "line", "n": 3, "src": "z = 20", "fn": null, "t": "z = 20"}, {"k": "line", "n": 4, "src": "if y >= z or x >= y:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "elif z > x:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 7, "src": "print(\"goodbye\")", "fn": null, "t": "prints goodbye"}], "more": 0}}, {"n": 9, "section": "The 2025 quiz (original questions)", "options": ["goodbye; hello", "goodbye", "hello; see you", "goodbye; see you"], "reasons": ["You treated x as truthy in the second if. Look at line 1: x is the empty string, and an empty string counts as False. With `and`, both sides must be truthy.", "You may have read these as an if/elif chain where only the first True one runs. They are three independent `if` statements, so the third is checked too. Ask what `not \"\"` gives.", "You skipped the first if. Check it again: `z > y` is `10 > 5`. Also check the second if, where x is an empty string.", null], "correct": 4, "why": "These are three separate `if` statements, so each one is checked on its own. First: `10 > 5` is True, so `goodbye` is printed. Second: `10 > 5` is True, but x is the empty string \"\", which counts as False, so `True and \"\"` is falsy and \"hello\" is skipped. Third: `not \"\"` is True, so `see you` is printed. The rule: empty values (\"\", 0, [], {}, None) are falsy, and anything non-empty is truthy. Also, a new `if` (as opposed to `elif`) is always checked, even when an earlier one was True.", "code": "x = \"\"\ny = 5\nz = 10\nif z > y:\n    print(\"goodbye\")\nif z > y and x:\n    print(\"hello\")\nif not x:\n    print(\"see you\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"\"", "fn": null, "t": "x = ''"}, {"k": "line", "n": 2, "src": "y = 5", "fn": null, "t": "y = 5"}, {"k": "line", "n": 3, "src": "z = 10", "fn": null, "t": "z = 10"}, {"k": "line", "n": 4, "src": "if z > y:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 5, "src": "print(\"goodbye\")", "fn": null, "t": "prints goodbye"}, {"k": "line", "n": 6, "src": "if z > y and x:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 8, "src": "if not x:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 9, "src": "print(\"see you\")", "fn": null, "t": "prints see you"}], "more": 0}}, {"n": 10, "section": "The 2025 quiz (original questions)", "options": ["p; r; a", "apple", "apple; orange; mango", "a; o; m"], "reasons": [null, "This would be a single line, but a for loop over a list of three items runs three times. Also, `fruit[1]` gives a single character, never a whole word. Write down what `fruit` is in each round.", "You printed the whole word each round. That would be `print(fruit)`. The `[1]` after `fruit` picks out one character of the word.", "These are the first letters, which come from `fruit[0]`. Python counts from 0, so index 1 is the second letter. Look at the second letter of each fruit."], "correct": 1, "why": "The loop runs once per element of the list, so three times. Each time, `fruit` holds one whole string: first \"apple\", then \"orange\", then \"mango\". `fruit[1]` takes the character at index 1 of that string, which is the second letter because counting starts at 0: \"apple\" gives p, \"orange\" gives r, \"mango\" gives a. The rule: indexing a string returns a single character, and indices start at 0. Exam tip: check whether the loop body uses the loop variable (`fruit`) or the list (`fruits`).", "code": "fruits = [\"apple\", \"orange\", \"mango\"]\nfor fruit in fruits:\n    print(fruit[1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "fruits = [\"apple\", \"orange\", \"mango\"]", "fn": null, "t": "fruits = ['apple', 'orange', 'mango']"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "fruit = 'apple'"}, {"k": "line", "n": 3, "src": "print(fruit[1])", "fn": null, "t": "prints p"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "fruit = 'orange'"}, {"k": "line", "n": 3, "src": "print(fruit[1])", "fn": null, "t": "prints r"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "fruit = 'mango'"}, {"k": "line", "n": 3, "src": "print(fruit[1])", "fn": null, "t": "prints a"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 11, "section": "The 2025 quiz (original questions)", "options": ["NameError", "a; o; m", "p; r; a", "orange; orange; orange"], "reasons": ["A NameError needs a name that was never defined. Here `fruits` is defined on line 1 and `fruit` is created by the for loop. Both exist, so the code runs.", "This would need `fruit[0]`, the first letter of each word. The print line uses `fruits` with an s, the whole list, and index 1. Find which element of the list sits at index 1.", "This is the right answer for the previous question, where the code used `fruit[1]`. Here the print line says `fruits[1]`. Check the extra s and ask what index 1 of the list is.", null], "correct": 4, "why": "Read the print line letter by letter: it says `fruits[1]` with an s, which is the list, not the loop variable. `fruits[1]` is the element at index 1 of the list, which is \"orange\", and it does not depend on the loop at all. The loop still runs three times (once per element), so \"orange\" is printed three times. The rule: the number of loop rounds comes from the list being iterated; what is printed comes from the expression in the body. Exam tip: names that differ by one letter are a classic trap, so compare them carefully.", "code": "fruits = [\"apple\", \"orange\", \"mango\"]\nfor fruit in fruits:\n    print(fruits[1])", "trace": {"steps": [{"k": "line", "n": 1, "src": "fruits = [\"apple\", \"orange\", \"mango\"]", "fn": null, "t": "fruits = ['apple', 'orange', 'mango']"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "fruit = 'apple'"}, {"k": "line", "n": 3, "src": "print(fruits[1])", "fn": null, "t": "prints orange"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "fruit = 'orange'"}, {"k": "line", "n": 3, "src": "print(fruits[1])", "fn": null, "t": "prints orange"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "fruit = 'mango'"}, {"k": "line", "n": 3, "src": "print(fruits[1])", "fn": null, "t": "prints orange"}, {"k": "line", "n": 2, "src": "for fruit in fruits:", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 12, "section": "The 2025 quiz (original questions)", "options": ["z; u; r; i", "uni zurich (x4 times)", "z; u; r", "u; n; i; ; z; u"], "reasons": [null, "You treated `city[i]` as if it printed the whole string. With an index in square brackets you get exactly one character. Also note the string in line 1 is \"uni zuri\", and printing it would never add \"ch\".", "You stopped one round too early. The string has 8 characters (count the space), so `range(8)` goes up to 7. The character at index 7 is the final i.", "You printed from the start of the string, as if every round printed. The condition `i > 3` skips indices 0, 1, 2 and 3. Start at index 4 and remember the space is at index 3."], "correct": 1, "why": "\"uni zuri\" has 8 characters including the space: u=0, n=1, i=2, space=3, z=4, u=5, r=6, i=7. So `range(len(city))` is `range(8)`, giving i = 0 to 7. Only rounds with `i > 3` print, which are i = 4, 5, 6, 7. Those characters are z, u, r, i, one per line. The rule: `range(n)` runs from 0 to n - 1, and `city[i]` gives a single character. A space counts as a character too. Exam tip: write the index under every character, including spaces.", "code": "city = \"uni zuri\"\nfor i in range(len(city)):\n    if i > 3:\n        print(city[i])", "trace": {"steps": [{"k": "line", "n": 1, "src": "city = \"uni zuri\"", "fn": null, "t": "city = 'uni zuri'"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 0"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 1"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 2"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 3"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 4"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints z"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 5"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints u"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 6"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints r"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 7"}, {"k": "line", "n": 3, "src": "if i > 3:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints i"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 13, "section": "The 2025 quiz (original questions)", "options": ["None; None", "15; None", "15; 15", "None; 15"], "reasons": ["You assumed the function shows nothing. Look at line 3: `print(c)` runs during the call and shows the sum. Only the return value is missing, which affects z.", null, "You treated `print(c)` as if it also gave 15 back to the caller. Printing and returning are different. Search the function for a `return` statement and think about what z holds without one.", "The values are right but the order is reversed. The function call on line 7 runs first and prints inside the function. The print on line 8 comes after that."], "correct": 2, "why": "Line 7 calls `addition(10, 5)`. Inside, c becomes 15 and `print(c)` shows 15 on the screen. The function then ends without a `return` statement, so it returns None automatically, and z is None. Line 8 then prints `None`. The rule: `print` only shows a value on the screen; only `return` sends a value back to the caller. A function without `return` returns None. Exam tip: count every print, including those inside functions, in the order they run.", "code": "def addition(a, b):\n    c = a + b\n    print(c)\n\nx = 10\ny = 5\nz = addition(x, y)\nprint(z)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def addition(a, b):", "fn": null, "t": "defines function addition()"}, {"k": "line", "n": 5, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 6, "src": "y = 5", "fn": null, "t": "y = 5"}, {"k": "call", "t": "call addition(a=10, b=5)"}, {"k": "line", "n": 2, "src": "c = a + b", "fn": "addition", "t": "c = 15"}, {"k": "line", "n": 3, "src": "print(c)", "fn": "addition", "t": "prints 15"}, {"k": "ret", "t": "addition returns None"}, {"k": "line", "n": 7, "src": "z = addition(x, y)", "fn": null, "t": "z = None"}, {"k": "line", "n": 8, "src": "print(z)", "fn": null, "t": "prints None"}], "more": 0}}, {"n": 14, "section": "The 2025 quiz (original questions)", "options": ["0.5", "None", "2.0", "NameError"], "reasons": [null, "You may have mixed this up with a function that only prints. This function ends with `return z`, so it gives a value back. Look at line 3.", "You computed 10 / 5, as if the outside x went into the parameter x. Python matches by position, so look at the order inside `division(y, x)` on line 7. Which value arrives first?", "Every name used is defined: x and y inside the function are parameters, and x and y outside are assigned on lines 5 and 6. Reusing the same names is allowed. Focus on the order of the arguments."], "correct": 1, "why": "Arguments are matched to parameters by position. The call `division(y, x)` passes y (5) first and x (10) second. Inside the function the parameter x therefore gets 5 and the parameter y gets 10, so `z = 5 / 10 = 0.5`, which is returned and printed. The rule: the names outside the function do not matter for matching; only the order in the call does. Also, `/` always gives a float. Exam tip: write down \"parameter = value\" for each argument before you compute.", "code": "def division(x, y):\n    z = x / y\n    return z\n\nx = 10\ny = 5\nz = division(y, x)\nprint(z)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def division(x, y):", "fn": null, "t": "defines function division()"}, {"k": "line", "n": 5, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 6, "src": "y = 5", "fn": null, "t": "y = 5"}, {"k": "call", "t": "call division(x=5, y=10)"}, {"k": "line", "n": 2, "src": "z = x / y", "fn": "division", "t": "z = 0.5"}, {"k": "line", "n": 3, "src": "return z", "fn": "division", "t": ""}, {"k": "ret", "t": "division returns 0.5"}, {"k": "line", "n": 7, "src": "z = division(y, x)", "fn": null, "t": "z = 0.5"}, {"k": "line", "n": 8, "src": "print(z)", "fn": null, "t": "prints 0.5"}], "more": 0}}, {"n": 15, "section": "The 2025 quiz (original questions)", "options": ["1; 2; 4; 6; 8", "1; 1; 1; 2; 2", "1; 1; 2; 2; 2", "1; 2; 3; 5; 7"], "reasons": ["You let x grow each round, as if the result were stored back in x. The loop only prints the returned value; no line says `x = increment(...)`. So every call starts from the same x.", "You let the if branch run three times. `i < 2` is strict, so it is True only for i = 0 and i = 1. Check i = 2 again.", null, "You added each result to x as you went. Nothing in the loop changes x; it is only passed to the function. Look for an assignment to x inside the loop."], "correct": 3, "why": "`range(5)` gives i = 0, 1, 2, 3, 4. For i = 0 and 1 the condition `i < 2` is True, and `increment(x)` uses the default `by=1`, giving 0 + 1 = 1. For i = 2, 3, 4 the else calls `increment(x, 2)`, giving 0 + 2 = 2. x itself is never reassigned, so it stays 0 the whole time. The rule: a default parameter is used only when the argument is left out, and a returned value changes nothing unless you assign it. Exam tip: look for an assignment like `x = ...` inside the loop before assuming a variable changes.", "code": "def increment(number, by=1):\n    return number + by\n\nx = 0\nfor i in range(5):\n    if i < 2:\n        print(increment(x))\n    else:\n        print(increment(x, 2))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def increment(number, by=1):", "fn": null, "t": "defines function increment()"}, {"k": "line", "n": 4, "src": "x = 0", "fn": null, "t": "x = 0"}, {"k": "line", "n": 5, "src": "for i in range(5):", "fn": null, "t": "i = 0"}, {"k": "line", "n": 6, "src": "if i < 2:", "fn": null, "t": "condition is True"}, {"k": "call", "t": "call increment(number=0, by=1)"}, {"k": "line", "n": 2, "src": "return number + by", "fn": "increment", "t": ""}, {"k": "ret", "t": "increment returns 1"}, {"k": "line", "n": 7, "src": "print(increment(x))", "fn": null, "t": "prints 1"}, {"k": "line", "n": 5, "src": "for i in range(5):", "fn": null, "t": "i = 1"}, {"k": "line", "n": 6, "src": "if i < 2:", "fn": null, "t": "condition is True"}, {"k": "call", "t": "call increment(number=0, by=1)"}, {"k": "line", "n": 2, "src": "return number + by", "fn": "increment", "t": ""}, {"k": "ret", "t": "increment returns 1"}, {"k": "line", "n": 7, "src": "print(increment(x))", "fn": null, "t": "prints 1"}, {"k": "line", "n": 5, "src": "for i in range(5):", "fn": null, "t": "i = 2"}, {"k": "line", "n": 6, "src": "if i < 2:", "fn": null, "t": "condition is False"}, {"k": "call", "t": "call increment(number=0, by=2)"}, {"k": "line", "n": 2, "src": "return number + by", "fn": "increment", "t": ""}, {"k": "ret", "t": "increment returns 2"}, {"k": "line", "n": 9, "src": "print(increment(x, 2))", "fn": null, "t": "prints 2"}, {"k": "line", "n": 5, "src": "for i in range(5):", "fn": null, "t": "i = 3"}, {"k": "line", "n": 6, "src": "if i < 2:", "fn": null, "t": "condition is False"}, {"k": "call", "t": "call increment(number=0, by=2)"}, {"k": "line", "n": 2, "src": "return number + by", "fn": "increment", "t": ""}, {"k": "ret", "t": "increment returns 2"}, {"k": "line", "n": 9, "src": "print(increment(x, 2))", "fn": null, "t": "prints 2"}, {"k": "line", "n": 5, "src": "for i in range(5):", "fn": null, "t": "i = 4"}, {"k": "line", "n": 6, "src": "if i < 2:", "fn": null, "t": "condition is False"}, {"k": "call", "t": "call increment(number=0, by=2)"}, {"k": "line", "n": 2, "src": "return number + by", "fn": "increment", "t": ""}, {"k": "ret", "t": "increment returns 2"}, {"k": "line", "n": 9, "src": "print(increment(x, 2))", "fn": null, "t": "prints 2"}, {"k": "line", "n": 5, "src": "for i in range(5):", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 16, "section": "Names, types and operators", "options": ["NameError", "6", "5", "TypeError"], "reasons": [null, "You read `My_var` as if it were `my_var`, so you computed 5 + 1. The capital M in the print line makes it a different name that holds no value. Check the spelling and the case of every name against its assignment.", "Printing 5 would mean Python ignored the `+ 1` and used `my_var`. Python never guesses which name you meant, so nothing is printed and the program stops. Unknown names end the program with a NameError.", "A TypeError needs two values of incompatible types, for example an int plus a str. Here Python never gets that far, because `My_var` has no value at all. A name that was never assigned always gives a NameError."], "correct": 1, "why": "Line 1 creates the name `my_var` with a lowercase m. Line 2 asks for `My_var` with a capital M, and Python treats that as a completely separate name that was never assigned. Python looks a name up before it does any arithmetic, so it stops with a NameError and `+ 1` never runs. Rule: names are case-sensitive, so every letter must match exactly. Exam tip: when a question uses a name that looks familiar, compare it letter by letter with the line where it was created.", "code": "my_var = 5\nprint(My_var + 1)", "trace": {"steps": [{"k": "line", "n": 1, "src": "my_var = 5", "fn": null, "t": "my_var = 5"}, {"k": "line", "n": 2, "src": "print(My_var + 1)", "fn": null, "t": "raises NameError"}], "more": 0}}, {"n": 17, "section": "Names, types and operators", "options": ["3.5 <class 'float'>", "3 <class 'int'>", "3.5 <class 'int'>", "4 <class 'int'>"], "reasons": [null, "You treated `/` like `//`, which drops the decimals. The code has one slash, and one slash keeps the .5. Only `7 // 2` would give the int 3.", "You got the value right but guessed the type from the inputs. A value with a decimal part like 3.5 can never be an int. Whatever `/` produces is a float.", "You rounded 3.5 up to the nearest whole number. `/` never rounds, and even `//` would round down to 3. Keep the exact result 3.5."], "correct": 1, "why": "`7 / 2` uses true division, which gives 3.5. The single slash returns a float in every case, even when both inputs are ints. So x is 3.5 and `type(x)` is `<class 'float'>`, and print shows both separated by a space. Rule: `/` always gives a float, `//` gives the rounded-down whole result. Exam tip: count the slashes first, then decide the type.", "code": "x = 7 / 2\nprint(x, type(x))", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 7 / 2", "fn": null, "t": "x = 3.5"}, {"k": "line", "n": 2, "src": "print(x, type(x))", "fn": null, "t": "prints 3.5 <class 'float'>"}], "more": 0}}, {"n": 18, "section": "Names, types and operators", "options": ["2 2", "2.67 2", "2 3", "3 2"], "reasons": [null, "You used normal division for the first value. `//` throws away the decimal part, and with two ints it returns an int. Ask how many whole 3s fit into 8: that is 2.", "You took the divisor 3 as the remainder. The remainder is what is left after removing the whole 3s: 8 - 2 * 3 = 2. A remainder is always smaller than the number you divide by.", "You rounded 8 / 3 = 2.67 to the nearest whole number. `//` always rounds down, so 2.67 becomes 2. Check: 3 * 3 = 9 is already bigger than 8."], "correct": 1, "why": "Write 8 as a multiple of 3 plus a rest: 8 = 2 * 3 + 2. `8 // 3` is the number of whole 3s that fit into 8, which is 2. `8 % 3` is what is left over, 8 - 6 = 2. Rule: `//` gives the whole-number part of a division (rounded down), `%` gives the remainder. Exam tip: do the `//` first, multiply back, and subtract to get the `%` result.", "code": "print(8 // 3, 8 % 3)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(8 // 3, 8 % 3)", "fn": null, "t": "prints 2 2"}], "more": 0}}, {"n": 19, "section": "Names, types and operators", "options": ["TypeError", "5 5 5", "15", "555"], "reasons": ["You mixed up the two string operators. `str * int` is allowed and repeats the text, only `str + int` fails. Check which operator the code uses before choosing an error.", "You added spaces between the copies. Repetition glues the copies directly together, the same way `+` joins strings. The result is one string with no gaps: \"555\".", "You treated \"5\" as the number 5 and multiplied. The quotes in `x = \"5\"` make x a string, and Python does not convert it by itself. With a string on one side, `*` means repetition.", null], "correct": 4, "why": "x is the string \"5\" because of the quotes, and y is the int 3. A string times an int repeats the string that many times, so \"5\" * 3 is \"555\". print shows the string without quotes. Rule: `str * int` repeats text, while `str + int` raises a TypeError. Exam tip: look for quotes around numbers, they turn the value into text.", "code": "x = \"5\"\ny = 3\nprint(x * y)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"5\"", "fn": null, "t": "x = '5'"}, {"k": "line", "n": 2, "src": "y = 3", "fn": null, "t": "y = 3"}, {"k": "line", "n": 3, "src": "print(x * y)", "fn": null, "t": "prints 555"}], "more": 0}}, {"n": 20, "section": "Names, types and operators", "options": ["TypeError", "350", "100 250", "100250"], "reasons": ["You remembered that int + str fails. That would be true for `x + y`, but here `str(x)` already made x a string. str + str is always allowed.", "You added the numbers 100 and 250. `str(x)` makes the left side a string, and y has quotes, so both sides are text. To get 350 you would need `x + int(y)`.", "You expected a space between the two parts. `+` on strings inserts nothing between them. Only print with commas, like `print(a, b)`, adds a space.", null], "correct": 4, "why": "`str(x)` turns the int 100 into the text \"100\". y is already the text \"250\". With two strings, `+` joins them end to end, so the result is \"100250\". Rule: `+` adds numbers but concatenates strings, and the types decide which one happens. Exam tip: after a cast, rewrite the line with the new values and their quotes.", "code": "x = 100\ny = \"250\"\nprint(str(x) + y)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 100", "fn": null, "t": "x = 100"}, {"k": "line", "n": 2, "src": "y = \"250\"", "fn": null, "t": "y = '250'"}, {"k": "line", "n": 3, "src": "print(str(x) + y)", "fn": null, "t": "prints 100250"}], "more": 0}}, {"n": 21, "section": "Names, types and operators", "options": ["42", "42.5", "TypeError", "420.5"], "reasons": ["You dropped the decimal part. When an int meets a float, the result is a float and keeps the .5. Only `int(...)` around the whole sum would cut it off.", null, "You treated the inputs as strings in the addition. The casts run before the `+`, so Python adds the int 42 and the float 0.5. Mixing int and float in arithmetic is always allowed.", "You joined the two parts as if they were still strings. After `int(...)` and `float(...)` both values are numbers, so `+` adds. String joining only happens when both sides are str."], "correct": 2, "why": "`int(\"42\")` reads the text and gives the int 42. `float(\"0.5\")` gives the float 0.5. Now both sides are numbers, so `+` adds them: 42 + 0.5 = 42.5. Rule: casting converts text into numbers, and int + float gives a float. Exam tip: evaluate each cast on its own first, then combine.", "code": "x = int(\"42\") + float(\"0.5\")\nprint(x)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = int(\"42\") + float(\"0.5\")", "fn": null, "t": "x = 42.5"}, {"k": "line", "n": 2, "src": "print(x)", "fn": null, "t": "prints 42.5"}], "more": 0}}, {"n": 22, "section": "Names, types and operators", "options": ["<class 'bool'>", "<class 'int'>", "<class 'str'>", "True"], "reasons": [null, "You thought of the numbers 10 and 3. The comparison combines them into True or False, so the result is a bool. The types of the inputs do not decide the type of a comparison.", "Nothing in this line is text. `10 > 3` compares two numbers and gives True. The type of True is bool.", "That is the value of `10 > 3`, but the code asks for its type. `type()` returns the class of a value. Work from the inside out: value True, then its class bool."], "correct": 1, "why": "First Python evaluates the inner expression `10 > 3`, which is True. Then `type(True)` returns the class of that value, which is bool. print shows a class as `<class 'bool'>`. Rule: every comparison (`>`, `<`, `==`, `!=` and so on) gives a bool. Exam tip: when you see `type(...)`, the answer always has the form `<class '...'>`.", "code": "print(type(10 > 3))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(type(10 > 3))", "fn": null, "t": "prints <class 'bool'>"}], "more": 0}}, {"n": 23, "section": "Names, types and operators", "options": ["12", "13", "12.5", "11"], "reasons": [null, "You rounded 9.9 up to 10. `int()` just removes the decimal part, so 9.9 becomes 9. Only `round(9.9)` would give 10.", "You expected a float result. `int(...)` returns an int and `round(x)` with one argument returns an int too. int + int is an int, so there is no decimal part.", "You treated `round(2.6)` like `int(2.6)` and got 2. `round` goes to the nearest whole number, and 2.6 is closer to 3. Keep the two functions apart: cut off versus round."], "correct": 1, "why": "`int(9.9)` cuts off everything after the decimal point and gives 9. `round(2.6)` rounds to the nearest whole number and gives 3. Both results are ints, so 9 + 3 = 12. Rule: `int()` truncates (it never rounds up), `round()` goes to the nearest integer. Exam tip: `int()` on a positive float simply removes the decimals.", "code": "print(int(9.9) + round(2.6))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(int(9.9) + round(2.6))", "fn": null, "t": "prints 12"}], "more": 0}}, {"n": 24, "section": "Names, types and operators", "options": ["<class 'list'> <class 'list'>", "<class 'str'> <class 'str'>", "<class 'int'> <class 'list'>", "<class 'str'> <class 'list'>"], "reasons": ["You thought `x[0]` returns a smaller list. A single index returns one element, here the string \"5\". A slice like `x[0:1]` would give a list.", "You gave x the type of its first element. The square brackets make x a list, whatever is inside. Only `x[0]` is the string.", "You looked at the number 5 inside `str(5)`. `str(5)` converts it to the text \"5\" before it goes into the list. So `x[0]` is a str.", null], "correct": 4, "why": "The square brackets build a list with three elements: the string \"5\", the int 5 and the float 5.0. `x[0]` is the first element, the string produced by `str(5)`, so its type is str. x itself is the whole list, so its type is list. Rule: indexing gives one element with that element's type, while the container keeps its own type. Exam tip: separate the container from what is inside it.", "code": "x = [str(5), 5, 5.0]\nprint(type(x[0]), type(x))", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = [str(5), 5, 5.0]", "fn": null, "t": "x = ['5', 5, 5.0]"}, {"k": "line", "n": 2, "src": "print(type(x[0]), type(x))", "fn": null, "t": "prints <class 'str'> <class 'list'>"}], "more": 0}}, {"n": 25, "section": "Names, types and operators", "options": ["NameError", "None", "3", "10"], "reasons": ["Every name used here is defined: a in line 1, b in line 2. A NameError appears only when a name was never assigned. Read the lines from top to bottom to check.", "You may think b lost its value when a changed. b was assigned 3 in line 2 and nothing reassigns b afterwards. A name only becomes None if None is assigned to it.", null, "You thought b is linked to a forever. `b = a` copies the current reference, so b gets 3 at that moment. Later `a = 10` only changes what a points to."], "correct": 3, "why": "Line 2 makes b refer to the same value as a, which is 3. Line 3 points the name a to a new value 10. That does not touch b, which still refers to 3. Rule: assignment binds a name to a value; rebinding one name never changes another name. Exam tip: track every name in a small table and update only the name on the left of `=`.", "code": "a = 3\nb = a\na = 10\nprint(b)", "trace": {"steps": [{"k": "line", "n": 1, "src": "a = 3", "fn": null, "t": "a = 3"}, {"k": "line", "n": 2, "src": "b = a", "fn": null, "t": "b = 3"}, {"k": "line", "n": 3, "src": "a = 10", "fn": null, "t": "a = 10"}, {"k": "line", "n": 4, "src": "print(b)", "fn": null, "t": "prints 3"}], "more": 0}}, {"n": 26, "section": "Names, types and operators", "options": ["10", "5", "2", "7"], "reasons": ["You stopped after line 2. Line 3 still subtracts 3 before print runs. Go through every line until the print.", "You assumed the expressions do not change x. Each line has `x = ...`, so the result is stored back. Follow x: 5, then 10, then 7.", "You used the original x = 5 in the last line: 5 - 3 = 2. Line 2 already changed x to 10. Each line works with the newest value.", null], "correct": 4, "why": "Line 1 sets x to 5. Line 2 computes `x * 2` with the old x, 5 * 2 = 10, and stores 10 in x. Line 3 computes 10 - 3 = 7 and stores 7. Rule: the right side of `=` is computed first with the current values, then the name is updated. Exam tip: write the value of x after every line.", "code": "x = 5\nx = x * 2\nx = x - 3\nprint(x)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 5", "fn": null, "t": "x = 5"}, {"k": "line", "n": 2, "src": "x = x * 2", "fn": null, "t": "x = 10"}, {"k": "line", "n": 3, "src": "x = x - 3", "fn": null, "t": "x = 7"}, {"k": "line", "n": 4, "src": "print(x)", "fn": null, "t": "prints 7"}], "more": 0}}, {"n": 27, "section": "Names, types and operators", "options": ["False False", "True True", "TypeError", "True False"], "reasons": ["You thought the different types make them unequal. For numbers, `==` compares the value, and 10 equals 10.0. Only int versus str comparisons are always False.", "You treated x as empty or missing. x was assigned 10, which is a real value. `x is None` is True only after `x = None`.", "Both comparisons are valid Python. Comparing an int with a float works, and any value can be tested with `is None`. Comparisons with `==` and `is` never raise a TypeError.", null], "correct": 4, "why": "`x == 10.0` compares values, and the int 10 and the float 10.0 are the same number, so it is True. `x is None` checks whether x is the special None object. x holds 10, so that is False. Rule: `==` compares numeric values across int and float; `is None` only tests for None. Exam tip: a number is never None, whatever its value.", "code": "x = 10\nprint(x == 10.0, x is None)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 2, "src": "print(x == 10.0, x is None)", "fn": null, "t": "prints True False"}], "more": 0}}, {"n": 28, "section": "Names, types and operators", "options": ["16", "64", "12", "32"], "reasons": [null, "You computed `3 * 2` first and then 2 ** 6. That would need brackets: `2 ** (3 * 2)`. Without brackets, the power is done first.", "You read `2 ** 3` as 2 * 3 = 6. `**` is a power: 2 * 2 * 2 = 8. Then 8 * 2 = 16.", "You got the order right but miscalculated. 2 ** 3 is 8 and 8 * 2 is 16. 32 would be 2 ** 5."], "correct": 1, "why": "`**` binds tighter than `*`, so Python computes `2 ** 3` first, which is 8. Then 8 * 2 = 16. Rule: the order is `**` first, then `*`, `/`, `//`, `%`, then `+` and `-`. Exam tip: put imaginary brackets around the `**` part before calculating.", "code": "print(2 ** 3 * 2)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(2 ** 3 * 2)", "fn": null, "t": "prints 16"}], "more": 0}}, {"n": 29, "section": "Names, types and operators", "options": ["77", "344", "TypeError", "3434"], "reasons": ["You treated the strings as numbers: 3 + 4 * 2 would be 11, and (3 + 4) would be 7. The quotes make every value text, so no arithmetic happens. `*` repeats and `+` joins.", null, "Both operations here are allowed. `str * int` repeats a string and `str + str` joins two strings. Only `str + int` or `str * str` would fail.", "You joined first and then repeated: (\"3\" + \"4\") * 2. Without brackets, `*` goes first, so only \"4\" is repeated. Then \"3\" is put in front."], "correct": 2, "why": "`*` binds tighter than `+`, so `\"4\" * 2` runs first and gives \"44\". Then `\"3\" + \"44\"` joins two strings into \"344\". Rule: operator precedence is the same for strings and numbers, only the meaning changes (repeat and join). Exam tip: solve the `*` part first and write down the intermediate string.", "code": "print(\"3\" + \"4\" * 2)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"3\" + \"4\" * 2)", "fn": null, "t": "prints 344"}], "more": 0}}, {"n": 30, "section": "Names, types and operators", "options": ["TypeError", "1", "True", "2"], "reasons": ["You thought bools cannot be used in arithmetic. Python allows it because True behaves like 1 and False like 0. So the sum is a normal int.", "You counted only one True. The line has two Trues and one False: 1 + 1 + 0. Count each term.", "You expected the result to stay a bool. `+` turns the bools into numbers and returns an int. Only logic operators like `and` and `or` keep True/False style results.", null], "correct": 4, "why": "In arithmetic, True counts as 1 and False counts as 0. So the line computes 1 + 1 + 0 = 2. The result of adding bools is an int, so print shows 2. Rule: bool is a subtype of int, with True == 1 and False == 0. Exam tip: when bools appear in `+`, `-` or `*`, replace them by 1 and 0.", "code": "x = True + True + False\nprint(x)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = True + True + False", "fn": null, "t": "x = 2"}, {"k": "line", "n": 2, "src": "print(x)", "fn": null, "t": "prints 2"}], "more": 0}}, {"n": 31, "section": "Names, types and operators", "options": ["False False", "True True", "TypeError", "False True"], "reasons": ["You thought the second comparison also mixes types. `str(a)` makes the left side the string \"4\". Two equal strings give True.", "You compared what the values look like when printed. 4 and \"4\" have different types, and an int is never equal to a str. Only after `str(a)` do both sides match.", "You applied the `+` rule to `==`. `int + str` fails, but `int == str` is allowed and simply gives False. Comparisons with `==` never raise a TypeError.", null], "correct": 4, "why": "The first line assigns a = 4 (an int) and b = \"4\" (a string). `a == b` compares an int with a string, which is always False. `str(a)` turns 4 into \"4\", and \"4\" == \"4\" is True. Rule: `==` between a number and text never raises an error, it just gives False. Exam tip: check the quotes on both sides of every `==`.", "code": "a, b = 4, \"4\"\nprint(a == b, str(a) == b)", "trace": {"steps": [{"k": "line", "n": 1, "src": "a, b = 4, \"4\"", "fn": null, "t": "a = 4; b = '4'"}, {"k": "line", "n": 2, "src": "print(a == b, str(a) == b)", "fn": null, "t": "prints False True"}], "more": 0}}, {"n": 32, "section": "Names, types and operators", "options": ["7", "10", "7.4", "8"], "reasons": [null, "You computed `5 * 2` first and then 17 % 10 = 7, plus 3. `%` and `*` have the same priority, so they go left to right: `(17 % 5) * 2`. That gives 4, then 4 + 3 = 7.", "You used normal division for `x // 5` and got 3.4. `//` gives the whole-number part only, so 17 // 5 is 3. All parts are ints, so the result is an int.", "You rounded 17 / 5 = 3.4 up to 4. `//` always rounds down, so the result is 3. Then 4 + 3 = 7."], "correct": 1, "why": "`%`, `*` and `//` have the same priority and run from left to right, all before `+`. So first `17 % 5` gives the remainder 2, then 2 * 2 = 4. Separately `17 // 5` gives 3, because three 5s fit into 17. Finally 4 + 3 = 7. Rule: operators of the same level are evaluated left to right. Exam tip: mark the `+` as the last step and solve each side of it on its own.", "code": "x = 17\nprint(x % 5 * 2 + x // 5)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 17", "fn": null, "t": "x = 17"}, {"k": "line", "n": 2, "src": "print(x % 5 * 2 + x // 5)", "fn": null, "t": "prints 7"}], "more": 0}}, {"n": 33, "section": "Names, types and operators", "options": ["2 3", "3 2", "1 3", "2 4"], "reasons": [null, "You swapped the order of the results. The first name on the left gets the first value on the right: a gets b, which is 2. The second name, b, gets `a + b`, which is 3.", "You only changed b. The left side lists both names, so a receives the first value on the right, which is b = 2. Match left and right positions one by one.", "You updated a first and then used the new a for `a + b`. Python computes `a + b` with the old a = 1 before any assignment. So b becomes 1 + 2 = 3."], "correct": 1, "why": "In a multiple assignment, the whole right side is computed first with the old values. With a = 1 and b = 2, the right side `b, a + b` becomes (2, 3). Only then are the names updated: a gets 2 and b gets 3. Rule: `a, b = ...` evaluates everything on the right before assigning anything. Exam tip: freeze the old values, compute the right side, then assign.", "code": "a = 1\nb = 2\na, b = b, a + b\nprint(a, b)", "trace": {"steps": [{"k": "line", "n": 1, "src": "a = 1", "fn": null, "t": "a = 1"}, {"k": "line", "n": 2, "src": "b = 2", "fn": null, "t": "b = 2"}, {"k": "line", "n": 3, "src": "a, b = b, a + b", "fn": null, "t": "a = 2; b = 3"}, {"k": "line", "n": 4, "src": "print(a, b)", "fn": null, "t": "prints 2 3"}], "more": 0}}, {"n": 34, "section": "Names, types and operators", "options": ["24", "25", "6", "20"], "reasons": ["You read `x *= x - 1` as `x * x - 1` = 25 - 1. The right side is computed as a whole first, so it is `x * (x - 1)`. That gives 5 * 4 = 20.", "You ignored the `- 1` and squared x. The right side is `x - 1`, which is 4 when x is 5. So the result is 5 * 4 = 20.", "You skipped the `x += 2` line and used x = 3: 3 * 2 = 6. `x += 2` stores 5 in x before the next line. Go line by line.", null], "correct": 4, "why": "`x += 2` is short for `x = x + 2`, so x becomes 5. `x *= x - 1` means `x = x * (x - 1)`: the whole right side is computed first. With x = 5 that is 5 * (5 - 1) = 5 * 4 = 20. Rule: an augmented assignment applies its operator to the complete expression on the right. Exam tip: rewrite `x op= expr` as `x = x op (expr)` with brackets.", "code": "x = 3\nx += 2\nx *= x - 1\nprint(x)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 3", "fn": null, "t": "x = 3"}, {"k": "line", "n": 2, "src": "x += 2", "fn": null, "t": "x = 5"}, {"k": "line", "n": 3, "src": "x *= x - 1", "fn": null, "t": "x = 20"}, {"k": "line", "n": 4, "src": "print(x)", "fn": null, "t": "prints 20"}], "more": 0}}, {"n": 35, "section": "Names, types and operators", "options": ["2.0 2 1.5", "2 2 1", "2.0 2 1.0", "2.0 2.0 1.0"], "reasons": ["You treated `6.0 // 4` like normal division. `//` rounds the result 1.5 down to 1. Because 6.0 is a float, it is shown as 1.0.", "You expected exact divisions to give ints. `/` returns a float in every case, so 6 / 3 is 2.0. And `//` with a float input also returns a float.", null, "You thought `//` always gives a float, like `/`. `6 // 3` has two int inputs, so the result is the int 2. Only `/` always produces a float."], "correct": 3, "why": "`6 / 3` is true division, which always gives a float, so it prints 2.0 even though the division is exact. `6 // 3` with two ints gives the int 2. `6.0 // 4` rounds 1.5 down to 1, but one input is a float, so the result is the float 1.0. Rule: `/` always gives a float; `//` gives an int only when both inputs are ints. Exam tip: look for a `.0` in the inputs of `//`.", "code": "print(6 / 3, 6 // 3, 6.0 // 4)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(6 / 3, 6 // 3, 6.0 // 4)", "fn": null, "t": "prints 2.0 2 1.0"}], "more": 0}}, {"n": 36, "section": "Names, types and operators", "options": ["-3 -1", "-4 1", "-3 1", "-4 -1"], "reasons": ["You cut off the decimals of -3.5 like `int()` does. `//` rounds down, and down from -3.5 is -4. The remainder then follows from -7 = 2 * (-4) + 1.", null, "You got the remainder right but cut -3.5 toward zero. `//` always goes to the next smaller whole number, which is -4. Check: 2 * (-3) + 1 = -5, which is not -7.", "You got the floor right but gave the remainder the sign of -7. In Python the remainder takes the sign of the divisor 2, so it is positive. Check: 2 * (-4) + 1 = -7."], "correct": 2, "why": "`-7 / 2` is -3.5, and `//` always rounds down toward minus infinity, so -3.5 becomes -4. The remainder must fit the equation -7 = 2 * (-4) + r. 2 * (-4) = -8, so r = -7 - (-8) = 1. Rule: `//` rounds down toward minus infinity, and with a positive divisor `%` is never negative. Exam tip: for negative numbers, find the floor first, then compute the remainder from it.", "code": "print(-7 // 2, -7 % 2)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(-7 // 2, -7 % 2)", "fn": null, "t": "prints -4 1"}], "more": 0}}, {"n": 37, "section": "Names, types and operators", "options": ["ValueError", "6.0 3.03.0", "6 6.0", "6 3.03.0"], "reasons": ["You remembered that `int(\"3.0\")` fails. Here `float` runs first and gives the number 3.0, and `int(3.0)` works fine. A ValueError only comes when `int` gets text with a decimal point.", "You forgot the outer `int(...)`. `float(x)` gives 3.0, but `int` turns it into the int 3. 3 * 2 is the int 6.", "You thought x became a number after the cast. `int(float(x))` produces a new value used only in that expression. x is still the string \"3.0\", so `x * 2` repeats the text.", null], "correct": 4, "why": "x is the string \"3.0\". In the first part, `float(x)` turns it into the number 3.0, `int(...)` cuts that to 3, and 3 * 2 = 6. In the second part, x is still the original string, because the casts created new values and did not change x. So `x * 2` repeats the text: \"3.03.0\". Rule: casting returns a new value and leaves the variable unchanged. Exam tip: check whether each use of a variable is inside a cast or not.", "code": "x = \"3.0\"\nprint(int(float(x)) * 2, x * 2)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = \"3.0\"", "fn": null, "t": "x = '3.0'"}, {"k": "line", "n": 2, "src": "print(int(float(x)) * 2, x * 2)", "fn": null, "t": "prints 6 3.03.0"}], "more": 0}}, {"n": 38, "section": "Names, types and operators", "options": ["True True True", "False True False", "False False False", "True True False"], "reasons": ["You treated \"1\" as the number 1. The quotes make it a string, and a string never equals an int. That comparison gives False.", "You thought a bool and an int can never be equal. In Python, True is equal to 1 and False is equal to 0. So `True == 1` is True.", "You assumed comparisons between different types always fail. This is only true for text versus numbers. True counts as 1, so the first two comparisons are True.", null], "correct": 4, "why": "True is stored as the number 1, so `True == 1` is True. `True + 1` is 1 + 1 = 2, and `2 == 2` is True; `+` runs before `==`. `\"1\" == 1` compares a string with an int, which is always False. Rule: bools behave like 0 and 1 in comparisons and arithmetic, but strings never equal numbers. Exam tip: quotes make a value text, no matter what it looks like.", "code": "print(True == 1, True + 1 == 2, \"1\" == 1)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(True == 1, True + 1 == 2, \"1\" == 1)", "fn": null, "t": "prints True True False"}], "more": 0}}, {"n": 39, "section": "Names, types and operators", "options": ["None False", "<class 'NoneType'> True", "<class 'NoneType'> False", "<class 'None'> False"], "reasons": ["You printed the value of x for the first part. `type(x)` returns the class of x, shown as `<class '...'>`. For None that is NoneType.", "You treated None like 0 because both are falsy. Being falsy only matters in `if` and `bool()`. `==` compares values, and None is not the number 0.", null, "You used the value name as the class name. The value is None, but its class is called NoneType. `type()` always shows the class."], "correct": 3, "why": "None is Python's value for nothing, and its class is called NoneType. So `type(x)` prints `<class 'NoneType'>`. None is not a number, so `x == 0` is False, even though None and 0 are both falsy. Rule: None is its own type and is only equal to None. Exam tip: falsy values (0, \"\", None, []) are not equal to each other.", "code": "x = None\nprint(type(x), x == 0)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = None", "fn": null, "t": "x = None"}, {"k": "line", "n": 2, "src": "print(type(x), x == 0)", "fn": null, "t": "prints <class 'NoneType'> False"}], "more": 0}}, {"n": 40, "section": "Names, types and operators", "options": ["TypeError", "24", "30", "426"], "reasons": ["You remembered that `len()` fails on an int. Here `str(n)` converts n to a string first, and strings have a length. `len(n)` without the cast would raise a TypeError.", "You computed `n // 100` = 20, which removes the last two digits. `%` gives the remainder, which is 26. 4 + 26 = 30.", null, "You joined 4 and 26 as text. `len()` returns an int and `n % 100` returns an int, so `+` adds them. 4 + 26 = 30."], "correct": 3, "why": "`str(n)` turns 2026 into the text \"2026\", which has 4 characters, so `len(...)` is 4. `n % 100` is the remainder after dividing by 100, which is the last two digits: 26. Both are ints, so 4 + 26 = 30. Rule: `len()` works on strings but not on ints, and `% 100` gives the last two digits. Exam tip: `// 100` removes the last two digits, `% 100` keeps only them.", "code": "n = 2026\nprint(len(str(n)) + n % 100)", "trace": {"steps": [{"k": "line", "n": 1, "src": "n = 2026", "fn": null, "t": "n = 2026"}, {"k": "line", "n": 2, "src": "print(len(str(n)) + n % 100)", "fn": null, "t": "prints 30"}], "more": 0}}, {"n": 41, "section": "Names, types and operators", "options": ["TypeError", "12.5", "12", "1"], "reasons": ["You expected `x + \"0\"` to mix types. Line 2 already made x the string \"5\", so it is str + str. Joining two strings is allowed.", "You used normal division: 50 / 4 = 12.5. The code uses `//`, which drops the decimals. With two ints the result is the int 12.", null, "You thought `+ \"0\"` adds zero, leaving 5, and 5 // 4 = 1. x is a string at that point, so `+` appends the character 0. x becomes \"50\", and 50 // 4 = 12."], "correct": 3, "why": "Line 2 turns x into the string \"5\". Line 3 joins two strings: \"5\" + \"0\" gives \"50\". In the print, `int(x)` reads \"50\" as the number 50, and 50 // 4 = 12, because 4 * 12 = 48. Rule: a name can change its type through reassignment, and the latest type decides what `+` does. Exam tip: write down the value and the type of x after every line.", "code": "x = 5\nx = str(x)\nx = x + \"0\"\nprint(int(x) // 4)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 5", "fn": null, "t": "x = 5"}, {"k": "line", "n": 2, "src": "x = str(x)", "fn": null, "t": "x = '5'"}, {"k": "line", "n": 3, "src": "x = x + \"0\"", "fn": null, "t": "x = '50'"}, {"k": "line", "n": 4, "src": "print(int(x) // 4)", "fn": null, "t": "prints 12"}], "more": 0}}, {"n": 42, "section": "Strings and string methods", "options": ["hello world", "hell0 world", "hell0 w0rld", "Hell0 W0rld"], "reasons": ["You stopped after `.lower()`. The result of replace is what gets printed, and it changes both o's. Follow the chain to the end.", "You replaced only the first o. Without a third argument, replace changes every match. \"hello world\" has two o's, so both become 0.", null, "You applied replace to the original string. `.lower()` runs first and turns H and W into h and w. replace then works on the lowercase text."], "correct": 3, "why": "Chained methods run from left to right. `s.lower()` gives \"hello world\". Then `.replace(\"o\", \"0\")` swaps every letter o for the digit 0, giving \"hell0 w0rld\". Rule: each method in a chain works on the result of the method before it. Exam tip: write the intermediate string after each dot.", "code": "s = \"Hello World\"\nprint(s.lower().replace(\"o\", \"0\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"Hello World\"", "fn": null, "t": "s = 'Hello World'"}, {"k": "line", "n": 2, "src": "print(s.lower().replace(\"o\", \"0\"))", "fn": null, "t": "prints hell0 w0rld"}], "more": 0}}, {"n": 43, "section": "Strings and string methods", "options": ["data", "Data", "DATA", "None"], "reasons": [null, "You mixed up `upper()` with `capitalize()`. In any case the result is not stored, so s is unchanged. Look for an assignment before deciding what changed.", "You thought `s.upper()` changes s. Strings never change in place, the uppercase version is returned and thrown away. You would need `s = s.upper()`.", "You may be thinking of list methods like `append`, which return None. Here we print s, and s still holds \"data\". Nothing assigned None to s."], "correct": 1, "why": "`s.upper()` creates a new string \"DATA\", but line 2 does not store it anywhere. Strings are immutable, so the method cannot change s itself. s therefore still holds \"data\". Rule: string methods return a new string; you must assign it, as in `s = s.upper()`. Exam tip: a method call on its own line with no `=` has no lasting effect on a string.", "code": "s = \"data\"\ns.upper()\nprint(s)", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"data\"", "fn": null, "t": "s = 'data'"}, {"k": "line", "n": 2, "src": "s.upper()", "fn": null, "t": ""}, {"k": "line", "n": 3, "src": "print(s)", "fn": null, "t": "prints data"}], "more": 0}}, {"n": 44, "section": "Strings and string methods", "options": ["Zurich", "ZURICH", "zurich", "  Zurich  "], "reasons": [null, "You treated `title()` like `upper()`. `title()` only makes the first letter of each word uppercase. The rest of the word becomes lowercase.", "You forgot the effect of `title()`. It turns the first letter z into Z. The result of the whole chain is printed.", "You applied title but forgot strip. `strip()` runs first and removes the spaces at both ends. The printed text has no leading or trailing spaces."], "correct": 1, "why": "`s.strip()` removes the spaces at both ends and gives \"zurich\". `.title()` then makes the first letter of every word uppercase and the rest lowercase: \"Zurich\". Rule: `strip()` only removes characters at the edges, and `title()` capitalises each word. Exam tip: chain left to right and write the result of each step.", "code": "s = \"  zurich  \"\nprint(s.strip().title())", "trace": {"steps": [{"k": "line", "n": 1, "src": "s = \"  zurich  \"", "fn": null, "t": "s = '  zurich  '"}, {"k": "line", "n": 2, "src": "print(s.strip().title())", "fn": null, "t": "prints Zurich"}], "more": 0}}, {"n": 45, "section": "Strings and string methods", "options": ["a b c", "abc", "['a-b-c']", "['a', 'b', 'c']"], "reasons": ["You printed the pieces as if they were separate arguments. print receives one list, so it shows the list form with brackets and quotes. `print(*parts)` would give a b c, but that is not used here.", "You thought split removes the dashes and returns text. split returns a list of the pieces. To get \"abc\" you would need `\"\".join(...)` afterwards.", "You thought the separator was not found. The string contains \"-\" twice, so it is cut in two places. That gives three pieces.", null], "correct": 4,
