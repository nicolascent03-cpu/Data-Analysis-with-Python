", "z; r; c; h", "z; r; c"], "reasons": ["Each print call writes its own line, so the letters are printed separately.", "You picked the odd positions. Index 0 is even, so the first printed letter is z.", "Index 5 (h) is odd, so it is not printed.", null], "correct": 4, "why": "`len(city)` is 6, so i goes 0 to 5. Even indices are 0, 2, 4. city[0] is z, city[2] is r, city[4] is c. Odd indices 1, 3, 5 (u, i, h) are skipped. Rule: `i % 2 == 0` keeps even positions, and positions start at 0. Exam tip: write the word with its index numbers under each letter.", "code": "city = \"zurich\"\nfor i in range(len(city)):\n    if i % 2 == 0:\n        print(city[i])", "trace": {"steps": [{"k": "line", "n": 1, "src": "city = \"zurich\"", "fn": null, "t": "city = 'zurich'"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 0"}, {"k": "line", "n": 3, "src": "if i % 2 == 0:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints z"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 1"}, {"k": "line", "n": 3, "src": "if i % 2 == 0:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 2"}, {"k": "line", "n": 3, "src": "if i % 2 == 0:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints r"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 3"}, {"k": "line", "n": 3, "src": "if i % 2 == 0:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 4"}, {"k": "line", "n": 3, "src": "if i % 2 == 0:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "print(city[i])", "fn": null, "t": "prints c"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "i = 5"}, {"k": "line", "n": 3, "src": "if i % 2 == 0:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 2, "src": "for i in range(len(city)):", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 167, "section": "Loops", "options": ["6", "[1, 2, 3]", "None", "[2, 4, 6]"], "reasons": ["The code prints L, the whole list, and not the last value of x.", null, "L is a normal list and still holds its three values, so it is printed as a list.", "You assumed x is a slot in the list. x is only a name; `x = x * 2` makes it point to a new number."], "correct": 2, "why": "In each round x is a name for the current element. Round 1: x = 1, then x is rebound to 2. Round 2: x = 2 becomes 4. Round 3: x = 3 becomes 6. These assignments only change the name x; the list L is never touched. So L is still [1, 2, 3]. Rule: assigning to the loop variable does not change the list. Exam tip: to change the list, assign to `L[i]` using an index.", "code": "L = [1, 2, 3]\nfor x in L:\n    x = x * 2\nprint(L)", "trace": {"steps": [{"k": "line", "n": 1, "src": "L = [1, 2, 3]", "fn": null, "t": "L = [1, 2, 3]"}, {"k": "line", "n": 2, "src": "for x in L:", "fn": null, "t": "x = 1"}, {"k": "line", "n": 3, "src": "x = x * 2", "fn": null, "t": "x = 2"}, {"k": "line", "n": 2, "src": "for x in L:", "fn": null, "t": "no items left, loop ends"}, {"k": "line", "n": 3, "src": "x = x * 2", "fn": null, "t": "x = 4"}, {"k": "line", "n": 2, "src": "for x in L:", "fn": null, "t": "x = 3"}, {"k": "line", "n": 3, "src": "x = x * 2", "fn": null, "t": "x = 6"}, {"k": "line", "n": 2, "src": "for x in L:", "fn": null, "t": "no items left, loop ends"}, {"k": "line", "n": 4, "src": "print(L)", "fn": null, "t": "prints [1, 2, 3]"}], "more": 0}}, {"n": 168, "section": "Loops", "options": ["10; 7; 4; 1; 0", "(nothing is printed)", "10; 7; 4", "10; 7; 4; 1"], "reasons": ["0 is the stop value and is never included. Also 0 is not reachable with steps of 3 from 10.", "You may think range only counts upward. With the step -3 it counts down from 10.", "You stopped too early. 1 is still above the stop value 0, so it is produced.", null], "correct": 4, "why": "With a negative step, range counts down and stops before passing the stop value. Start at 10, then 7, then 4, then 1. The next value would be -2, which is past the stop 0, so it is not produced. Rule: the stop value is excluded in both directions; with a negative step the values must stay above the stop. Exam tip: keep subtracting until the next value would be 0 or lower.", "code": "for i in range(10, 0, -3):\n    print(i)", "trace": {"steps": [{"k": "line", "n": 1, "src": "for i in range(10, 0, -3):", "fn": null, "t": "i = 10"}, {"k": "line", "n": 2, "src": "print(i)", "fn": null, "t": "prints 10"}, {"k": "line", "n": 1, "src": "for i in range(10, 0, -3):", "fn": null, "t": "i = 7"}, {"k": "line", "n": 2, "src": "print(i)", "fn": null, "t": "prints 7"}, {"k": "line", "n": 1, "src": "for i in range(10, 0, -3):", "fn": null, "t": "i = 4"}, {"k": "line", "n": 2, "src": "print(i)", "fn": null, "t": "prints 4"}, {"k": "line", "n": 1, "src": "for i in range(10, 0, -3):", "fn": null, "t": "i = 1"}, {"k": "line", "n": 2, "src": "print(i)", "fn": null, "t": "prints 1"}, {"k": "line", "n": 1, "src": "for i in range(10, 0, -3):", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 169, "section": "Loops", "options": ["5; 4; 3; 2; done", "ValueError", "5; done", "done"], "reasons": ["You assumed range counts down by itself. Without a negative step it never goes down.", "An empty range is valid and raises no error. Only a step of 0 would raise ValueError.", "You let the first value through. 5 is not below the stop 1, so not even 5 is produced.", null], "correct": 4, "why": "`range(5, 1)` has the default step 1, so it would count up from 5. But 5 is already not below 1, so the range is empty. The loop body never runs, and only the last line prints `done`. Rule: to count down you must give a negative step, for example `range(5, 1, -1)`. Exam tip: if start is greater than  "n": 8, "src": "print(total)", "fn": null, "t": "prints 13"}], "more": 0}}, {"n": 171, "section": "Loops", "options": ["1; 2; 4", "1; 2; 4; 5", "0; 1; 2; 4", "1; 2"], "reasons": ["You stopped at 4. In the round where n is 4, the condition 4 < 5 is True, so n becomes 5 and is printed.", null, "You printed n before increasing it. `n += 1` is the first line of the body, so the first print is 1.", "You treated continue like break. continue only skips the rest of that round, and the loop goes on."], "correct": 2, "why": "n is increased before the check, so the printed values start at 1. Round 1: n = 1, prints 1. Round 2: n = 2, prints 2. Round 3: n = 3, continue skips the print. Round 4: n = 4, prints 4. Round 5: n = 5, prints 5. Then 5 < 5 is False and the loop ends. Rule: continue in a while loop jumps back to the condition; here it is safe because n was increased first.", "code": "n = 0\nwhile n < 5:\n    n += 1\n    if n == 3:\n        continue\n    print(n)", "trace": {"steps": [{"k": "line", "n": 1, "src": "n = 0", "fn": null, "t": "n = 0"}, {"k": "line", "n": 2, "src": "while n < 5:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "n += 1", "fn": null, "t": "n = 1"}, {"k": "line", "n": 4, "src": "if n == 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(n)", "fn": null, "t": "prints 1"}, {"k": "line", "n": 2, "src": "while n < 5:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "n += 1", "fn": null, "t": "n = 2"}, {"k": "line", "n": 4, "src": "if n == 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(n)", "fn": null, "t": "prints 2"}, {"k": "line", "n": 2, "src": "while n < 5:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "n += 1", "fn": null, "t": "n = 3"}, {"k": "line", "n": 4, "src": "if n == 3:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 5, "src": "continue", "fn": null, "t": ""}, {"k": "line", "n": 2, "src": "while n < 5:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "n += 1", "fn": null, "t": "n = 4"}, {"k": "line", "n": 4, "src": "if n == 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(n)", "fn": null, "t": "prints 4"}, {"k": "line", "n": 2, "src": "while n < 5:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "n += 1", "fn": null, "t": "n = 5"}, {"k": "line", "n": 4, "src": "if n == 3:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(n)", "fn": null, "t": "prints 5"}, {"k": "line", "n": 2, "src": "while n < 5:", "fn": null, "t": "condition is False"}], "more": 0}}, {"n": 172, "section": "Loops", "options": ["1 x; 3 z", "0 x; 2 z", "1 y; 3 z", "2 y"], "reasons": [null, "You ignored the start value. With `enumerate(\"xyz\", 1)` the first number is 1, not 0.", "You shifted the letters. The start value changes only the counter; the first element is still x.", "You picked the even numbers. `i % 2 == 1` is True for odd i, which are 1 and 3."], "correct": 1, "why": "The second argument 1 makes enumerate start counting at 1: pairs (1, \"x\"), (2, \"y\"), (3, \"z\"). i = 1 is odd, prints `1 x`. i = 2 is even, skipped. i = 3 is odd, prints `3 z`. Rule: `enumerate(seq, start)` changes only the numbers, the elements still come from the start of the sequence. Exam tip: write the pairs first, then apply the condition.", "code": "for i, c in enumerate(\"xyz\", 1):\n    if i % 2 == 1:\n        print(i, c)", "trace": {"steps": [{"k": "line", "n": 1, "src": "for i, c in enumerate(\"xyz\", 1):", "fn": null, "t": "i = 1; c = 'x'"}, {"k": "line", "n": 2, "src": "if i % 2 == 1:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "print(i, c)", "fn": null, "t": "prints 1 x"}, {"k": "line", "n": 1, "src": "for i, c in enumerate(\"xyz\", 1):", "fn": null, "t": "i = 2; c = 'y'"}, {"k": "line", "n": 2, "src": "if i % 2 == 1:", "fn": null, "t": "condition is False"}, {"k": "line"  True; Cy False"], "reasons": ["The code prints `a > 25`, a comparison, so each line ends with True or False. The ages themselves are never printed.", "zip never raises an error for unequal lengths. It simply stops early.", null, "zip stops when the shorter list is used up. There is no age for Cy, so no third round."], "correct": 3, "why": "zip pairs by position and stops at the shorter list, which has 2 elements. Round 1: n = \"Ana\", a = 20; 20 > 25 is False, prints `Ana False`. Round 2: n = \"Ben\", a = 31; 31 > 25 is True, prints `Ben True`. \"Cy\" has no partner and is skipped. Rule: printing a comparison prints True or False.", "code": "names = [\"Ana\", \"Ben\", \"Cy\"]\nages = [20, 31]\nfor n, a in zip(names, ages):\n    print(n, a > 25)", "trace": {"steps": [{"k": "line", "n": 1, "src": "names = [\"Ana\", \"Ben\", \"Cy\"]", "fn": null, "t": "names = ['Ana', 'Ben', 'Cy']"}, {"k": "line", "n": 2, "src": "ages = [20, 31]", "fn": null, "t": "ages = [20, 31]"}, {"k": "line", "n": 3, "src": "for n, a in zip(names, ages):", "fn": null, "t": "n = 'Ana'; a = 20"}, {"k": "line", "n": 4, "src": "print(n, a > 25)", "fn": null, "t": "prints Ana False"}, {"k": "line", "n": 3, "src": "for n, a in zip(names, ages):", "fn": null, "t": "n = 'Ben'; a = 31"}, {"k": "line", "n": 4, "src": "print(n, a > 25)", "fn": null, "t": "prints Ben True"}, {"k": "line", "n": 3, "src": "for n, a in zip(names, ages):", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 177, "section": "Loops", "options": ["olleh", "h; eh; leh; lleh; olleh", "hello", "o"], "reasons": [null, "The print is not indented, so only the final string is printed.", "That would be `s = s + ch`. Here ch is added to the left, so the word is reversed.", "s is not replaced by ch each round. It keeps everything collected so far and grows to five characters."], "correct": 1, "why": "Each new character is put in front of what s already holds. Round 1: s = \"h\". Round 2: s = \"eh\". Round 3: s = \"leh\". Round  `0 3`. Rule: the while condition is only checked at the start of each round, so x can end below the limit.", "code": "x = 20\nsteps = 0\nwhile x > 1:\n    x = x // 3\n    steps += 1\nprint(x, steps)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 20", "fn": null, "t": "x = 20"}, {"k": "line", "n": 2, "src": "steps = 0", "fn": null, "t": "steps = 0"}, {"k": "line", "n": 3, "src": "while x > 1:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "x = x // 3", "fn": null, "t": "x = 6"}, {"k": "line", "n": 5, "src": "steps += 1", "fn": null, "t": "steps = 1"}, {"k": "line", "n": 3, "src": "while x > 1:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "x = x // 3", "fn": null, "t": "x = 2"}, {"k": "line", "n": 5, "src": "steps += 1", "fn": null, "t": "steps = 2"}, {"k": "line", "n": 3, "src": "while x > 1:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 4, "src": "x = x // 3", "fn": null, "t": "x = 0"}, {"k": "line", "n": 5, "src": "steps += 1", "fn": null, "t": "steps = 3"}, {"k": "line", "n": 3, "src": "while x > 1:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(x, steps)", "fn": null, "t": "prints 0 3"}], "more": 0}}, {"n": 179, "section": "Loops", "options": ["9", "4", "25", "5"], "reasons": ["You assumed the loop ran to the end of range(10). break stopped it at i = 5.", "You printed the last value that passed the test. The loop stops in the round of i = 5, and i keeps 5.", "You printed the square that triggered break. The code prints `i`, which is 5 at that moment.", null], "correct": 4, "why": "The loop checks i * i for each i: 0, 1, 4, 9, 16 are all at most 20. At i = 5, 5 * 5 = 25 is greater than 20, so break ends the loop while i is 5. The print is after the loop and shows the value i had when the loop stopped: 5. Rule: after a break, the loop variable keeps the value from the round where break ran.", "code": "for i in range(10):\n    if i * i > 20:\n        break\nprint(i mputes `a - b`, which is `3 - 10 = -7`, and returns it, so `print` shows -7. The rule: positional arguments are matched to parameters strictly from left to right. Exam tip: write each value next to its parameter name before you calculate anything.", "code": "def f(a, b):\n    return a - b\n\nprint(f(3, 10))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(a, b):", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f(a=3, b=10)"}, {"k": "line", "n": 2, "src": "return a - b", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns -7"}, {"k": "line", "n": 4, "src": "print(f(3, 10))", "fn": null, "t": "prints -7"}], "more": 0}}, {"n": 181, "section": "Functions", "options": ["None; 6", "6; 6", "6; None", "None"], "reasons": ["The order is reversed. The call on the line `z = f(2, 3)` happens first and prints 6, and only afterwards does `print(z)` print None. Follow the code from top to bottom.", "You expected the function to return what it prints. `print(a * b)` only displays 6, so `z` receives None. The function would need `return a * b` for z to become 6.", null, "You skipped the output produced during the call. The line `z = f(2, 3)` runs the function body, and its `print(a * b)` writes 6 first. Count every print that runs, including the ones inside functions."], "correct": 3, "why": "The line `z = f(2, 3)` runs the function body with a = 2 and b = 3, and `print(a * b)` writes 6 to the console. The function has no `return` statement, so when its body ends it hands back None, and that None is stored in `z`. The last line then prints None, which gives `6` and `None` on two lines. The rule: `print` only shows a value on the screen, while `return` is what gives a value back to the caller. Exam tip: whenever a function result is stored in a variable, check whether the function contains a `return` at all.", "code": "def f(a, b):\n    print(a * b)\n\nz = f(2, 3)\nprint(z)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(a, b):", "fn": null, "t":  2", "TypeError", "8 8"], "reasons": ["You read `**` as multiplication, 2 * 3 = 6. In Python `**` is exponentiation, so `2 ** 3` is 8. The second value hides the mistake because 2 ** 1 and 2 * 1 are both 2.", null, "You thought f always needs two arguments. The parameter `y=3` has a default, so `f(2)` with one argument is allowed. A TypeError would appear only if a parameter without a default were missing.", "You kept the default 3 in the second call. When the caller passes a value, as in `f(2, 1)`, that value replaces the default. So y is 1 in the second call and the result is 2."], "correct": 2, "why": "In `f(2)` only x is given, so y takes its default value 3 and the function returns `2 ** 3 = 8`. In `f(2, 1)` the second argument 1 replaces the default, so the function returns `2 ** 1 = 2`. `print` with two values separates them with a space, which gives `8 2`. The rule: a default value is used only when the caller leaves that argument out. Exam tip: `**` means power in Python, `*` means multiplication.", "code": "def f(x, y=3):\n    return x ** y\n\nprint(f(2), f(2, 1))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(x, y=3):", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f(x=2, y=3)"}, {"k": "line", "n": 2, "src": "return x ** y", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 8"}, {"k": "call", "t": "call f(x=2, y=1)"}, {"k": "line", "n": 2, "src": "return x ** y", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 2"}, {"k": "line", "n": 4, "src": "print(f(2), f(2, 1))", "fn": null, "t": "prints 8 2"}], "more": 0}}, {"n": 184, "section": "Functions", "options": ["2", "0.5", "0", "2.0"], "reasons": ["Two things are off: the order is swapped, and `/` always returns a float in Python 3. The call gives 2 / 4, and even 4 / 2 would print 2.0. Only `//` gives a whole number.", null, "You treated `/` as integer division. In Python 3 `/` is true division and gives 0.5 for 2 / 4. Only `2 // 4` would give 0.", "You computed 4 / 2, which assumes x goes into a. The call is `f(y, x)`, so a receives y = 2 and b receives x = 4. Rewrite the call with values, `f(2, 4)`, before calculating."], "correct": 2, "why": "The call is `f(y, x)`, so the first value passed is y = 2 and the second is x = 4. Inside the function this gives a = 2 and b = 4, and `a / b` is `2 / 4 = 0.5`. Python matches arguments to parameters by position only; the names of the variables used in the call play no role. Exam tip: this is the same trap as `division(y, x)` in the 2025 quiz, so replace the names in the call with their values, here `f(2, 4)`, before you calculate.", "code": "def f(a, b):\n    return a / b\n\nx = 4\ny = 2\nprint(f(y, x))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(a, b):", "fn": null, "t": "defines function f()"}, {"k": "line", "n": 4, "src": "x = 4", "fn": null, "t": "x = 4"}, {"k": "line", "n": 5, "src": "y = 2", "fn": null, "t": "y = 2"}, {"k": "call", "t": "call f(a=2, b=4)"}, {"k": "line", "n": 2, "src": "return a / b", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 0.5"}, {"k": "line", "n": 6, "src": "print(f(y, x))", "fn": null, "t": "prints 0.5"}], "more": 0}}, {"n": 185, "section": "Functions", "options": ["pos", "neg", "None", "(nothing is printed)"], "reasons": ["You did not check the condition with the actual value. -2 > 0 is False, so the return inside the if never runs. Only positive numbers produce pos.", "The code contains no line that returns neg. You may have pictured a typical else branch with that text. Only choose outputs that the code can actually produce.", null, "You assumed a missing return makes the print stay silent. `print(f(-2))` still runs and prints the value None. Nothing is printed only when no print call executes at all."], "correct": 3, "why": "With n = -2 the condition `n > 0` is False, so the line `return \"pos\"` is skipped. Nothing comes after the if, so the function reaches its end without running any `return`, and Python gives back None automatically. `print(f(-2))` therefore prints None. The rule: every path through a function that does not hit a `return` ends with None. Exam tip: for a function with an if but no else, test the input that takes the missing path.", "code": "def f(n):\n    if n > 0:\n        return \"pos\"\n\nprint(f(-2))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(n):", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f(n=-2)"}, {"k": "line", "n": 2, "src": "if n > 0:", "fn": "f", "t": "condition is False"}, {"k": "ret", "t": "f returns None"}, {"k": "line", "n": 5, "src": "print(f(-2))", "fn": null, "t": "prints None"}], "more": 0}}, {"n": 186, "section": "Functions", "options": ["[0]", "[1, 0]", "[1]", "None"], "reasons": ["`append` adds an element at the end and keeps the existing ones. The list starts as [1] and becomes [1, 0]. Only an assignment like `a = [0]` would replace the contents.", null, "You assumed the function works on a copy of the list. Passing a list hands over the same object, so `L.append(0)` changes `a` too. To protect a you would have to pass `a.copy()`.", "You may have mixed up a and the return value of f. `a` still refers to the list; only the expression `f(a)` evaluates to None, and that value is ignored. `print(a)` shows the list."], "correct": 2, "why": "When `f(a)` is called, the parameter L refers to the very same list object as `a`; Python does not make a copy. `L.append(0)` changes that shared list in place, so after the call `a` is `[1, 0]`. The function returns None, but that result is not used anywhere. The rule: methods such as `append`, `remove` or an index assignment change the caller's list, while assigning a new value to the parameter name would not. Exam tip: ask whether the function changes the object itself or only its local name.", "code": "def f(L):\n    L.append(0)\n\na = [1]\nf(a)\nprint(a)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(L):", "fn": null, "t": "defines function f()"}, {"k": "line", "n": 4, "src": "a = [1]", "fn": null, "t": "a = [1]"}, {"k": "call", "t": "call f(L=[1])"}, {"k": "line", "n": 2, "src": "L.append(0)", "fn": "f", "t": "L = [1, 0]"}, {"k": "ret", "t": "f returns None"}, {"k": "line", "n": 5, "src": "f(a)", "fn": null, "t": "a = [1, 0]"}, {"k": "line", "n": 6, "src": "print(a)", "fn": null, "t": "prints [1, 0]"}], "more": 0}}, {"n": 187, "section": "Functions", "options": ["None", "[0]", "[1]", "[1, 0]"], "reasons": ["a is never assigned the result of f; it is only passed in as an argument. `print(a)` shows the unchanged list [1]. None would appear for `print(f(a))`.", "You thought assigning to L replaces the caller's list. `L = [0]` only makes the local name L point to a new list. The global `a` keeps pointing to [1].", null, "This would be the result of `L.append(0)`. The code uses `L = [0]`, which is an assignment and adds nothing to the list of a. Compare these two kinds of lines carefully."], "correct": 3, "why": "At the start of the call, L and `a` point to the same list `[1]`. The line `L = [0]` then creates a brand new list and moves only the local name L to it. The list that `a` refers to is never touched. After the call, `a` is still `[1]`. The rule: assigning to a parameter name rebinds it locally, while calling a method like `append` on it changes the shared object. Exam tip: an `=` with the parameter name on the left side never affects the caller.", "code": "def f(L):\n    L = [0]\n\na = [1]\nf(a)\nprint(a)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(L):", "fn": null, "t": "defines function f()"}, {"k": "line", "n": 4, "src": "a = [1]", "fn": null, "t": "a = [1]"}, {"k": "call", "t": "call f(L=[1])"}, {"k": "line", "n": 2, "src": "L = [0]", "fn": "f", "t": "L = [0]"}, {"k": "ret", "t": "f returns None"}, {"k": "line", "n": 5, "src": "f(a)", "fn": null, "t": ""}, {"k": "line", "n": 6, "src": "print(a)", "fn": null, "t": "prints [1]"}], "more": 0}}, {"n": 188, "section": "Functions", "options": ["UnboundLocalError", "10 10", "20 20", "20 10"], "reasons": ["That error happens when a local name is read before it is assigned, for example `x = x + 1` inside the function. Here `x = 20` comes first and `return x` comes after, so it works. Check the order of reading and assigning.", "You thought f returns the global x. Inside f, `x = 20` runs before `return x`, so the local value 20 is returned. Only the second printed value comes from the global x.", "You assumed the assignment inside f changes the global x. Without `global x`, the line `x = 20` creates a separate local x. The global x stays 10.", null], "correct": 4, "why": "Calling `f()` runs `x = 20` inside the function, which creates a new local variable named x. The function returns this local value 20. The global x was set to 10 and the function never changes it, so `print(f(), x)` prints `20 10`. The rule: assigning to a name inside a function makes it a local variable of that function, unless you declare it with `global`. Exam tip: inside a function, the same name can refer to a different variable than outside.", "code": "x = 10\n\ndef f():\n    x = 20\n    return x\n\nprint(f(), x)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 3, "src": "def f():", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f()"}, {"k": "line", "n": 4, "src": "x = 20", "fn": "f", "t": "x = 20"}, {"k": "line", "n": 5, "src": "return x", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 20"}, {"k": "line", "n": 7, "src": "print(f(), x)", "fn": null, "t": "prints 20 10"}], "more": 0}}, {"n": 189, "section": "Functions", "options": ["1", "1; 2", "2", "(1, 2)"], "reasons": [null, "A return neither prints anything nor lets the function continue. The first return ends the call with 1, and only the outer print shows it. There is one line of output.", "You thought the last return wins, the way the last assignment wins for a variable. A return ends the function immediately, so `return 2` never runs. Read the function from the top and stop at the first return reached.", "A function returns a tuple when one return statement lists several values, like `return 1, 2`. Here there are two separate return statements and only the first runs. The result is the single value 1."], "correct": 1, "why": "The first statement in f is `return 1`. As soon as a return runs, the function stops and hands back that value, so the line `return 2` is never reached. `print(f())` prints 1. The rule: a function returns once per call, and code after an executed return does not run. Exam tip: when you see two returns one after the other, only the first one counts.", "code": "def f():\n    return 1\n    return 2\n\nprint(f())", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f():", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f()"}, {"k": "line", "n": 2, "src": "return 1", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 1"}, {"k": "line", "n": 5, "src": "print(f())", "fn": null, "t": "prints 1"}], "more": 0}}, {"n": 190, "section": "Functions", "options": ["7", "21", "30", "TypeError"], "reasons": ["You used both defaults: 1 + 2 * 3 = 7. The keyword argument `c=10` replaces the default for c. Only b keeps its default value.", null, "You calculated from left to right: (1 + 2) * 10. Python applies multiplication before addition, so it is 1 + (2 * 10). Use the same precedence as in mathematics.", "Mixing positional and keyword arguments is allowed as long as the positional ones come first, and `f(1, c=10)` follows that rule. A TypeError would come from leaving out a or from giving one parameter two values. Here every parameter gets exactly one value."], "correct": 2, "why": "In `f(1, c=10)` the value 1 goes into a by position, c is set to 10 by keyword, and b keeps its default 2. The expression `a + b * c` becomes `1 + 2 * 10`. Multiplication comes first, so this is `1 + 20 = 21`. The rule: positional arguments fill parameters left to right, keyword arguments fill the parameter with that name, and the remaining ones take their defaults. Exam tip: write a, b and c with their values in a row before you evaluate the expression.", "code": "def f(a, b=2, c=3):\n    return a + b * c\n\nprint(f(1, c=10))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(a, b=2, c=3):", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f(a=1, b=2, c=10)"}, {"k": "line", "n": 2, "src": "return a + b * c", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 21"}, {"k": "line", "n": 4, "src": "print(f(1, c=10))", "fn": null, "t": "prints 21"}], "more": 0}}, {"n": 191, "section": "Functions", "options": ["8", "4", "7", "6"], "reasons": [null, "You stopped after f. The value 4 goes back into g, where it is still multiplied by 2. Follow each return value until it reaches print.", "You doubled first and then added 1: 3 * 2 + 1. In `f(x) * 2` the call f(x) is evaluated first, giving 4, and only then comes `* 2`. Treat a function call like a bracket.", "You skipped f and only doubled 3. g does not double x directly; it doubles `f(x)`, which is 4. Look at exactly what g multiplies."], "correct": 1, "why": "`g(3)` starts with x = 3 and must first evaluate `f(x)`, which is `f(3)` and returns `3 + 1 = 4`. g then computes `4 * 2 = 8` and returns it, and print shows 8. The x inside f and the x inside g are two separate local variables that both happen to hold 3. The rule: when one function calls another, the inner call finishes completely and its return value is used in the outer expression. Exam tip: evaluate the innermost call first and write its value in its place.", "code": "def f(x):\n    return x + 1\n\ndef g(x):\n    return f(x) * 2\n\nprint(g(3))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(x):", "fn": null, "t": "defines function f()"}, {"k": "line", "n": 4, "src": "def g(x):", "fn": null, "t": "defines function g()"}, {"k": "call", "t": "call g(x=3)"}, {"k": "call", "t": "call f(x=3)"}, {"k": "line", "n": , "reasons": ["You forgot that calling f runs its body. The `print(\"hi\")` inside f executes while the expression is being evaluated. So hi appears before True.", null, "The outer print also runs and shows the result of the comparison. After f prints hi, `print(True)` adds a second line. Count both print calls.", "You assumed f returns something. With no return statement f returns None, and `None is None` is True. A function returns a value other than None only through return."], "correct": 2, "why": "To evaluate `f() is None`, Python first calls f, which prints hi. f has no return, so the call results in None. `None is None` is True, and the outer print shows True on the second line. The rule: a function without return always produces None, and anything it prints appears during the call. Exam tip: write down the output of the inner call first, then the output of the outer print.", "code": "def f():\n    print(\"hi\")\n\nprint(f() is None)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f():", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f()"}, {"k": "line", "n": 2, "src": "print(\"hi\")", "fn": "f", "t": "prints hi"}, {"k": "ret", "t": "f returns None"}, {"k": "line", "n": 4, "src": "print(f() is None)", "fn": null, "t": "prints True"}], "more": 0}}, {"n": 195, "section": "Functions", "options": ["3", "TypeError", "4", "6"], "reasons": [null, "`*args` exists exactly to accept any number of positional arguments, so three are fine. A TypeError would appear if f had fixed parameters and received too many. The star makes the difference.", "You counted the elements inside the list separately. [2, 3] is passed as one argument, so it is one element of the tuple. Count only the commas that separate arguments in the call.", "You counted the items or characters inside the arguments. `len(args)` only counts how many arguments were passed. There are three."], "correct": 1, "why": "`*args` collects all positional arguments of the call into one tup nd leave the original untouched. Exam tip: s changes only if you write `s = s.upper()` or `s = f(s)`.", "code": "def f(s):\n    return s.upper()\n\ns = \"hi\"\nt = f(s)\nprint(s, t)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(s):", "fn": null, "t": "defines function f()"}, {"k": "line", "n": 4, "src": "s = \"hi\"", "fn": null, "t": "s = 'hi'"}, {"k": "call", "t": "call f(s='hi')"}, {"k": "line", "n": 2, "src": "return s.upper()", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 'HI'"}, {"k": "line", "n": 5, "src": "t = f(s)", "fn": null, "t": "t = 'HI'"}, {"k": "line", "n": 6, "src": "print(s, t)", "fn": null, "t": "prints hi HI"}], "more": 0}}, {"n": 198, "section": "Functions", "options": ["0; 1; 20", "20", "0; 1; None", "0; 1; 2; 20"], "reasons": [null, "You forgot the prints inside the loop. The line `r = show(2)` runs the function body, and `print(i)` executes twice. Those lines appear before 20.", "You assumed a function that prints cannot also return. This one ends with `return n * 10`, so r is 20. None appears only when no return runs.", "You let range(2) include 2. `range(2)` gives only 0 and 1. The loop prints two lines."], "correct": 1, "why": "The call `show(2)` runs the loop for i = 0 and i = 1 and prints each value, so 0 and 1 appear first. After the loop, `return n * 10` hands back 20, which is stored in r. The last line prints 20. The rule: a function can both print and return; the prints happen during the call, and the return value is what the caller receives. Exam tip: list the printed lines in the order they happen, and remember the call line itself can produce output.", "code": "def show(n):\n    for i in range(n):\n        print(i)\n    return n * 10\n\nr = show(2)\nprint(r)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def show(n):", "fn": null, "t": "defines function show()"}, {"k": "call", "t": "call show(n=2)"}, {"k": "line", "n": 2, "src": "for i in range(n):", "fn": "show", "t": "i = 0"}, {"k": "line", "n": 3, "src": " ale(x):\n    return x * rate\n\nprint(scale(5))\nrate = 10\nprint(scale(5))", "trace": {"steps": [{"k": "line", "n": 1, "src": "rate = 2", "fn": null, "t": "rate = 2"}, {"k": "line", "n": 3, "src": "def scale(x):", "fn": null, "t": "defines function scale()"}, {"k": "call", "t": "call scale(x=5)"}, {"k": "line", "n": 4, "src": "return x * rate", "fn": "scale", "t": ""}, {"k": "ret", "t": "scale returns 10"}, {"k": "line", "n": 6, "src": "print(scale(5))", "fn": null, "t": "prints 10"}, {"k": "line", "n": 7, "src": "rate = 10", "fn": null, "t": "rate = 10"}, {"k": "call", "t": "call scale(x=5)"}, {"k": "line", "n": 4, "src": "return x * rate", "fn": "scale", "t": ""}, {"k": "ret", "t": "scale returns 50"}, {"k": "line", "n": 8, "src": "print(scale(5))", "fn": null, "t": "prints 50"}], "more": 0}}, {"n": 202, "section": "Functions", "options": ["UnboundLocalError", "NameError", "1", "0"], "reasons": [null, "You are close: UnboundLocalError is a special kind of NameError. Python reports the more specific name because count exists as a local name that has no value yet. The console shows UnboundLocalError.", "You expected the function to read the global count and then create a local one. Python decides that count is local for the whole body because it is assigned there. Reading it first then fails.", "You assumed the global value is returned unchanged. The function never reaches its return, because the line `count = count + 1` already fails. Nothing gets returned."], "correct": 1, "why": "Because bump contains the assignment `count = ...`, Python treats `count` as a local variable for the entire function body. On that line, the right side `count + 1` tries to read the local count before it has received any value. Python stops with UnboundLocalError, and nothing is printed. The rule: assigning to a name anywhere in a function makes it local everywhere in that function, unless you write `global count`. Exam tip: `x = x + 1` inside a function, with x only defined outside, is the classic way to get this error.", "code": "count = 0\n\ndef bump():\n    count = count + 1\n    return count\n\nprint(bump())", "trace": {"steps": [{"k": "line", "n": 1, "src": "count = 0", "fn": null, "t": "count = 0"}, {"k": "line", "n": 3, "src": "def bump():", "fn": null, "t": "defines function bump()"}, {"k": "call", "t": "call bump()"}, {"k": "line", "n": 4, "src": "count = count + 1", "fn": "bump", "t": "raises UnboundLocalError"}, {"k": "ret", "t": "bump returns None"}, {"k": "line", "n": 7, "src": "print(bump())", "fn": null, "t": ""}], "more": 0}}, {"n": 203, "section": "Functions", "options": ["A; A; None", "A; B; None", "A; B; C", "A; B"], "reasons": ["You stopped at the first condition that looks right. 80 >= 90 is False, so the first return does not run. The elif then returns B.", null, "There is no line that returns C. With 60 no return runs at all, and the function gives None. Only outputs written in the code can appear.", "You assumed nothing is printed for 60. print still runs in the third round and shows the returned value. That value is None."], "correct": 2, "why": "For 95, `p >= 90` is True and the function returns A. For 80, the first test is False and `p >= 75` is True, so it returns B. For 60, both tests are False; there is no else, so the function reaches its end and returns None, which print shows. The rule: an if/elif chain without else can let some inputs fall through to the implicit None. Exam tip: for every input, check that some return is actually reached.", "code": "def grade(p):\n    if p >= 90:\n        return \"A\"\n    elif p >= 75:\n        return \"B\"\n\nfor p in [95, 80, 60]:\n    print(grade(p))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def grade(p):", "fn": null, "t": "defines function grade()"}, {"k": "line", "n": 7, "src": "for p in [95, 80, 60]:", "fn": null, "t": "p = 95"}, {"k": "call", "t": "call grade(p=95)"}, {"k": "line", "n": 2, "src": "if p >= 90:", "fn": "grade", "t": "condition is True"}, {"k": " ed to print, so 13 is the last line. The rule: the arguments of print are evaluated completely before print writes anything, and calls inside an expression run left to right. Exam tip: output from inner calls always appears before the outer print.", "code": "def square(x):\n    print(\"sq\", x)\n    return x * x\n\nprint(square(3) + square(2))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def square(x):", "fn": null, "t": "defines function square()"}, {"k": "call", "t": "call square(x=3)"}, {"k": "line", "n": 2, "src": "print(\"sq\", x)", "fn": "square", "t": "prints sq 3"}, {"k": "line", "n": 3, "src": "return x * x", "fn": "square", "t": ""}, {"k": "ret", "t": "square returns 9"}, {"k": "call", "t": "call square(x=2)"}, {"k": "line", "n": 2, "src": "print(\"sq\", x)", "fn": "square", "t": "prints sq 2"}, {"k": "line", "n": 3, "src": "return x * x", "fn": "square", "t": ""}, {"k": "ret", "t": "square returns 4"}, {"k": "line", "n": 5, "src": "print(square(3) + square(2))", "fn": null, "t": "prints 13"}], "more": 0}}, {"n": 205, "section": "Functions", "options": ["9 1", "1 9", "(9, 1)", "ValueError"], "reasons": [null, "You trusted the names lo, hi and min_max. The return line gives max first and min second, so lo is 9. Unpacking only follows positions.", "The tuple is unpacked into two variables, and print receives two separate numbers. Brackets would appear only if the tuple itself were printed. Here print shows 9 and 1 separated by a space.", "Unpacking fails only when the number of values and variables differ. The function returns two values and there are two names, lo and hi. It fits exactly."], "correct": 1, "why": "Despite its name, min_max returns `max(nums), min(nums)`, which is the tuple `(9, 1)`. Unpacking assigns by position: the first value 9 goes into lo and the second value 1 goes into hi. `print(lo, hi)` shows `9 1`. The rule: unpacking follows the order of the returned tuple, and variable or function names have no effect. Exam tip: trust the eeting, and `name=\"Lu\"` sets name to Lu. Round 1 returns `\"Ana\" + \" \" + \"Lu\"`, which is `Ana Lu`. Round 2 returns `Ben Lu`. The default \"Hi\" is never used because greeting is passed every time. The rule: keyword arguments go to the parameter with the same name, whatever order they are written in. Exam tip: check which parameter the loop variable is attached to.", "code": "def greet(name, greeting=\"Hi\"):\n    return greeting + \" \" + name\n\nfor n in [\"Ana\", \"Ben\"]:\n    print(greet(greeting=n, name=\"Lu\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def greet(name, greeting=\"Hi\"):", "fn": null, "t": "defines function greet()"}, {"k": "line", "n": 4, "src": "for n in [\"Ana\", \"Ben\"]:", "fn": null, "t": "n = 'Ana'"}, {"k": "call", "t": "call greet(name='Lu', greeting='Ana')"}, {"k": "line", "n": 2, "src": "return greeting + \" \" + name", "fn": "greet", "t": ""}, {"k": "ret", "t": "greet returns 'Ana Lu'"}, {"k": "line", "n": 5, "src": "print(greet(greeting=n, name=\"Lu\"))", "fn": null, "t": "prints Ana Lu"}, {"k": "line", "n": 4, "src": "for n in [\"Ana\", \"Ben\"]:", "fn": null, "t": "n = 'Ben'"}, {"k": "call", "t": "call greet(name='Lu', greeting='Ben')"}, {"k": "line", "n": 2, "src": "return greeting + \" \" + name", "fn": "greet", "t": ""}, {"k": "ret", "t": "greet returns 'Ben Lu'"}, {"k": "line", "n": 5, "src": "print(greet(greeting=n, name=\"Lu\"))", "fn": null, "t": "prints Ben Lu"}, {"k": "line", "n": 4, "src": "for n in [\"Ana\", \"Ben\"]:", "fn": null, "t": "no items left, loop ends"}], "more": 0}}, {"n": 208, "section": "Functions", "options": ["[1, 3, 4] [1, 3, 4]", "[1] [1, 3, 4]", "[1, 3] None", "[1, 3] [1, 3, 4]"], "reasons": ["You treated `L = L + [4]` like an append. The `+` creates a new list, and the assignment only rebinds L. a keeps [1, 3].", "You assumed the append also happens on a copy. At the time of `L.append(3)`, L is still the same list as a. So a becomes [1, 3].", "The function ends with `return L`, so it gives back the new list. b is [1, 3, 4]. None would only appear without a return.", null], "correct": 4, "why": "When add starts, L and a point to the same list [1]. `L.append(3)` changes that shared list, so a is now [1, 3]. `L = L + [4]` builds a new list [1, 3, 4] and moves only the local name L to it, so a is not affected. The function returns the new list, so b is [1, 3, 4], and print shows `[1, 3] [1, 3, 4]`. The rule: methods like append change the caller's object, while `L = ...` creates a local rebinding. Exam tip: find the line where the parameter is rebound; changes after that line no longer reach the caller.", "code": "def add(L):\n    L.append(3)\n    L = L + [4]\n    return L\n\na = [1]\nb = add(a)\nprint(a, b)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def add(L):", "fn": null, "t": "defines function add()"}, {"k": "line", "n": 6, "src": "a = [1]", "fn": null, "t": "a = [1]"}, {"k": "call", "t": "call add(L=[1])"}, {"k": "line", "n": 2, "src": "L.append(3)", "fn": "add", "t": "L = [1, 3]"}, {"k": "line", "n": 3, "src": "L = L + [4]", "fn": "add", "t": "L = [1, 3, 4]"}, {"k": "line", "n": 4, "src": "return L", "fn": "add", "t": ""}, {"k": "ret", "t": "add returns [1, 3, 4]"}, {"k": "line", "n": 7, "src": "b = add(a)", "fn": null, "t": "a = [1, 3]; b = [1, 3, 4]"}, {"k": "line", "n": 8, "src": "print(a, b)", "fn": null, "t": "prints [1, 3] [1, 3, 4]"}], "more": 0}}, {"n": 209, "section": "Functions", "options": ["8", "None", "8; 8", "8; None"], "reasons": ["The last line `print(result)` also prints. result holds None, so a second line appears. Count every print that runs.", "You skipped the print inside double. The call `apply(4)` runs double, which prints 8 first. Then `print(result)` adds None.", "You expected double to return what it prints. It has no return, so y is None. apply passes that None on.", null], "correct": 4, "why": "`apply(4)` calls `double(4)`, which prints 8 and, having no return, gives back None. So y inside apply is None, and apply returns that None, which is stored in result. The last line prints None. The rule: None passes along a chain of calls just like any other value. Exam tip: when one function returns the result of another, check whether that inner function has a return.", "code": "def double(x):\n    print(x * 2)\n\ndef apply(x):\n    y = double(x)\n    return y\n\nresult = apply(4)\nprint(result)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def double(x):", "fn": null, "t": "defines function double()"}, {"k": "line", "n": 4, "src": "def apply(x):", "fn": null, "t": "defines function apply()"}, {"k": "call", "t": "call apply(x=4)"}, {"k": "call", "t": "call double(x=4)"}, {"k": "line", "n": 2, "src": "print(x * 2)", "fn": "double", "t": "prints 8"}, {"k": "ret", "t": "double returns None"}, {"k": "line", "n": 5, "src": "y = double(x)", "fn": "apply", "t": "y = None"}, {"k": "line", "n": 6, "src": "return y", "fn": "apply", "t": ""}, {"k": "ret", "t": "apply returns None"}, {"k": "line", "n": 8, "src": "result = apply(4)", "fn": null, "t": "result = None"}, {"k": "line", "n": 9, "src": "print(result)", "fn": null, "t": "prints None"}], "more": 0}}, {"n": 210, "section": "Errors", "options": ["42", "2", "ValueError", "TypeError"], "reasons": ["You may think `len()` simply returns a number when given one. `len()` only works on containers and counts their items. Think about which types have a length.", "You counted the digits of 42. That works for the string \"42\", but here 42 has no quotes, so it is an int. Ask whether an int is a container with items.", "A ValueError means the type is fine but the specific value is not, like `int(\"abc\")`. Here no int at all works with `len()`, whatever its value. So the problem lies in the type.", null], "correct": 4, "why": "`len()` counts how many items a container holds: characters in a string, elements in a list, keys in a dict. 42 is an int, which is a single number and holds no items, so the int type does not support `len()` at all. Python raises a TypeError (\"object of type 'int' has no len()\"). The rule: when an operation is not supported by the type of an object, the error is a TypeError. Exam tip: `len(\"42\")` with quotes would give 2, so always check for quotes.", "code": "print(len(42))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(len(42))", "fn": null, "t": "raises TypeError"}], "more": 0}}, {"n": 211, "section": "Errors", "options": ["IndexError", "2", "None", "KeyError"], "reasons": [null, "You counted from 1, so you took index 2 as the second element. Python counts from 0, so the value 2 sits at index 1. Count the positions of `[1, 2]` starting at 0.", "Python never returns None for a position that does not exist. Accessing a missing position is an error. Count how many positions L really has.", "KeyError belongs to dictionaries, where you look up a key. L is a list (square brackets on line 1), and lists are accessed by position. Think of the error name for a position that is too large."], "correct": 1, "why": "L has 2 elements. Counting from 0, the valid indices are 0 (value 1) and 1 (value 2). `L[2]` asks for a third element, which does not exist, so Python raises an IndexError (\"list index out of range\"). The rule: for a list of length n the valid indices are 0 to n - 1, or -1 to -n from the end. Exam tip: the last valid index is always `len(L) - 1`.", "code": "L = [1, 2]\nprint(L[2])", "trace": {"steps": [{"k": "line", "n": 1, "src": "L = [1, 2]", "fn": null, "t": "L = [1, 2]"}, {"k": "line", "n": 2, "src": "print(L[2])", "fn": null, "t": "raises IndexError"}], "more": 0}}, {"n": 212, "section": "Errors", "options": ["KeyError", "NameError", "1", "None"], "reasons": [null, "A NameError means a variable name does not exist. Here d is defined on line 1, so the name is fine. The problem is the lookup inside the dict.", "You treated \"A\" and \"a\" as the same key. Dictionary keys are matched exactly, including upper and lower case. Compare the key in line 1 with the one in line 2.", "You are thinking of `d.get(\"A\")`, which does return None for a missing key. Square brackets behave differently: a missing key is an error. Look at how line 2 accesses the dict."], "correct": 1, "why": "The dict has one key, the lowercase string \"a\". Line 2 looks up the uppercase \"A\". Strings are compared character by character, and \"A\" and \"a\" are different characters, so the key is not found and Python raises a KeyError. The rule: `d[key]` raises a KeyError when the key is missing, and string keys are case-sensitive. Exam tip: if you want a default instead of an error, use `d.get(key)`, which returns None for a missing key.", "code": "d = {\"a\": 1}\nprint(d[\"A\"])", "trace": {"steps": [{"k": "line", "n": 1, "src": "d = {\"a\": 1}", "fn": null, "t": "d = {'a': 1}"}, {"k": "line", "n": 2, "src": "print(d[\"A\"])", "fn": null, "t": "raises KeyError"}], "more": 0}}, {"n": 213, "section": "Errors", "options": ["4", "ValueError", "4.5", "TypeError"], "reasons": ["You assumed `int()` cuts off the decimals. It does that for the float `int(4.5)`, but here 4.5 is in quotes, so it is a string. When reading a string, `int()` only accepts whole numbers.", null, "`int()` always gives an int, so it can never produce 4.5. Either it returns a whole number or it raises an error. Look at what the string contains.", "`int()` does accept strings like \"7\", so the type str is allowed. The problem is that this particular text is not a whole number. Think about which error describes a bad value of an accepted type."], "correct": 2, "why": "`int()` can convert a string only if the string looks like a whole number, for example \"4\" or \"-12\". \"4.5\" contains a decimal point, so `int()` cannot read it and raises a ValueError (\"invalid literal for int() with base 10\"). The rule: TypeError means the type is wrong, ValueError means the type is accepted but this particular value is not. `int()` does accept strings, so a bad string gives ValueError. Exam tip: `int(4.5)` (a float) gives 4, and `int(float(\"4.5\"))` also gives 4, but `int(\"4.5\")` fails.", "code": "print(int(\"4.5\"))", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(int(\"4.5\"))", "fn": null, "t": "raises ValueError"}], "more": 0}}, {"n": 214, "section": "Errors", "options": ["5", "AttributeError", "NameError", "TypeError"], "reasons": ["You expected `upper()` to leave a number unchanged. An int has no `upper` method at all, so Python cannot run it. Check which type provides `upper()`.", null, "x is defined on line 1, so the variable name is fine. The lookup that fails is the part after the dot. Think about which error is raised when an object lacks a method.", "This is a common mix-up. A TypeError is raised when an operation gets the wrong type, like `1 + \"a\"`. Asking for a method that does not exist after a dot has its own error name."], "correct": 2, "why": "x is the int 5. `.upper()` is a method that only strings have. When you write `x.upper`, Python looks for an attribute called `upper` on the int object, does not find one, and raises an AttributeError (\"'int' object has no attribute 'upper'\"). The rule: calling a method that the object's type does not have gives an AttributeError. Exam tip: the dot after a value is the hint; if that type has no such method, the answer is AttributeError.", "code": "x = 5\nprint(x.upper())", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 5", "fn": null, "t": "x = 5"}, {"k": "line", "n": 2, "src": "print(x.upper())", "fn": null, "t": "raises AttributeError"}], "more": 0}}, {"n": 215, "section": "Errors", "options": ["start; ZeroDivisionError", "ZeroDivisionError", "start; 0", "start; inf"], "reasons": [null, "You let the error cancel everything. Python does not check the whole file before running it; it executes line 1 first. So the print on line 1 has already happened when line 2 fails.", "You treated division by zero as giving 0. In Python this is not allowed at all and raises an error. Think about which error name describes dividing by zero.", "Some tools return infinity for division by zero, but plain Python raises an error instead. Line 1 does print. Think about what happens on line 2."], "correct": 1, "why": "Python runs a program line by line. Line 1 works and prints `start` before anything goes wrong. Line 2 tries `10 / 0`, and division by zero is not allowed, so Python raises a ZeroDivisionError and stops. The rule: output from lines that ran before an error stays on the screen; the error only stops what comes after it. Exam tip: when you spot an error, also check which prints ran before that line.", "code": "print(\"start\")\nprint(10 / 0)", "trace": {"steps": [{"k": "line", "n": 1, "src": "print(\"start\")", "fn": null, "t": "prints start"}, {"k": "line", "n": 2, "src": "print(10 / 0)", "fn": null, "t": "raises ZeroDivisionError"}], "more": 0}}, {"n": 216, "section": "Errors", "options": ["ValueError", "abc1", "NameError", "1"], "reasons": ["A ValueError is raised, but the code catches exactly that type with `except ValueError`. A caught error does not stop the program. Follow what the except block does.", "You assumed x keeps \"abc\" and gets joined with 1. The conversion fails, so x never gets that value. Look at what the except block assigns to x.", "You may think x stays undefined because the try line failed. The except block assigns x a value, so x exists when line 5 runs. Check line 4.", null], "correct": 4, "why": "In the try block, `int(\"abc\")` fails because \"abc\" is not a number, which raises a ValueError. The assignment to x never finishes. Python jumps to the matching `except ValueError` block, which sets x to 0. The error is now handled, so the program continues after the try/except. Line 5 prints `0 + 1`, which is 1. The rule: if an error matches the except clause, the except block runs and the program continues normally afterwards. Exam tip: always check that the error type raised matches the type named in except.", "code": "try:\n    x = int(\"abc\")\nexcept ValueError:\n    x = 0\nprint(x + 1)", "trace": {"steps": [{"k": "line", "n": 1, "src": "try:", "fn": null, "t": ""}, {"k": "line", "n": 2, "src": "x = int(\"abc\")", "fn": null, "t": "raises ValueError"}, {"k": "line", "n": 3, "src": "except ValueError:", "fn": null, "t": ""}, {"k": "line", "n": 4, "src": "x = 0", "fn": null, "t": "x = 0"}, {"k": "line", "n": 5, "src": "print(x + 1)", "fn": null, "t": "prints 1"}], "more": 0}}, {"n": 217, "section": "Errors", "options": ["a; b; c", "a; ZeroDivisionError", "c", "a; c"], "reasons": ["You let the try block finish before jumping. Python leaves the try block at the exact line that fails. Find the failing line and ask whether the lines after it in the try still run.", "The error is raised, but the except clause names exactly ZeroDivisionError and handles it. A handled error does not appear in the output. Look at what the except block prints.", "You skipped the first line of the try. Code before the error runs normally. Check whether `print(\"a\")` comes before or after the division.", null], "correct": 4, "why": "The try block runs from the top. `print(\"a\")` works and prints a. `print(1 / 0)` raises a ZeroDivisionError before anything is printed on that line, and Python immediately leaves the try block, so `print(\"b\")` is skipped. The except clause matches ZeroDivisionError, so it prints c. The rule: inside a try, everything before the error runs, everything after it in the try is skipped, and execution continues in the matching except. Exam tip: the error is caught, so its name never appears in the output.", "code": "try:\n    print(\"a\")\n    print(1 / 0)\n    print(\"b\")\nexcept ZeroDivisionError:\n    print(\"c\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "try:", "fn": null, "t": ""}, {"k": "line", "n": 2, "src": "print(\"a\")", "fn": null, "t": "prints a"}, {"k": "line", "n": 3, "src": "print(1 / 0)", "fn": null, "t": "raises ZeroDivisionError"}, {"k": "line", "n": 5, "src": "except ZeroDivisionError:", "fn": null, "t": ""}, {"k": "line", "n": 6, "src": "print(\"c\")", "fn": null, "t": "prints c"}], "more": 0}}, {"n": 218, "section": "Errors", "options": ["checking 2; 5; checking 0; ZeroDivisionError", "checking 2; 5.0; checking 0; checking 5; 2.0", "checking 2; 5.0; checking 0; ZeroDivisionError", "checking 2; 5.0; ZeroDivisionError"], "reasons": ["The order is right, but look at the value of `10 / 2`. The `/` operator always returns a float in Python, even when the division comes out even. So the number is printed with a decimal point.", "You assumed the loop skips the failing round and continues. Without a try/except, an error stops the whole program. Check whether anything in this code catches the error.", null, "You let the error happen at the start of the call. The function runs line by line, and the print on line 2 comes before the division on line 3. So for n = 0 something is printed before it fails."], "correct": 3, "why": "Round 1, n = 2: inside the function `print(\"checking\", n)` shows `checking 2`, then it returns 10 / 2 = 5.0, which the outer print shows as `5.0`. Round 2, n = 0: the function first prints `checking 0`, then `10 / 0` raises a ZeroDivisionError. Nothing catches it, so the program stops. The outer print for this round never runs, and n = 5 is never reached. The rule: an error inside a function travels up to the caller; if no try/except catches it anywhere, the program stops, but everything printed before stays on screen. Exam tip: inside a call, the prints before the failing line still appear.", "code": "def check(n):\n    print(\"checking\", n)\n    return 10 / n\n\nfor n in [2, 0, 5]:\n    print(check(n))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def check(n):", "fn": null, "t": "defines function check()"}, {"k": "line", "n": 5, "src": "for n in [2, 0, 5]:", "fn": null, "t": "n = 2"}, {"k": "call", "t": "call check(n=2)"}, {"k": "line", "n": 2, "src": "print(\"checking\", n)", "fn": "check", "t": "prints checking 2"}, {"k": "line", "n": 3, "src": "return 10 / n", "fn": "check", "t": ""}, {"k": "ret", "t": "check returns 5.0"}, {"k": "line", "n": 6, "src": "print(check(n))", "fn": null, "t": "prints 5.0"}, {"k": "line", "n": 5, "src": "for n in [2, 0, 5]:", "fn": null, "t": "n = 0"}, {"k": "call", "t": "call check(n=0)"}, {"k": "line", "n": 2, "src": "print(\"checking\", n)", "fn": "check", "t": "prints checking 0"}, {"k": "line", "n": 3, "src": "return 10 / n", "fn": "check", "t": "raises ZeroDivisionError"}, {"k": "ret", "t": "check returns None"}, {"k": "line", "n": 6, "src": "print(check(n))", "fn": null, "t": ""}], "more": 0}}, {"n": 219, "section": "Errors", "options": ["zero; ok; done; -1; ok; done; 2", "zero; -1; ok; 2", "zero; done; -1; ok; done; 2", "zero; done; -1; ok; done; 2.0"], "reasons": ["You ran the else block in the first call as well. The else of a try only runs when the try finished without an error. In f(0) there was an error, so check which blocks really run.", "You left out the finally block. finally runs every time, whether or not there was an error. Add its print to both calls.", null, "The flow is right, but check the operator on line 3. `//` is floor division, and with two ints it gives an int. A float would only appear with `/`."], "correct": 3, "why": "First call, f(0): `10 // 0` raises a ZeroDivisionError, so the except block prints `zero` and sets r to -1. The else is skipped because an error happened. finally always runs and prints `done`. The function returns -1 and the outer print shows `-1`. Second call, f(5): `10 // 5` is 2 with no error, so except is skipped and else prints `ok`. finally prints `done`, and the outer print shows `2`. The rule: except runs only if there was an error, else runs only if there was no error, and finally runs in both cases. Exam tip: `//` is floor division and gives an int when both sides are ints, so 2 has no decimal point.", "code": "def f(x):\n    try:\n        r = 10 // x\n    except ZeroDivisionError:\n        print(\"zero\")\n        r = -1\n    else:\n        print(\"ok\")\n    finally:\n        print(\"done\")\n    return r\n\nprint(f(0))\nprint(f(5))", "trace": {"steps": [{"k": "line", "n": 1, "src": "def f(x):", "fn": null, "t": "defines function f()"}, {"k": "call", "t": "call f(x=0)"}, {"k": "line", "n": 2, "src": "try:", "fn": "f", "t": ""}, {"k": "line", "n": 3, "src": "r = 10 // x", "fn": "f", "t": "raises ZeroDivisionError"}, {"k": "line", "n": 4, "src": "except ZeroDivisionError:", "fn": "f", "t": ""}, {"k": "line", "n": 5, "src": "print(\"zero\")", "fn": "f", "t": "prints zero"}, {"k": "line", "n": 6, "src": "r = -1", "fn": "f", "t": "r = -1"}, {"k": "line", "n": 10, "src": "print(\"done\")", "fn": "f", "t": "prints done"}, {"k": "line", "n": 11, "src": "return r", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns -1"}, {"k": "line", "n": 13, "src": "print(f(0))", "fn": null, "t": "prints -1"}, {"k": "call", "t": "call f(x=5)"}, {"k": "line", "n": 2, "src": "try:", "fn": "f", "t": ""}, {"k": "line", "n": 3, "src": "r = 10 // x", "fn": "f", "t": "r = 2"}, {"k": "line", "n": 8, "src": "print(\"ok\")", "fn": "f", "t": "prints ok"}, {"k": "line", "n": 10, "src": "print(\"done\")", "fn": "f", "t": "prints done"}, {"k": "line", "n": 11, "src": "return r", "fn": "f", "t": ""}, {"k": "ret", "t": "f returns 2"}, {"k": "line", "n": 14, "src": "print(f(5))", "fn": null, "t": "prints 2"}], "more": 0}}, {"n": 220, "section": "Errors", "options": ["ValueError", "wrong type", "TypeError", "wrong type; end"], "reasons": [null, "You assumed any error goes into the except block. It only catches the type it names, here TypeError. Work out which error `int(\"seven\")` really raises: is the type wrong, or the value?", "You named the error from the except line. The except line does not decide which error happens; the failing code does. `int()` accepts strings, so think about which error a bad value of an accepted type gives.", "This would be right if the except caught the error. Check whether a bad string passed to `int()` is a TypeError or a ValueError. If the types do not match, the except is ignored."], "correct": 1, "why": "`int(\"seven\")` fails because \"seven\" is a word, not digits. The type str is accepted by `int()`, so the error is a ValueError, not a TypeError. The except clause only catches TypeError, so it does not match. The ValueError is not handled, the program stops, and even `print(\"end\")` after the try never runs. Nothing was printed before the error, so the output is only the error name. The rule: an except clause catches only the error type it names (and its subtypes); any other error passes through as if there were no try. Exam tip: first decide which error is raised, then compare it with the name after except.", "code": "try:\n    n = int(\"seven\")\n    print(n * 2)\nexcept TypeError:\n    print(\"wrong type\")\nprint(\"end\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "try:", "fn": null, "t": ""}, {"k": "line", "n": 2, "src": "n = int(\"seven\")", "fn": null, "t": "raises ValueError"}, {"k": "line", "n": 4, "src": "except TypeError:", "fn": null, "t": ""}], "more": 0}}, {"n": 221, "section": "Errors", "options": ["None; 0; KeyError", "0; 0; None; done", "0; 5; KeyError", "0; 0; KeyError"], "reasons": ["You ignored the second argument of the first `.get`. When a default is given, `.get` returns it for a missing key instead of None. Look at what is passed after \"kiwi\" on line 2.", "You treated `stock[\"kiwi\"]` like `.get`. Only `.get` returns a fallback for a missing key. Square brackets behave differently, so check what happens on line 4.", "You used the default 5 for \"pear\", maybe because its value 0 looks like nothing. The default is only used when the key is missing. Check whether \"pear\" is in the dict on line 1.", null], "correct": 4, "why": "Line 2: \"kiwi\" is not a key, so `.get` returns the default you gave, 0. Line 3: \"pear\" IS a key with value 0, so `.get` returns the stored 0 and ignores the default 5. Line 4: square brackets with a missing key raise a KeyError, so the program stops and `done` is never printed. The rule: `d.get(key, default)` returns the default only when the key is missing, while `d[key]` raises KeyError for a missing key. Exam tip: a stored value of 0 is still a real value; `.get` does not replace falsy values with the default.", "code": "stock = {\"apple\": 3, \"pear\": 0}\nprint(stock.get(\"kiwi\", 0))\nprint(stock.get(\"pear\", 5))\nprint(stock[\"kiwi\"])\nprint(\"done\")", "trace": {"steps": [{"k": "line", "n": 1, "src": "stock = {\"apple\": 3, \"pear\": 0}", "fn": null, "t": "stock = {'apple': 3, 'pear': 0}"}, {"k": "line", "n": 2, "src": "print(stock.get(\"kiwi\", 0))", "fn": null, "t": "prints 0"}, {"k": "line", "n": 3, "src": "print(stock.get(\"pear\", 5))", "fn": null, "t": "prints 0"}, {"k": "line", "n": 4, "src": "print(stock[\"kiwi\"])", "fn": null, "t": "raises KeyError"}], "more": 0}}, {"n": 222, "section": "Errors", "options": ["IndexError", "4; 12; 27; IndexError", "4; 12; 27", "4; 12; 27; 27"], "reasons": ["You let the error cancel the whole loop. The bad index only comes in the last round, and the earlier rounds run and print normally. Go through i = 0, 1, 2 first.", null, "Your running totals are right, but you stopped the loop at i = 2. Look at the `+ 1` in `range(len(nums) + 1)`: it adds one more round. Check whether that index exists in the list.", "You assumed the last round prints the old total. The error happens on the line `total += nums[i]`, which comes before the print. Once the error is raised, the rest of that round does not run."], "correct": 2, "why": "`len(nums)` is 3, so the loop is `range(4)`, giving i = 0, 1, 2, 3. i = 0: total = 0 + 4 = 4, printed. i = 1: total = 4 + 8 = 12, printed. i = 2: total = 12 + 15 = 27, printed. i = 3: `nums[3]` does not exist (the last index is 2), so an IndexError is raised before the print in that round, and the program stops. The rule: `range(len(L))` covers exactly the valid indices; adding 1 goes one step past the end. Exam tip: in loops, write down the last value of i and check it against `len(L) - 1`.", "code": "nums = [4, 8, 15]\ntotal = 0\nfor i in range(len(nums) + 1):\n    total += nums[i]\n    print(total)", "trace": {"steps": [{"k": "line", "n": 1, "src": "nums = [4, 8, 15]", "fn": null, "t": "nums = [4, 8, 15]"}, {"k": "line", "n": 2, "src": "total = 0", "fn": null, "t": "total = 0"}, {"k": "line", "n": 3, "src": "for i in range(len(nums) + 1):", "fn": null, "t": "i = 0"}, {"k": "line", "n": 4, "src": "total += nums[i]", "fn": null, "t": "total = 4"}, {"k": "line", "n": 5, "src": "print(total)", "fn": null, "t": "prints 4"}, {"k": "line", "n": 3, "src": "for i in range(len(nums) + 1):", "fn": null, "t": "i = 1"}, {"k": "line", "n": 4, "src": "total += nums[i]", "fn": null, "t": "total = 12"}, {"k": "line", "n": 5, "src": "print(total)", "fn": null, "t": "prints 12"}, {"k": "line", "n": 3, "src": "for i in range(len(nums) + 1):", "fn": null, "t": "i = 2"}, {"k": "line", "n": 4, "src": "total += nums[i]", "fn": null, "t": "total = 27"}, {"k": "line", "n": 5, "src": "print(total)", "fn": null, "t": "prints 27"}, {"k": "line", "n": 3, "src": "for i in range(len(nums) + 1):", "fn": null, "t": "i = 3"}, {"k": "line", "n": 4, "src": "total += nums[i]", "fn": null, "t": "raises IndexError"}], "more": 0}}, {"n": 223, "section": "Combined (harder)", "options": ["{'a': 2, 'b': 1, 'c': 1}", "{'a': 1, 'b': 1, 'c': 1, 'a': 1}", "KeyError", "{'a': 2, 'b': 1}"], "reasons": [null, "You assumed a repeated key creates a second entry. A dict holds each key once, and the second a updates the existing value to 2. The dict has three keys.", "You expected the missing key to cause an error. `get` returns the default 0 for a missing key and never raises. Only `counts[ch]` on a missing key would fail.", "You dropped c. Every character in \"abca\" goes through the loop, and c is new, so it gets the value 1. There are three keys."], "correct": 1, "why": "counts starts empty. For a, `counts.get(\"a\", 0)` returns 0 because the key is missing, so counts[\"a\"] becomes 1. For b and c the same happens, each starting at 1. For the second a, get returns the existing 1, so counts[\"a\"] becomes 2. Dictionaries keep insertion order, so print shows `{'a': 2, 'b': 1, 'c': 1}`. The rule: `d.get(key, 0)` returns the default when the key is missing, which makes it the standard counting pattern. Exam tip: keys are unique, so a repeated key updates the entry that already exists.", "code": "counts = {}\nfor ch in \"abca\":\n    counts[ch] = counts.get(ch, 0) + 1\nprint(counts)", "trace": {"steps": [{"k": "line", "n": 1, "src": "counts = {}", "fn": null, "t": "counts = {}"}, {"k": "line", "n": 2, "src": "for ch in \"abca\":", "fn": null, "t": "ch = 'a'"}, {"k": "line", "n": 3, "src": "counts[ch] = counts.get(ch, 0) + 1", "fn": null, "t": "counts = {'a': 1}"}, {"k": "line", "n": 2, "src": "for ch in \"abca\":", "fn": null, "t": "ch = 'b'"}, {"k": "line", "n": 3, "src": "counts[ch] = counts.get(ch, 0) + 1", "fn": null, "t": "counts = {'a': 1, 'b': 1}"}, {"k": "line", "n": 2, "src": "for ch in \"abca\":", "fn": null, "t": "ch = 'c'"}, {"k": "line", "n": 3, "src": "counts[ch] = counts.get(ch, 0) + 1", "fn": null, "t": "counts = {'a': 1, 'b': 1, 'c': 1}"}, {"k": "line", "n": 2, "src": "for ch in \"abca\":", "fn": null, "t": "ch = 'a'"}, {"k": "line", "n": 3, "src": "counts[ch] = counts.get(ch, 0) + 1", "fn": null, "t": "counts = {'a': 2, 'b': 1, 'c': 1}"}, {"k": "line", "n": 2, "src": "for ch in \"abca\":", "fn": null, "t": "no items left, loop ends"}, {"k": "line", "n": 4, "src": "print(counts)", "fn": null, "t": "prints {'a': 2, 'b': 1, 'c': 1}"}], "more": 0}}, {"n": 224, "section": "Combined (harder)", "options": ["5.0", "False", "None", "True"], "reasons": ["You printed the average itself. The expression inside print is `avg(grades) >= 5`, a comparison. Its result is a bool.", "You may have read the comparison as a strict greater than. `>=` includes equality, and 5.0 equals 5. So the result is True.", "avg contains `return sum(nums) / len(nums)`, so it returns 5.0. The comparison then gives a bool. None plays no role here.", null], "correct": 4, "why": "`sum(grades)` is 4 + 5 + 6 = 15 and `len(grades)` is 3, so avg returns `15 / 3 = 5.0`. The comparison `5.0 >= 5` is True, because an int and a float are compared by their value. print shows the result of the comparison, which is True. The rule: `/` always gives a float, and a float compares normally with an int. Exam tip: when print contains a comparison, the answer is True or False.", "code": "def avg(nums):\n    return sum(nums) / len(nums)\n\ngrades = [4, 5, 6]\nprint(avg(grades) >= 5)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def avg(nums):", "fn": null, "t": "defines function avg()"}, {"k": "line", "n": 4, "src": "grades = [4, 5, 6]", "fn": null, "t": "grades = [4, 5, 6]"}, {"k": "call", "t": "call avg(nums=[4, 5, 6])"}, {"k": "line", "n": 2, "src": "return sum(nums) / len(nums)", "fn": "avg", "t": ""}, {"k": "ret", "t": "avg returns 5.0"}, {"k": "line", "n": 5, "src": "print(avg(grades) >= 5)", "fn": null, "t": "prints True"}], "more": 0}}, {"n": 225, "section": "Combined (harder)", "options": ["2 b", "3 b", "2 a", "2 banana"], "reasons": [null, "You kept kiwi. kiwi has exactly 4 letters, and `4 > 4` is False. Only apple and banana pass.", "You took the first word. `long[-1]` is the last element, banana. Its first letter is b.", "You stopped after `long[-1]`. The extra `[0]` takes the first character of banana. So only b is printed."], "correct": 1, "why": "The comprehension keeps words with more than 4 letters: apple has 5 (kept), kiwi has 4 (dropped because 4 > 4 is False), banana has 6 (kept). So long is `['apple', 'banana']` and `len(long)` is 2. `long[-1]` is the last word, banana, and `[0]` is its first letter, b. print shows `2 b`. The rule: chained indexing works left to right, ist, so `b.append(9)` changes b to [2, 4, 9] and leaves a alone. print shows `[1, 2] [2, 4, 9]`. The rule: a list comprehension always creates a new list object. Exam tip: ask whether two names share an object before deciding whether a change shows up in both.", "code": "def double(L):\n    return [x * 2 for x in L]\n\na = [1, 2]\nb = double(a)\nb.append(9)\nprint(a, b)", "trace": {"steps": [{"k": "line", "n": 1, "src": "def double(L):", "fn": null, "t": "defines function double()"}, {"k": "line", "n": 4, "src": "a = [1, 2]", "fn": null, "t": "a = [1, 2]"}, {"k": "call", "t": "call double(L=[1, 2])"}, {"k": "line", "n": 2, "src": "return [x * 2 for x in L]", "fn": "double", "t": ""}, {"k": "ret", "t": "double returns [2, 4]"}, {"k": "line", "n": 5, "src": "b = double(a)", "fn": null, "t": "b = [2, 4]"}, {"k": "line", "n": 6, "src": "b.append(9)", "fn": null, "t": "b = [2, 4, 9]"}, {"k": "line", "n": 7, "src": "print(a, b)", "fn": null, "t": "prints [1, 2] [2, 4, 9]"}], "more": 0}}, {"n": 234, "section": "Combined (harder)", "options": ["Scie", "data", "scie", "scien"], "reasons": ["You skipped `.lower()`. It runs first, so the capital S is already gone. The result is all lower case.", "You took the first word. Index `[1]` is the second element of the list, science. Lists start at index 0.", null, "You included index 4. `[:4]` takes indices 0 to 3, which are four characters. The fifth letter n is not included."], "correct": 3, "why": "Read the chain from left to right. `text.lower()` gives \"data science\". `.split()` splits at whitespace into `['data', 'science']`, and `[1]` takes the second word, \"science\". `[:4]` takes the first four characters, s, c, i, e, which gives scie. The rule: each method or index in a chain works on the result of the step before it. Exam tip: write down the intermediate value after every dot or bracket.", "code": "text = \"Data Science\"\nprint(text.lower().split()[1][:4])", "trace": {"steps": [{"k": "line", "n": 1, "src": "text = \"Data Science\"", "fn": null, "t": "text = 'Data Science'"}, {"k": "line", "n": 2, "src": "print(text.lower().split()[1][:4])", "fn": null, "t": "prints scie"}], "more": 0}}, {"n": 235, "section": "Combined (harder)", "options": ["['Ana', 'Ben']", "['ana', 'ben']", "['ANA', 'BEN']", "Ana; Ben"], "reasons": [null, "You assumed the loop cannot change the list. `names[i] = ...` writes into the list at index i. Only `n = n.title()` would have no effect on the list.", "You confused `title()` with `upper()`. title capitalises only the first letter of each word. So ana becomes Ana.", "print is after the loop and prints the list once. The output keeps the brackets and quotes of a list. There is one line."], "correct": 1, "why": "enumerate gives pairs of position and value: (0, \"ana\") and then (1, \"ben\"). In each round `names[i] = n.title()` writes the capitalised word back into the list at that position, giving Ana and then Ben. The list itself has been changed, so print shows `['Ana', 'Ben']`. The rule: assigning through an index changes the list, while assigning to the loop variable n alone would not. Exam tip: `title()` capitalises the first letter of each word.", "code": "names = [\"ana\", \"ben\"]\nfor i, n in enumerate(names):\n    names[i] = n.title()\nprint(names)", "trace": {"steps": [{"k": "line", "n": 1, "src": "names = [\"ana\", \"ben\"]", "fn": null, "t": "names = ['ana', 'ben']"}, {"k": "line", "n": 2, "src": "for i, n in enumerate(names):", "fn": null, "t": "i = 0; n = 'ana'"}, {"k": "line", "n": 3, "src": "names[i] = n.title()", "fn": null, "t": "names = ['Ana', 'ben']"}, {"k": "line", "n": 2, "src": "for i, n in enumerate(names):", "fn": null, "t": "i = 1; n = 'ben'"}, {"k": "line", "n": 3, "src": "names[i] = n.title()", "fn": null, "t": "names = ['Ana', 'Ben']"}, {"k": "line", "n": 2, "src": "for i, n in enumerate(names):", "fn": null, "t": "no items left, loop ends"}, {"k": "line", "n": 4, "src": "print(names)", "fn": null, "t": "prints ['Ana', 'Ben']"}], arder)", "options": ["7; 1", "10; 7; 1", "7; 4; 1", "7; 1; -2"], "reasons": ["You stopped when x became 1. At the top of the next round 1 > 0 is True, so x becomes -2 and is printed. The condition is checked only before the round.", "You printed x before decreasing it. The line `x -= 3` comes before print in the loop. The first printed value is 7.", "You printed 4 and stopped too early. When x is 4, continue skips the print. The loop also runs once more from 1 and prints -2.", null], "correct": 4, "why": "Trace each round. x = 10 > 0: x becomes 7, which is printed. x = 7 > 0: x becomes 4, so continue skips the print. x = 4 > 0: x becomes 1, printed. x = 1 > 0: x becomes -2, printed. Now -2 > 0 is False and the loop ends. The output is 7, 1 and -2. The rule: the while condition is checked only at the top of each round, so a value can go below 0 inside the round and still be printed. Exam tip: decrease first, then check, then print, in the exact order of the code.", "code": "x = 10\nwhile x > 0:\n    x -= 3\n    if x == 4:\n        continue\n    print(x)", "trace": {"steps": [{"k": "line", "n": 1, "src": "x = 10", "fn": null, "t": "x = 10"}, {"k": "line", "n": 2, "src": "while x > 0:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "x -= 3", "fn": null, "t": "x = 7"}, {"k": "line", "n": 4, "src": "if x == 4:", "fn": null, "t": "condition is False"}, {"k": "line", "n": 6, "src": "print(x)", "fn": null, "t": "prints 7"}, {"k": "line", "n": 2, "src": "while x > 0:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "x -= 3", "fn": null, "t": "x = 4"}, {"k": "line", "n": 4, "src": "if x == 4:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 5, "src": "continue", "fn": null, "t": ""}, {"k": "line", "n": 2, "src": "while x > 0:", "fn": null, "t": "condition is True"}, {"k": "line", "n": 3, "src": "x -= 3", "fn": null, "t": "x = 1"}, {"k": "line", "n": 4, "src": "if x == 4:", "fn": null, "t": "condition is False"}, {"k": "lin
